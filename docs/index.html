<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
</style>
<title>Nutri Prático</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Prático">
<style>
/* Layout: uma coluna de app nativo (máx. 600px) sobre preto quente, barra de abas no rodapé.
   Superfícies em grafite separam os blocos; o cobre marca só o essencial; macros em champanhe, pátina, rosé e sálvia. */
:root{
  --bg:#0A0908; --surface:#191614; --surface-2:#221E1B; --surface-3:#2B2622;
  --ink:#F4EEE8; --ink-2:#CDC3B9; --muted:#968B81; --line:#2D2824; --line-2:#3B352F;
  --accent:#E08C4E; --accent-2:#F2A468; --accent-ink:#1C0E05; --accent-soft:#2F1E12; --accent-line:#6B4226;
  --carb:#E58D4D; --prot:#AE625C; --prot-ink:#CB8078; --fat:#E9C56F; --fib:#86AB91; --ring:#CDC3B9; --food:#E08C4E; --move:#5FC4B8; --sleep:#9C93EE; --mood:#E58BB0; --danger:#FF7D74; --danger-soft:#33191A; --ok:#8FCB9B;
  --hero-1:#2E1D11; --hero-2:#181513; --scrim:rgba(0,0,0,.62); --shadow:0 14px 36px rgba(0,0,0,.5);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --tabbar:64px;
  /* Design system: espaçamento em base 4, raios e escala tipográfica (em rem: acompanha o tamanho de texto do iPhone) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-s:12px; --r-m:16px; --r-l:20px; --r-xl:24px;
  --t-cap:.68rem; --t-sm:.76rem; --t-body:.88rem; --t-h:1rem; --t-title:1.3rem; --t-page:1.76rem; --t-num:1.18rem; --t-num-l:2.3rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:0.882rem;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px))}
.view{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cabeçalho fixo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:0.941rem}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:70%}
.who .av{width:30px;height:30px;font-size:0.706rem;border-width:1px}
.who b{font-weight:600;font-size:0.882rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{width:14px;height:14px;color:var(--muted);flex:none}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* Barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));transition:transform .2s}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:0.647rem;font-weight:600;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-2)}
body.typing .tabbar{transform:translateY(110%)}

h1{font-size:1.882rem;line-height:1.08;letter-spacing:-.035em;font-weight:650;margin:16px 0 4px;text-wrap:balance}
h2.sec{font-size:0.765rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
.sub{color:var(--muted);font-size:0.824rem}
.eyebrow{font-size:0.647rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-t{font-weight:620;font-size:0.971rem;letter-spacing:-.01em}
.hero{background:linear-gradient(155deg,var(--hero-1),var(--hero-2) 72%);border:1px solid var(--accent-line)}
.note{font-size:0.735rem;color:var(--muted);margin-top:8px;line-height:1.5}
.warn{color:var(--accent-2)}

/* Botões e campos */
.btn{height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft);border:1px solid transparent}
.btn.plain{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 13px;font-size:0.794rem;border-radius:11px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:0.735rem;color:var(--muted);font-weight:500}
.input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:1rem;outline:none;width:100%}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:var(--danger);font-size:0.765rem;min-height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{height:40px;border-radius:10px;font-weight:550;font-size:0.824rem;color:var(--muted);padding:0 4px;line-height:1.1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crit button{font-size:0.735rem;letter-spacing:-.01em;padding:0 2px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.seg.big button{height:46px;font-size:0.882rem}
.sheet .seg{background:var(--surface-2)}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:0.735rem;height:44px;letter-spacing:-.01em;padding:0 2px;white-space:normal}
@media (max-width:370px){.seg4{grid-template-columns:repeat(2,1fr)}}
.row-actions{display:flex;gap:10px;margin-top:8px}
.row-actions .btn{flex:1}
.confirm{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:0.824rem;color:var(--ink-2)}
.ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger-soft);font-size:0.824rem;color:var(--ink)}
.ask span{flex:1 1 140px}
.ask-b{display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-height:92%;overflow:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:1.294rem;letter-spacing:-.02em;margin:0 0 4px;font-weight:650;text-wrap:balance}
.sheet .sh-sub{font-size:0.794rem;color:var(--muted);margin:0 0 16px}
.bk-row{display:flex;flex-direction:column;gap:10px}

/* Autocompletar */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface-3);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px;overscroll-behavior:contain}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;min-height:44px}
.ac-item.on{background:var(--accent-soft)}
.ac-item.pend{background:var(--danger-soft)}
.ac-l{flex:1;min-width:0;font-size:0.882rem}
.ac-l b{font-weight:650;color:var(--accent-2)}
.ac-m{font-size:0.706rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-x{min-width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:1.059rem;line-height:1;padding:0 6px}
.ac-item.pend .ac-x{color:var(--danger);font-size:0.765rem;font-weight:600;background:var(--surface-2)}
.ac-sec{font-size:0.588rem;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}

/* Avatares e listas */
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:600;font-size:0.882rem;flex:none;letter-spacing:-.01em}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;border-top:1px solid var(--line);text-align:left;min-height:56px}
.li:first-child{border-top:0}
.li:active{background:var(--surface-2)}
.li-m{flex:1;min-width:0}
.li-t{font-weight:560;font-size:0.941rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t b{color:var(--accent-2);font-weight:inherit}
.li-s{color:var(--muted);font-size:0.765rem;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:grid;width:22px;height:22px;color:var(--accent-2);flex:none}
.check svg{width:22px;height:22px}
.li > svg,.li-go svg,.li > span[style] > svg{width:18px;height:18px;color:var(--muted);flex:none}
.av svg{width:20px;height:20px}
.chip{display:inline-block;font-size:0.559rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:8px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:6px}

/* Totais: nome do macro colorido, gramas e % na 1ª linha, g/kg na 2ª; fibras numa linha própria */
.mwrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid > div{min-width:0;text-align:center;border-left:1px solid var(--line-2);padding:0 4px}
.mgrid > div:first-child{border-left:0}
.mgrid .k{font-size:0.735rem;font-weight:650;letter-spacing:.01em}
.mgrid .v{font-size:1.235rem;font-weight:650;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.mgrid .v small{font-size:0.765rem;font-weight:550;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.mgrid .pc{font-size:0.735rem;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.mgrid .s{font-size:0.706rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fib{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-2);font-size:0.765rem;font-variant-numeric:tabular-nums}
.fib .t-f{font-weight:650}
.fib b{font-weight:650;font-size:0.882rem}
.fib .s{margin-left:auto;color:var(--muted);font-size:0.706rem}
.mwrap.sm{margin-top:0;padding-top:0;border-top:0}
.mwrap.sm .k{font-size:0.706rem}
.mwrap.sm .v{font-size:1rem}
.mwrap.sm .v small{font-size:0.706rem}
.mwrap.sm .pc{font-size:0.676rem}
.mwrap.sm .s{font-size:0.676rem}
.mwrap.sm .fib{margin-top:9px;padding-top:8px;border-top-color:var(--line)}
.mwrap.sm .mgrid > div{border-left-color:var(--line)}
@media (max-width:370px){.mgrid .v{font-size:1.059rem}.mwrap.sm .v{font-size:0.882rem}.mgrid .pc{margin-left:3px}}
/* macros: âmbar (carboidratos), terracota (proteínas), amarelo (gorduras), sálvia (fibras).
   Em texto, a proteína usa --prot-ink (contraste 5,5:1); a cor de referência fica para anéis e marcadores. */
.t-c{color:var(--carb)} .t-p{color:var(--prot-ink)} .t-g{color:var(--fat)} .t-f{color:var(--fib)}
.miss{margin-top:10px;font-size:0.706rem;color:var(--accent-2)}

/* Resumo fixo do plano, dentro do cabeçalho */
.sumbar{max-width:600px;margin:8px auto 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);width:100%;font-size:0.735rem;font-variant-numeric:tabular-nums}
.sumbar .k{display:flex;align-items:baseline;gap:4px;white-space:nowrap;color:var(--muted)}
.sumbar .k b{font-size:0.941rem;color:var(--ink);font-weight:650;letter-spacing:-.02em}
.sumbar .pc{font-size:0.647rem;font-weight:650;color:var(--accent-2);padding:2px 7px;border-radius:999px;background:var(--accent-soft);margin-left:4px}
.sumbar .m{display:flex;gap:10px;margin-left:auto;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.sumbar .m b{font-weight:700;margin-right:2px}
.sumbar svg{width:14px;height:14px;color:var(--muted);flex:none}
@media (max-width:370px){.sumbar .m{gap:7px}.sumbar .k span.u{display:none}}

/* Início */
.hello{margin:18px 0 18px}
.hello h1{margin:0 0 4px}
.cta{display:flex;align-items:center;gap:14px}
.cta .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.cta .ic svg{width:20px;height:20px}
.cta div{flex:1;min-width:0;font-size:0.794rem;color:var(--muted)}
.cta b{display:block;color:var(--ink);font-size:0.912rem;font-weight:600;margin-bottom:1px}
.link{font-size:0.794rem;font-weight:600;color:var(--accent-2);padding:6px 2px}

/* Painel circular: anel externo = planejado ÷ meta; anel interno = divisão da energia entre os macronutrientes */
.dial{position:relative;padding:14px 14px 12px;border-radius:24px;border:1px solid var(--line);background:var(--surface)}
.dial-wrap{position:relative;width:min(100%,292px);aspect-ratio:1;margin:0 auto}
.dial-svg{display:block;width:100%;height:100%;overflow:visible}
.dial-svg circle{fill:none}
.ticks line{stroke:#4A423A;stroke-width:2;stroke-linecap:round}
.ticks line.lit{stroke:var(--ring)}
.trk{stroke:#231F1C;stroke-width:9}
.trk.in{stroke:#1E1B18;stroke-width:15}
.prog{stroke:var(--ring);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.prog.over{stroke:var(--accent-2)}
.arc{stroke-width:15;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1) .15s,opacity .2s,stroke-width .2s}
.arc.t-c{stroke:var(--carb)} .arc.t-p{stroke:var(--prot)} .arc.t-g{stroke:var(--fat)}
.arc.dim{opacity:.22}
.arc.sel{stroke-width:19}
.dial-c{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dial-k{font-size:clamp(36px,11vw,46px);font-weight:640;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.dial-m{font-size:0.765rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p{margin-top:9px;font-size:0.706rem;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p.over{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dial-p.dim{background:transparent;color:var(--muted);border-color:var(--line-2)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.key{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;text-align:center;min-width:0;transition:opacity .2s,border-color .2s}
.key .k{font-size:0.706rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.key .v{font-size:1.118rem;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.key .v small{font-size:0.706rem;font-weight:550;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.key .s{font-size:0.706rem;color:var(--muted);font-variant-numeric:tabular-nums}
.key.on{border-color:var(--accent-line);background:var(--accent-soft)}
.key.dim{opacity:.5}
.dial-d{min-height:20px;margin-top:10px;text-align:center;font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.5}
.dial-d b{font-weight:650}
.dial-d .nw{white-space:nowrap}
.dial .miss{text-align:center}
.dial.compact .dial-wrap{width:min(100%,236px)}
.dial.compact .dial-k{font-size:2.353rem}
.dial.compact .dial-c{inset:20%}
.dial.compact .keys{margin-top:8px}
.dial.compact .key{padding:7px 4px 6px}
.dial.compact .key .v{font-size:1rem}
.sheet .dial{margin-top:4px}

/* Plano */
.plan-head{display:grid;grid-template-columns:1fr 112px;gap:10px;margin-top:14px}
.meals{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:visible}

.meal.open .mh{border-radius:var(--r) var(--r) 0 0;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:default}
.mh-m{flex:1;min-width:0}

.mh-s{font-size:0.765rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-k{font-size:0.941rem;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}

.chev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.chev svg{width:18px;height:18px}
.meal.open .chev{transform:rotate(180deg)}
.meal-name{width:100%;border:0;background:transparent;font-size:1rem;font-weight:650;letter-spacing:-.015em;outline:none;padding:4px 0;color:var(--accent-2);text-overflow:ellipsis}
.meal-name::placeholder{color:var(--muted);font-weight:500}
.mtools{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 16px}
.tw{position:relative;flex:none;width:96px;height:34px}
.tw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;border:1px dashed var(--line-2);border-radius:10px;font-size:0.765rem;color:var(--muted);pointer-events:none}
.tw span svg{width:14px;height:14px}
.tw.has span{display:none}
.meal-time{position:absolute;inset:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);text-align:center;font-size:0.941rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0 6px;margin:0;min-width:0}

.tw:not(.has) .meal-time{opacity:0}
.mtools .btn.sm{height:34px}
.meal-ask{padding:0 12px}
.meal-ask:empty{display:none}

/* Alimento dentro da refeição */
.it{border-top:1px solid var(--line)}
.mbody .it:first-child{border-top:0}
.it-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;width:100%;padding:12px 16px;text-align:left}
.it-name{font-size:0.912rem;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-name.gone{color:var(--muted);font-style:italic}
.it-k{font-size:0.882rem;font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.it-k small{font-size:0.676rem;color:var(--muted);font-weight:500;margin-left:2px}
.it-sub{font-size:0.765rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-sub b{color:var(--ink-2);font-weight:600}
.it.edit{background:var(--bg)}
.it.edit .it-main{padding-bottom:6px}
.it-ed{padding:0 16px 14px}
.ed-l{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center}
.cell{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;font-size:0.941rem;outline:none;width:100%;min-width:0;text-overflow:ellipsis}
.cell:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.qty{text-align:center;font-weight:650;font-variant-numeric:tabular-nums;padding:0 4px;font-size:1rem}
.grams{text-align:right;font-weight:620;font-variant-numeric:tabular-nums;font-size:0.882rem;white-space:nowrap;min-width:44px}
.ed-m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px;font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ed-m span{white-space:nowrap}
.ed-m b{font-weight:700;margin-right:3px}
.quick{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;height:36px;min-width:44px;padding:0 10px;border-radius:10px;background:var(--surface-3);font-weight:620;font-variant-numeric:tabular-nums;text-align:center}
.quick button.next{background:var(--accent);color:var(--accent-ink);margin-left:auto;padding:0 14px}
.ed-a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ed-a .btn{flex:1 1 auto}
.add{padding:8px 12px 10px 16px;border-top:1px solid var(--line)}
.add-in{width:100%;height:44px;border:0;background:transparent;font-size:0.941rem;outline:none;padding:0}
.add-in::placeholder{color:var(--muted)}
.add-l{display:flex;align-items:center;gap:8px;color:var(--muted)}
.add-l svg{width:18px;height:18px;flex:none;color:var(--accent-2)}
.mfoot{padding:11px 12px 12px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.mfoot .eyebrow{margin:0 0 8px 4px}
.add-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.add-meal{width:100%;height:54px;border-radius:var(--r);border:1.5px dashed var(--line-2);color:var(--ink-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.add-meal svg{width:18px;height:18px;flex:none}
.clipbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 6px 9px 14px;border-radius:var(--r);border:1px solid var(--accent-line);background:var(--accent-soft)}
.cb-i svg{width:18px;height:18px;color:var(--accent-2);display:block}
.cb-t{flex:1;min-width:0;font-size:0.735rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-t b{display:block;font-size:0.824rem;color:var(--ink);font-weight:600}
.clipbar .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.clipbar .x svg{width:16px;height:16px}

/* Alimentos */
.search{position:relative;margin:14px 0 12px}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:0.941rem;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.star{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:none}
.star svg{width:19px;height:19px}
.star.on{color:var(--accent-2)}
.nut{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center;margin-top:12px}
.nut div{background:var(--surface-2);border-radius:12px;padding:9px 2px}
.nut .k{font-size:0.647rem;font-weight:650}
.nut .v{font-size:0.941rem;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nut .v small{font-size:0.647rem;color:var(--muted);font-weight:500;margin-left:1px}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mchips button{height:34px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-size:0.794rem;color:var(--ink-2)}
.food-li{padding-right:6px;cursor:pointer}
.food-li .li-t{display:flex;align-items:center;gap:6px;font-size:0.912rem}

.mini-n{display:flex;gap:9px}

.src-b.own{color:var(--accent-2);border-color:var(--accent-line)}
.mini-n b{color:var(--ink-2);font-weight:600}
.mini-n i{font-style:normal;font-weight:700;margin-right:1px}
.xtra{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:0.735rem;color:var(--muted)}
.xtra b{color:var(--ink-2);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left;font-size:0.765rem;color:var(--muted)}
.choice b{display:block;color:var(--ink);font-size:0.912rem;font-weight:600;margin-bottom:2px}
.choice .ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.choice .ic svg{width:22px;height:22px}
.choice[disabled]{opacity:.5}
.scan-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.scan-bar i{display:block;height:100%;width:4%;background:var(--accent);border-radius:3px;transition:width .3s}
.scan-s{font-size:0.794rem;color:var(--ink-2);margin:12px 0 0;line-height:1.5}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opt{color:var(--muted);font-weight:400;opacity:.8}
.input.flag{border-color:var(--accent);background:var(--accent-soft)}
.fl-n{font-size:0.676rem;color:var(--accent-2);line-height:1.35;margin-top:-2px}
details.adv{margin:4px 0 12px}
details.adv summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:0.824rem;font-weight:600;color:var(--ink-2);padding:10px 0}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin:-3px 0 0 auto;transition:transform .2s}
details.adv[open] summary::after{transform:rotate(225deg);margin-top:3px}
details.formulas{padding:4px 16px 14px;margin:0}
details.formulas summary{font-size:0.882rem}
.eq-n{font-size:0.706rem;color:var(--ink-2);margin:12px 0 0;font-variant-numeric:tabular-nums;line-height:1.5}
.act{margin-top:16px}
.act-t{font-size:0.735rem;color:var(--muted);font-weight:500;margin-bottom:7px}
.act-t span{color:var(--ink-2);font-weight:600}
.btn.set[disabled]{opacity:1;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line)}
.meta-n{margin:0;text-align:center;font-size:0.735rem;color:var(--muted)}
.meta-n:empty{display:none}
.li.fam{padding:0 8px 0 0;gap:4px}
.fam-b{display:flex;align-items:center;gap:13px;flex:1;min-width:0;padding:12px 8px 12px 16px;text-align:left}
.li.fam .icon-btn{background:transparent;border-color:transparent;color:var(--muted)}
.li.fam.cur .av{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2.sec .sec-n{float:right;letter-spacing:.02em;text-transform:none;font-weight:500}
.mchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}

/* Substituição */
.crit{margin:4px 0 12px}
.subs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.so{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 12px;border-radius:13px;background:var(--surface-2);border:1px solid transparent;text-align:left;width:100%}
.so.on{border-color:var(--accent);background:var(--accent-soft)}
.so-n{font-weight:600;font-size:0.882rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-k{font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.so-q{font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-d{font-size:0.706rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.confirmbar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin:12px -18px calc(-18px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line-2)}
.confirmbar p{margin:0 0 10px;font-size:0.794rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Perfil e energia */
.measures{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{position:relative}
.mfield input{height:58px;font-size:1.412rem;font-weight:600;letter-spacing:-.02em;padding-right:44px}
.mfield span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.824rem;pointer-events:none}
.big{font-size:2.235rem;font-weight:620;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:0.824rem;font-weight:500;letter-spacing:0;margin-left:4px;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.res > div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.res .k{font-size:0.618rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:650}
.res .v{font-size:1.176rem;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}

.eq{margin-top:12px;font-size:0.676rem;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums}
.datacard{display:flex;align-items:center;gap:12px}
.datacard.due{border-color:var(--accent-line)}
.dc-ic svg{width:18px;height:18px;color:var(--muted);display:block}
.dc-t{flex:1;min-width:0;font-size:0.735rem;color:var(--muted)}
.dc-t b{display:block;color:var(--ink);font-size:0.824rem;font-weight:600}
@media (max-width:370px){.big{font-size:1.824rem}.big small{font-size:0.706rem;margin-left:2px}.datacard{flex-wrap:wrap}.datacard .dc-t{flex:1 1 0}.datacard .btn{width:100%}}
.prose{font-size:0.824rem;color:var(--ink-2);line-height:1.6}
.prose h3{font-size:0.882rem;color:var(--ink);margin:18px 0 4px}
.prose p{margin:0 0 8px}

/* Refeição feita e favoritas */
.done-w{display:contents}
.done{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.done svg{width:16px;height:16px}
.done.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done[disabled]{opacity:.3}
.mh .done{margin-right:-2px}
.favs{margin-top:16px}
.favs-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.favs-l{display:flex;flex-direction:column;gap:6px}
.fav{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--accent-line);text-align:left;font-size:0.882rem}
.fav svg{width:16px;height:16px;color:var(--accent-2);flex:none}
.fav .nm{flex:1;min-width:0;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Design system v5 =====
   Pilares: alimentação (cobre), movimento (turquesa), sono (violeta), bem-estar (rosa). Cada um tinge só o próprio módulo.
   Superfície padrão .panel: grafite, raio 20, sem contorno; título .panel-h. */

.st i.on{background:var(--c)}
.st i.m1{background:#6F6A86} .st i.m2{background:#8C7F92} .st i.m3{background:#A89280} .st i.m4{background:#D49A6A} .st i.m5{background:var(--accent-2)}
.st span{font-size:0.647rem;color:var(--muted)}
.st.now span{color:var(--ink);font-weight:650}
.hp.full .st i{width:13px;height:13px}
.hp.full .bars{height:76px}
.hp.full .mline{height:56px}
.hp-n{margin:12px 2px 0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.hp-link{margin:12px 2px 0;display:block}
details.src.more{margin:var(--s3) 2px 0}
.panel details.src.more{margin:var(--s2) 2px 0}
details.src.more p + p{margin-top:var(--s2)}
.view > details.src.more{margin:var(--s5) 4px 0}
/* v9 · Perfil: necessidade energética recolhível */
.ecard.fold{padding:0;overflow:hidden}
.ec-h{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;text-align:left}
.ec-h:active{background:var(--surface-2)}
.ec-h .pr-m b{font-size:0.882rem;font-weight:600}
.ec-h .pr-m span b.ec-v{display:inline;font-size:inherit;font-weight:620;color:var(--accent-2);font-variant-numeric:tabular-nums}
.ec-c{display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.ec-c svg{width:16px;height:16px}
.ecard.open .ec-c{transform:rotate(180deg)}
.ecard.open{padding-bottom:var(--s4)}
.ec-b{padding:0 var(--s4)}
.hstack .na{flex-direction:row;align-items:center;gap:12px;padding:12px 14px}
.hstack .na b{font-size:var(--t-body)}
/* v9 · iPhone SE: abas da Saúde e linhas do Perfil sem cortes */
@media (max-width:370px){
  .hseg{gap:2px;padding:3px}.hseg button{font-size:0.7rem;padding:0 1px;letter-spacing:-.01em}
  .prow .pr-m span,.ec-h .pr-m span,.idc .pr-m span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
  .prow .pr-m b{white-space:normal;line-height:1.25}
  .etile b{font-size:1.35rem;white-space:nowrap}
}
.hist details.hmore{margin:0}
.hist details.hmore summary{padding:var(--s3) 2px var(--s1)}
.hist details.hmore[open] summary{border-bottom:1px solid var(--line)}
/* ===== Home v10 — bloco único (substitui as camadas anteriores de .mod, .np, .nl e .fig) ===== */
.hi-h{margin:var(--s1) 2px var(--s4)}
.hi-h .today{margin:0 0 2px;font-size:var(--t-sm);color:var(--muted);font-weight:500}
.hi-h h1{margin:0;font-size:var(--t-page);font-weight:650;letter-spacing:-.03em;line-height:1.12}
/* pilares: rótulo na cor do pilar, valor e período; sem ícone (a cor e o rótulo já identificam) */
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.mods.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mod{--c:var(--food);display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:11px 9px 10px;border-radius:var(--r-m);text-align:left;
  background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 16%,transparent);transition:transform .15s}
.mod.move{--c:var(--move)} .mod.sleep{--c:var(--sleep)} .mod.wb{--c:var(--mood)}
.mod:active{transform:scale(.97)}
.mod-l{font-size:var(--t-cap);font-weight:620;color:var(--c);line-height:1.2;white-space:nowrap}
.mod b{margin-top:7px;font-size:1.06rem;font-weight:650;letter-spacing:-.025em;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.mod b.long{font-size:var(--t-body);letter-spacing:-.01em;white-space:normal}
.mods .mod b.nr{margin:7px 0 0;font-size:1.06rem;line-height:1.15;font-weight:500;color:var(--muted);letter-spacing:0}
@media (max-width:370px){.mods .mod b.nr{margin-top:3px;font-size:1rem}}
html.big-text .mods .mod b.nr{margin-top:3px}
.mod-s{margin-top:2px;font-size:var(--t-cap);color:var(--muted);line-height:1.25}
/* plano do dia: anel protagonista, legenda alinhada e faixa discreta com meta e necessidade */
.np{display:block;width:100%;margin-top:var(--s3);padding:var(--s4) 14px var(--s3);border-radius:var(--r-xl);background:var(--surface);text-align:left}
.np-h{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:24px;padding:0 2px;font-size:var(--t-body);font-weight:620;letter-spacing:-.01em;color:var(--ink);text-align:left}
.np-h .li-go svg{width:16px;height:16px;color:var(--muted);display:block}
.np-b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;width:100%;margin-top:var(--s3);text-align:left}
.np .dial-wrap.mini.gx{width:clamp(118px,34.5vw,152px);margin:0}
.np .dial-wrap.mini .ticks{display:none}
.np .dial-wrap.mini .trk,.np .dial-wrap.mini .prog,.np .dial-wrap.mini .eatarc{stroke-width:7}
.np .dial-wrap.mini .trk.in,.np .dial-wrap.mini .arc{stroke-width:13}
.np .dial-wrap.mini .dial-c{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.np .dial-wrap.mini .dial-k{font-size:1.65rem;font-weight:650;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.np .dial-wrap.mini .dial-m{margin-top:4px;font-size:var(--t-cap);color:var(--muted);white-space:nowrap;line-height:1.1}
.np-l{display:flex;flex-direction:column;gap:10px;min-width:0}
.nl{display:grid;grid-template-columns:8px minmax(0,1fr) auto 2.35em;column-gap:7px;align-items:center;line-height:1.2;font-variant-numeric:tabular-nums}
.nl .sw{width:8px;height:8px;border-radius:2px}
.sw.c{background:var(--carb)} .sw.p{background:var(--prot)} .sw.g{background:var(--fat)} .sw.f{background:var(--fib)}
.nl span{font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl b{font-size:var(--t-sm);font-weight:620;text-align:right;white-space:nowrap}
.nl small{font-size:var(--t-cap);color:var(--muted);text-align:right}
.band{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--s3);margin-top:var(--s4);padding:10px 12px;border-radius:var(--r-m);background:var(--surface-2)}
.fig{display:flex;flex-direction:column;gap:1px;min-width:0}
.fig > span{font-size:var(--t-cap);color:var(--muted);white-space:nowrap}
.fig b{font-size:var(--t-body);font-weight:620;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig b small{font-size:var(--t-cap);font-weight:500;color:var(--muted);letter-spacing:0}
.fig b.nr{font-size:var(--t-sm);font-weight:550;color:var(--muted)}
.band.n3 .fig .opt{display:none}
.band.n3 .fig .pr{display:none}
.np-empty{display:flex;align-items:center;gap:var(--s3)}
.np-empty > div{flex:1;min-width:0}
.np-empty b{display:block;font-size:var(--t-h);font-weight:600}
.np-empty span{display:block;font-size:var(--t-sm);color:var(--muted)}
.step{display:flex;align-items:center;gap:var(--s3);width:100%;margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-l);background:var(--surface);text-align:left}
.step > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.step b{font-size:var(--t-body);font-weight:600}
.step span{font-size:var(--t-sm);color:var(--muted)}
.step-i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--accent-2);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.step-i svg{width:18px;height:18px}
.step .li-go svg{width:16px;height:16px;color:var(--muted);display:block}
/* iPhone SE e texto ampliado: pilares 2 × 2; legenda sem a coluna de % */
@media (max-width:370px){
  .hi-h{margin-bottom:var(--s3)} .hi-h h1{font-size:1.5rem}
  .mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .mod{padding:8px 11px 9px}.mod b{margin-top:3px;font-size:1rem}
  .np{padding:var(--s3) var(--s3) var(--s3)}
  .np-b{gap:var(--s3);margin-top:var(--s2)}
  .np .dial-wrap.mini.gx{width:108px}
  .np .dial-wrap.mini .dial-k{font-size:1.3rem}
  .np .dial-wrap.mini .dial-m{font-size:.58rem;margin-top:3px}

  .nl span{font-size:var(--t-cap)}
  .band{margin-top:var(--s3);padding:8px 10px}
  .fig .opt{display:none}
}

html.big-text .band.n3{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}

.sec-t{margin:var(--s5) 6px var(--s2);font-size:var(--t-sm);font-weight:600;color:var(--muted);letter-spacing:.01em;line-height:1.2}

.sc-btn{padding:var(--s3) var(--s4) var(--s4)}

.sc-m i{font-size:var(--t-cap);font-weight:600}

.st{gap:8px}

.hp.full .mchart{height:84px}
.hp.full .mchart .mline{height:64px}

.mdays span{width:auto;text-align:center}
.mdays span:last-child{color:var(--ink);font-weight:700}

.hstack .na-t{font-size:var(--t-sm)}

.idc{padding:var(--s4)}

.ecard.fold{margin:0;border-radius:0}
.ecard.open{padding-bottom:var(--s4)}

.np-l{container-type:inline-size}
.nl span{font-size:min(var(--t-sm),calc((100cqi - 94px) / 6.6))}

.prow .pr-m span,.ec-h .pr-m span{white-space:normal;line-height:1.3}

function blankState(){ return {version: VERSION, patients: [], foods: [], activeId: null, prefs: {objectives: DEFAULT_OBJ.slice(), meals: DEFAULT_MEALS.slice(), use: {}, last: {}, fav: [], recent: []}}; }
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}

  if (!S) { S = blankState(); return; }

  if (from < VERSION){

    S.version = VERSION;
  }
  S.patients = S.patients || []; S.foods = S.foods || [];
  S.prefs = Object.assign({objectives: DEFAULT_OBJ.slice(), meals: DEFAULT_MEALS.slice(), use: {}, last: {}}, S.prefs || {});
  S.prefs.fav = S.prefs.fav || []; S.prefs.recent = S.prefs.recent || []; S.prefs.savedMeals = S.prefs.savedMeals || [];
  for (const p of S.patients){

    for (const m of p.plan.meals){ m.time = m.time || ""; m.items = m.items || []; }
    p.logs = p.logs || {};
    for (const k of ["move", "sleep", "mood", "eaten"]) p.logs[k] = p.logs[k] || [];
    // até a v2 o padrão era a média FAO/OMS + DRI: quem já usava continua vendo os mesmos números
    if (from < 3 && !p.energy.method && C.ageOf(p.birth) >= 18) p.energy.method = "media";

/* ---------- autocompletar ---------- */
function autocomplete(input, o){
  const list = h("div", {class: "ac", role: "listbox"}); list.hidden = true;
  const attach = () => { if (list.parentElement !== input.parentElement && input.parentElement) input.parentElement.append(list); };   // o campo pode ainda não estar na tela
  input.setAttribute("autocomplete", "off"); input.setAttribute("autocorrect", "off"); input.setAttribute("spellcheck", "false");
  let items = [], active = 0, nav = false, pend = -1;
  function render(){
    attach();
    items = o.items(input.value);
    if (!items.length || document.activeElement !== input) { list.hidden = true; return; }
    active = Math.min(active, items.length - 1);
    const kids = [];
    if (o.title && o.title(input.value)) kids.push(h("div", {class: "ac-sec"}, o.title(input.value)));
    items.forEach((it, i) => {
      const el = h("div", {class: "ac-item" + (i === active ? " on" : "") + (i === pend ? " pend" : ""), role: "option"},
        h("span", {class: "ac-l", html: i === pend ? `Remover “${esc(it.label)}” da lista?` : highlight(it.label, input.value)}),
        it.meta ? h("span", {class: "ac-m"}, it.meta) : null,
        it.removable ? h("button", {class: "ac-x", type: "button", "aria-label": i === pend ? "Confirmar remoção" : "Remover opção da lista"}, i === pend ? "Remover" : "×") : null);
      el.addEventListener("mousedown", e => e.preventDefault());
      el.addEventListener("click", e => {
        if (e.target.closest(".ac-x")) { if (pend === i) { pend = -1; o.onRemove(it); } else pend = i; render(); return; }
        if (pend === i) { pend = -1; render(); return; }
        pick(i);
      });
      kids.push(el);
    });
    list.replaceChildren(...kids);
    list.hidden = false;
  }
  function pick(i){ const it = items[i]; if (!it) return; list.hidden = true; o.onPick(it); }
  input.addEventListener("input", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("focus", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("blur", () => { list.hidden = true; o.onBlur && o.onBlur(); });
  input.addEventListener("keydown", e => {
    const open = !list.hidden && items.length;
    if (e.key === "ArrowDown" && open) { e.preventDefault(); nav = true; active = (active + 1) % items.length; render(); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); nav = true; active = (active - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter") {
      if (e.isComposing) return;
      if (open && (nav || (o.enterPicks ? o.enterPicks(input.value) : true))) { e.preventDefault(); pick(active); }
      else if (o.onEnter) { e.preventDefault(); list.hidden = true; o.onEnter(); }
    }
    else if (e.key === "Escape") list.hidden = true;
  });
  return {close(){ list.hidden = true; }};
}

/* ---------- Painel circular ----------
   Anel externo: energia planejada ÷ meta (0–100%, marcas em 25/50/75/100%; acima da meta o anel fica cheio e o excesso aparece em texto).
   Mostra sempre valores PLANEJADOS: o app ainda não registra o que foi consumido.
   Anel interno: divisão da energia entre carboidratos, proteínas e gorduras (Atwater 4/4/9; os três somam 100%). */
function dial(t, tg, W, o = {}){
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, a, ...kids) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); kids.forEach(k => e.append(k)); return e; };
  const s = C.macroSplit(t), pct = tg ? t.kcal / tg * 100 : null, fill = pct == null ? 0 : Math.min(pct, 100);
  const R1 = 124, R2 = o.mini ? 106 : 101, C1 = 2 * Math.PI * R1, C2 = 2 * Math.PI * R2;
  const MAC = [["c", "Carboidratos", "t-c", t.c, s.c], ["p", "Proteínas", "t-p", t.p, s.p], ["l", "Gorduras", "t-g", t.l, s.l]];
  let sel = null;
  // escala: quatro marcas (25, 50, 75 e 100% da meta); acendem quando alcançadas
  const ticks = sv("g", {class: "ticks"});
  for (let i = 0; i < 4; i++){
    const a = i / 4 * 2 * Math.PI - Math.PI / 2;
    ticks.append(sv("line", {x1: 150 + 141 * Math.cos(a), y1: 150 + 141 * Math.sin(a), x2: 150 + 133 * Math.cos(a), y2: 150 + 133 * Math.sin(a), class: fill >= (i ? i * 25 : 100) ? "lit" : ""}));
  }
  const hasEat = o.eaten != null && !!tg, eatFill = hasEat ? Math.min(o.eaten / tg * 100, 100) : 0;
  const prog = sv("circle", {cx: 150, cy: 150, r: R1, class: "prog" + (pct > 100 ? " over" : "") + (hasEat ? " plan" : ""), "stroke-dasharray": `${C1} ${C1}`, "stroke-dashoffset": C1, transform: "rotate(-90 150 150)"});
  // consumido: mesmo anel, cobre cheio sobre o planejado (cobre translúcido)
  const eatArc = hasEat ? sv("circle", {cx: 150, cy: 150, r: R1, class: "eatarc", "stroke-dasharray": `${C1} ${C1}`, "stroke-dashoffset": C1, transform: "rotate(-90 150 150)"}) : null;
  const gap = s.atwater ? 0.012 : 0;
  let start = 0;
  const arcs = MAC.map(([k, , cls, , share]) => {
    const len = Math.max(0, share / 100 - gap) * C2;
    const el = sv("circle", {cx: 150, cy: 150, r: R2, class: "arc " + cls, "data-k": k, "stroke-dasharray": `0 ${C2}`, "stroke-dashoffset": -start * C2 - gap * C2 / 2, transform: "rotate(-90 150 150)"});
    el.dataset.len = len; start += share / 100;
    return el;
  });
  const svg = sv("svg", {viewBox: "0 0 300 300", class: "dial-svg", "aria-hidden": "true"},
    ticks, sv("circle", {cx: 150, cy: 150, r: R1, class: "trk"}), prog, ...(eatArc ? [eatArc] : []), sv("circle", {cx: 150, cy: 150, r: R2, class: "trk in"}), ...arcs);
  const center = h("div", {class: "dial-c"},
    h("div", {class: "dial-k"}, k0(t.kcal)),
    h("div", {class: "dial-m"}, "kcal planejadas"),
    pct != null ? h("div", {class: "dial-p" + (pct > 100 ? " over" : "")}, pct > 100 ? `${Math.round(pct)}% · +${k0(t.kcal - tg)} kcal` : `${Math.round(pct)}% · meta ${k0(tg)}`) : h("div", {class: "dial-p dim"}, "sem meta definida"));
  const detail = h("div", {class: "dial-d", "aria-live": "polite"});
  const keys = h("div", {class: "keys", role: "group", "aria-label": "Macronutrientes"});
  function paintKeys(){
    put(keys, MAC.map(([k, name, cls, g, share]) => h("button", {class: "key" + (sel === k ? " on" : "") + (sel && sel !== k ? " dim" : ""), type: "button", "aria-pressed": String(sel === k),
      onclick: () => { sel = sel === k ? null : k; paintKeys(); }},
      h("span", {class: "k " + cls}, name), h("span", {class: "v"}, fmtG(g), h("small", null, "g")), h("span", {class: "s"}, `${Math.round(share)}%`))));
    arcs.forEach(a => { a.classList.toggle("sel", sel === a.dataset.k); a.classList.toggle("dim", !!sel && sel !== a.dataset.k); });
    const m = MAC.find(x => x[0] === sel);
    const seg = (...x) => h("span", {class: "nw"}, ...x);
    put(detail, m ? [seg(h("b", {class: m[2]}, m[1]), ` ${fmtG(m[3])} g`), seg(` · ${Math.round(m[4])}% da energia`), W ? seg(` · ${nf2.format(m[3] / W)} g/kg`) : null, seg(` · ${k0(m[3] * (m[0] === "l" ? 9 : 4))} kcal`)]
      : [seg(h("b", {class: "t-f"}, "Fibras"), ` ${fmtG(t.f)} g${t.miss.f ? "*" : ""}`), t.kcal ? seg(` · ${g1(t.f * 1000 / t.kcal)} g por 1.000 kcal`) : null]);
  }
  paintKeys();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    prog.setAttribute("stroke-dashoffset", C1 * (1 - fill / 100));
    if (eatArc && eatFill > 0) eatArc.setAttribute("stroke-dashoffset", C1 * (1 - eatFill / 100));
    arcs.forEach(a => a.setAttribute("stroke-dasharray", `${a.dataset.len} ${C2}`));
  }));
  const label = `Planejado ${k0(t.kcal)} kcal${tg ? ` de ${k0(tg)}, ${Math.round(pct)}% da meta` : ""}.${hasEat ? ` Consumido ${k0(o.eaten)} kcal.` : ""} Carboidratos ${fmtG(t.c)} g, ${Math.round(s.c)}%. Proteínas ${fmtG(t.p)} g, ${Math.round(s.p)}%. Gorduras ${fmtG(t.l)} g, ${Math.round(s.l)}%.`;
  if (o.mini){
    svg.setAttribute("viewBox", "20 20 260 260");
    put(center, h("div", {class: "dial-k"}, k0(t.kcal)), h("div", {class: "dial-m"}, "kcal planejadas"));
    return h("div", {class: "dial-wrap mini" + (o.big ? " gx" : ""), role: "img", "aria-label": label}, svg, center);
  }
  const ringKey = hasEat ? h("div", {class: "ringkey"}, h("span", null, h("i", {class: "rk-p"}), `Planejado ${k0(t.kcal)}`), h("span", null, h("i", {class: "rk-e"}), `Consumido ${k0(o.eaten)}`), h("span", null, `Meta ${k0(tg)} kcal`)) : null;
  return h("section", {class: "dial" + (o.compact ? " compact" : ""), "aria-label": label},
    o.head || null, h("div", {class: "dial-wrap"}, svg, center), ringKey, keys, detail, missNote(t), o.extra || null);
}

    plan.meals.push(m); touch(p); open.add(m.id); syncOpen();

    if (focusName) { card.querySelector(".meal-name").focus(); card.scrollIntoView({block: "start", behavior: "smooth"}); }
    paintSum(); return m;
  }
  function syncOpen(){ view.open = [...open]; try { sessionStorage.setItem(KEY + ".view", JSON.stringify(view)); } catch (e) {} }
  function rebuild(m, focus){
    const old = refs.get(m.id)?.card, el = buildMeal(m);
    if (old) old.replaceWith(el); else mealsEl.append(el);
    paintSum();
    if (focus) focus();
    return el;
  }
  function toggle(m){ if (open.has(m.id)) { open.delete(m.id); if (view.edit && m.items.some(i => i.id === view.edit)) view.edit = null; } else open.add(m.id); syncOpen(); rebuild(m); }

  /* copiar, colar, duplicar e mover */
  const clip = () => S.prefs.clip;
  const clipLabel = () => { const c = clip(); return c ? `${c.name || "Refeição"} · ${nItems(c.items.length)}` : ""; };
  const cloneItems = items => items.filter(i => db.has(i.foodId)).map(i => ({id: uid(), foodId: i.foodId, measure: i.measure, qty: i.qty}));
  function copyMeal(m){
    S.prefs.clip = {name: m.name.trim(), items: filled(m).map(i => ({foodId: i.foodId, measure: i.measure, qty: i.qty}))};
    save(); paintPasteNew(); toast(`${m.name.trim() || "Refeição"} copiada`);
  }
  function pasteInto(m, mode){
    m.items = (mode === "add" ? filled(m) : []).concat(cloneItems(clip().items));
    touch(p); open.add(m.id); syncOpen(); rebuild(m); toast("Refeição colada");
  }
  function askPaste(m){
    if (!filled(m).length) { pasteInto(m, "replace"); return; }
    ask(refs.get(m.id).askEl, `${m.name.trim() || "Esta refeição"} já tem ${nItems(filled(m).length)}. Colar ${clip().name || "a refeição copiada"}:`, [
      {label: "Somar", cls: "ghost", fn: () => pasteInto(m, "add")},
      {label: "Substituir", cls: "primary", fn: () => pasteInto(m, "replace")}]);
  }
  function duplicateMeal(m){
    const i = plan.meals.indexOf(m);
    const c = {id: uid(), name: m.name.trim() ? `${m.name.trim()} (cópia)` : "", time: "", items: cloneItems(filled(m))};
    plan.meals.splice(i + 1, 0, c); touch(p); open.add(c.id); syncOpen();
    const el = buildMeal(c); refs.get(m.id).card.after(el); paintSum(); toast("Refeição duplicada");
    el.scrollIntoView({block: "start", behavior: "smooth"});
  }
  /* Refeições com horário seguem a ordem do relógio; as sem horário ficam no fim, na ordem atual */
  function orderByTime(focusM){
    const before = plan.meals.map(x => x.id).join();
    const timed = plan.meals.filter(x => x.time).sort(byTime), untimed = plan.meals.filter(x => !x.time);
    plan.meals = [...timed, ...untimed];
    if (plan.meals.map(x => x.id).join() === before) return;
    touch(p);
    for (const x of plan.meals) mealsEl.append(refs.get(x.id).card);
    if (focusM) refs.get(focusM.id).card.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  function moveMeal(m, dir){
    const i = plan.meals.indexOf(m), j = i + dir;
    if (j < 0 || j >= plan.meals.length) return;
    [plan.meals[i], plan.meals[j]] = [plan.meals[j], plan.meals[i]]; touch(p);
    const a = refs.get(m.id).card, b = refs.get(plan.meals[i].id).card;
    if (dir < 0) b.before(a); else b.after(a);
    a.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  function paintPasteNew(){
    put(pasteNew, clip() && clip().items.length ? h("div", {class: "clipbar", role: "status"},
      h("span", {class: "cb-i", html: ICON.copy}),
      h("div", {class: "cb-t"}, h("b", null, "Refeição copiada"), clipLabel()),
      h("button", {class: "btn primary sm", type: "button", onclick: () => { addMeal(cloneItems(clip().items)); toast("Refeição colada"); }}, "Colar como nova"),
      h("button", {class: "x", type: "button", "aria-label": "Descartar refeição copiada", html: ICON.x, onclick: () => { S.prefs.clip = null; save(); paintPasteNew(); }})) : null);
  }
  function mealMenu(m){
    const i = plan.meals.indexOf(m), n = filled(m).length;
    actionSheet(m.name.trim() || "Refeição", n ? `${nItems(n)} · ${k0(mealTotal(m).kcal)} kcal` : "Sem alimentos", [
      n ? {label: "Copiar refeição", cls: "primary", fn: () => copyMeal(m)} : null,
      clip() && clip().items.length ? {label: `Colar aqui: ${clipLabel()}`, fn: () => askPaste(m)} : null,
      n || doneOf(p, m) ? {label: doneOf(p, m) ? "Desfazer o registro de hoje" : "Registrar como comida hoje", fn: () => toggleDone(p, m, () => paintMeal(m))} : null,
      n ? {label: favMeals().some(x => norm(x.name) === norm(m.name.trim() || "Refeição")) ? "Atualizar nas favoritas" : "Salvar como favorita", fn: () => { saveFavMeal(m); render(); }} : null,
      n ? {label: "Criar outra igual (duplicar)", fn: () => duplicateMeal(m)} : null,
      i > 0 ? {label: "Mover para cima", fn: () => moveMeal(m, -1)} : null,
      i < plan.meals.length - 1 ? {label: "Mover para baixo", fn: () => moveMeal(m, 1)} : null,
      {label: "Excluir refeição", cls: "danger", fn: () => {
        open.add(m.id); syncOpen(); const el = rebuild(m);
        ask(refs.get(m.id).askEl, `Excluir ${m.name.trim() ? "“" + m.name.trim() + "”" : "esta refeição"} e ${n ? "os " + nItems(n) : "ela"}?`, [{label: "Excluir", fn: () => {
          plan.meals = plan.meals.filter(x => x !== m); touch(p); el.remove(); refs.delete(m.id); paintSum();
        }}]);
      }}]);
  }

  function buildMeal(m){
    const isOpen = open.has(m.id);
    const card = h("section", {class: "meal" + (isOpen ? " open" : ""), "data-id": m.id});
    const kcalEl = h("div", {class: "mh-k"}), subEl = h("div", {class: "mh-s"});
    const askEl = h("div", {class: "meal-ask"}), footEl = h("div", {class: "mfoot"});
    refs.set(m.id, {card, kcalEl, subEl, footEl, askEl});
    const chev = h("button", {class: "chev", type: "button", "aria-label": isOpen ? "Recolher refeição" : "Abrir refeição", "aria-expanded": String(isOpen), html: ICON.chev, onclick: e => { e.stopPropagation(); toggle(m); }});
    let nameEl;
    if (isOpen){
      nameEl = h("input", {class: "meal-name", placeholder: nextMealName() || "Nome da refeição", value: m.name, enterkeyhint: "next", "aria-label": "Nome da refeição"});
      autocomplete(nameEl, {
        items: optionSource("meals"),
        onPick: it => { nameEl.value = it.value; m.name = it.value; touch(p); paintMeal(m); addIn.focus(); },
        onRemove: it => { S.prefs.meals = S.prefs.meals.filter(o => o !== it.value); save(); },
        enterPicks: v => !!v.trim() && !S.prefs.meals.some(o => norm(o) === norm(v.trim())) && optionSource("meals")(v).length > 0,
        onEnter: () => {
          if (!nameEl.value.trim() && nameEl.placeholder !== "Nome da refeição") nameEl.value = nameEl.placeholder;
          m.name = canonical("meals", nameEl.value); nameEl.value = m.name; rememberOption("meals", m.name); touch(p); paintMeal(m); addIn.focus();
        }
      });
      nameEl.addEventListener("input", () => { m.name = nameEl.value; touch(p); paintMeal(m); });
      nameEl.addEventListener("change", () => rememberOption("meals", nameEl.value));
    } else {
      nameEl = h("div", {class: "mh-n" + (m.name.trim() ? "" : " unnamed")}, m.name.trim() || "Refeição sem nome");
    }
    const done = h("span", {class: "done-w"});
    refs.get(m.id).done = done;
    const head = h("div", {class: "mh", role: isOpen ? null : "button", tabindex: isOpen ? null : "0", "aria-expanded": String(isOpen)}, done,
      isOpen ? null : h("span", {class: "mh-tm"}, m.time || "—"),
      h("div", {class: "mh-m"}, isOpen ? h("div", {class: "acw"}, nameEl) : nameEl, subEl), kcalEl, chev);
    if (!isOpen){
      head.addEventListener("click", () => toggle(m));
      head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(m); } });
    }
    card.append(head);
    let addIn = null;
    if (isOpen){
      const time = h("input", {class: "meal-time", type: "time", value: m.time || "", "aria-label": "Horário da refeição"});
      const tw = h("label", {class: "tw" + (m.time ? " has" : "")}, h("span", {html: ICON.clock + "Horário"}), time);
      const setTime = () => { m.time = time.value || ""; tw.classList.toggle("has", !!m.time); touch(p); paintMeal(m); };
      time.addEventListener("input", setTime);
      time.addEventListener("change", () => { setTime(); orderByTime(m); });
      time.addEventListener("blur", () => { setTime(); orderByTime(m); });
      const body = h("div", {class: "mbody"});
      for (const it of m.items) if (it.foodId) body.append(buildItem(m, it));
      addIn = h("input", {class: "add-in", placeholder: "Adicionar alimento", "aria-label": "Adicionar alimento à refeição", enterkeyhint: "search", autocapitalize: "off"});
      autocomplete(addIn, {
        items: foodItems, title: foodTitle, enterPicks: v => !!v.trim(),
        onPick: x => x.value.create ? addFoodChooser(x.value.create, f => addFood(m, f)) : addFood(m, x.value),
        onEnter: () => { if (!addIn.value.trim()) addMeal(); }
      });
      addIn.addEventListener("focus", () => setTimeout(() => addIn.scrollIntoView({block: "center", behavior: "smooth"}), 40));
      card.append(
        h("div", {class: "mtools"}, tw, h("div", {class: "spacer"}),
          filled(m).length ? h("button", {class: "tool" + (isFavMeal(m) ? " on" : ""), type: "button", "aria-pressed": String(isFavMeal(m)), "aria-label": isFavMeal(m) ? "Atualizar nas refeições favoritas" : "Salvar como refeição favorita",
            html: isFavMeal(m) ? ICON.starOn : ICON.star, onclick: () => { saveFavMeal(m); rebuild(m); }}) : null,
          filled(m).length ? h("button", {class: "tool", type: "button", "aria-label": "Duplicar refeição", html: ICON.dup, onclick: () => duplicateMeal(m)}) : null,
          h("button", {class: "tool", type: "button", onclick: () => mealMenu(m), "aria-label": "Mais ações da refeição", html: ICON.more})),
        askEl, body,
        h("div", {class: "add"}, h("label", {class: "add-l"}, ic("plus"), h("div", {class: "acw", style: "flex:1"}, addIn))),
        footEl);
      refs.get(m.id).addIn = addIn;
    }
    paintMeal(m);
    return card;
  }
  function paintMeal(m){
    const R = refs.get(m.id); if (!R) return;
    const t = mealTotal(m), n = filled(m).length;
    R.kcalEl.replaceChildren(k0(t.kcal), h("small", null, "kcal"));
    R.subEl.textContent = [R.card.classList.contains("open") ? m.time : "", nItems(n), doneOf(p, m) ? "feita" : ""].filter(Boolean).join(" · ");
    put(R.done, tracks(p) || doneOf(p, m) ? doneBtn(p, m, () => paintMeal(m)) : null);
    R.footEl.hidden = !t.kcal;
    put(R.footEl, h("div", {class: "eyebrow"}, totalOf(m.name)), macroGrid(t, p.energy.weight, true), missNote(t));
  }

  /* ---- alimento ---- */
  function addFood(m, f){
    m.items = m.items.filter(i => i.foodId);
    const it = {id: uid(), foodId: f.id, measure: lastMeasure(f), qty: null};
    m.items.push(it); touch(p); view.edit = it.id;
    rebuild(m, () => { const R = refs.get(it.id); R && R.qty.focus(); });
  }
  function closeEdit(m, it, next){
    if (it && !it.qty) { it.qty = 1; }
    if (it && it.foodId){ noteUse(it.foodId); S.prefs.last[it.foodId] = it.measure; }
    view.edit = null; touch(p);
    rebuild(m, next === "add" ? () => refs.get(m.id).addIn.focus() : null);
  }
  function buildItem(m, it){
    const f = db.get(it.foodId);
    const editing = view.edit === it.id;
    const row = h("div", {class: "it" + (editing ? " edit" : "")});
    const kEl = h("span", {class: "it-k"}), subEl = h("span", {class: "it-sub"});
    const main = h("button", {class: "it-main", type: "button", "aria-expanded": String(editing), "aria-label": f ? `${f.dn}: editar` : "Alimento removido"},
      h("span", {class: "it-name" + (f ? "" : " gone")}, f ? f.dn : "Alimento removido da base"), kEl, subEl);
    main.addEventListener("click", () => {
      if (editing) closeEdit(m, it); else { view.edit = it.id; rebuild(m, () => { const R = refs.get(it.id); R && R.qty.focus(); }); }
    });
    row.append(main);
    const R = {row, kEl, subEl};
    refs.set(it.id, R);
    function paint(){
      const c = calcItem(it), ms = f ? C.measureOf(f, it.measure) : null;
      kEl.replaceChildren(c ? k0(c.kcal) : "—", h("small", null, "kcal"));
      put(subEl, f ? [h("b", null, it.qty ? `${fmtQty(it.qty)} × ${ms.l}` : ms.l), c ? ` · ${fq.format(Math.round(c.g * 10) / 10)} g` : ` · ${fq.format(ms.g)} g cada`] : "Substitua ou remova");
      if (R.grams) R.grams.textContent = c ? `${fq.format(Math.round(c.g * 10) / 10)} g` : `${fq.format(ms.g)} g`;
      if (R.mac) put(R.mac,
        h("span", null, h("b", {class: "t-c"}, "C"), c ? `${fmtG(c.c)} g` : "—"),
        h("span", null, h("b", {class: "t-p"}, "P"), c ? `${fmtG(c.p)} g` : "—"),
        h("span", null, h("b", {class: "t-g"}, "G"), c ? `${fmtG(c.l)} g` : "—"),
        h("span", null, h("b", {class: "t-f"}, "F"), c ? (c.miss.f ? "s/ dado" : `${fmtG(c.f)} g`) : "—"));
    }
    R.paint = paint;
    if (editing && f){
      const qty = h("input", {class: "cell qty", inputmode: "decimal", "aria-label": "Quantidade", placeholder: "1", value: fmtQty(it.qty), enterkeyhint: "done"});
      const meas = h("input", {class: "cell", "aria-label": "Medida caseira", value: C.measureOf(f, it.measure).l, autocapitalize: "off"});
      R.qty = qty; R.grams = h("div", {class: "grams"}); R.mac = h("div", {class: "ed-m"});
      const live = () => { paint(); paintMeal(m); paintSum(); };
      qty.addEventListener("input", () => { it.qty = parseQty(qty.value); touch(p); live(); });
      qty.addEventListener("focus", () => setTimeout(() => { if (document.activeElement === qty) qty.select(); }, 0));
      qty.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); closeEdit(m, it, "add"); } });
      autocomplete(meas, {
        items: q => {
          const cur = C.measureOf(f, it.measure).l, qt = words(q);
          const all = (q === cur || !qt.length) ? f.measures : f.measures.filter(x => { const w = words(x.l); return qt.every(t => w.some(y => y.startsWith(t))); });
          return all.map(x => ({label: x.l, meta: `${fq.format(x.g)} g`, value: x}));
        },
        onPick: x => { it.measure = x.value.l; meas.value = x.value.l; touch(p); live(); qty.focus(); },
        onBlur: () => { meas.value = C.measureOf(f, it.measure).l; }
      });
      meas.addEventListener("focus", () => setTimeout(() => { if (document.activeElement === meas) meas.select(); }, 0));
      const quick = h("div", {class: "quick"});
      for (const [lbl, v] of [["¼", .25], ["½", .5], ["¾", .75], ["1", 1], ["1½", 1.5], ["2", 2], ["3", 3], ["4", 4], ["5", 5]]){
        const b = h("button", {type: "button", "aria-label": `Quantidade ${lbl}`}, lbl);
        b.addEventListener("mousedown", e => e.preventDefault());
        b.addEventListener("click", () => { it.qty = v; closeEdit(m, it, "add"); });
        quick.append(b);
      }
      const done = h("button", {type: "button", class: "next"}, "Pronto");
      done.addEventListener("mousedown", e => e.preventDefault());
      done.addEventListener("click", () => closeEdit(m, it, "add"));
      quick.append(done);
      const askEl = h("div");
      row.append(h("div", {class: "it-ed"},
        h("div", {class: "ed-l"}, qty, h("div", {class: "acw"}, meas), R.grams), R.mac, quick,
        h("div", {class: "ed-a"},
          h("button", {class: "btn ghost sm", type: "button", onclick: () => swapSheet(m, it)}, ic("swap"), "Substituir"),
          h("button", {class: "btn ghost sm", type: "button", onclick: () => {
            const c = {id: uid(), foodId: it.foodId, measure: it.measure, qty: it.qty || 1};
            m.items.splice(m.items.indexOf(it) + 1, 0, c); view.edit = null; touch(p); rebuild(m); toast("Alimento duplicado");
          }}, ic("copy"), "Duplicar"),
          h("button", {class: "btn danger sm", type: "button", onclick: () => ask(askEl, `Excluir ${f.dn}?`, [{label: "Excluir", fn: () => {
            m.items = m.items.filter(x => x !== it); view.edit = null; touch(p); rebuild(m);
          }}])}, ic("x"), "Remover")),
        askEl));
    } else if (editing){
      const askEl = h("div");
      row.append(h("div", {class: "it-ed"}, h("div", {class: "ed-a"},
        h("button", {class: "btn ghost sm", type: "button", onclick: () => swapSheet(m, it)}, ic("swap"), "Substituir"),
        h("button", {class: "btn danger sm", type: "button", onclick: () => { m.items = m.items.filter(x => x !== it); view.edit = null; touch(p); rebuild(m); }}, ic("x"), "Remover")), askEl));
    }
    paint();
    return row;
  }

  /* ---- substituição inteligente ---- */
  function swapSheet(m, it){
    const orig = db.get(it.foodId);
    let crit = "kcal", picked = null, q = "";
    const CRIT = [["kcal", "Energia"], ["c", "Carboidratos"], ["p", "Proteínas"], ["free", "Livre"]];
    const base = calcItem(it);
    sheet("Substituir alimento", (el, close) => {
      const seg = h("div", {class: "seg crit", role: "radiogroup", "aria-label": "Critério da substituição"});
      const listEl = h("div", {class: "subs"}), noteEl = h("p", {class: "note"}), bar = h("div", {class: "confirmbar"});
      const sIn = h("input", {type: "search", placeholder: "Ou busque qualquer alimento", "aria-label": "Buscar alimento para a troca", enterkeyhint: "search"});
      sIn.addEventListener("input", () => { q = sIn.value; picked = null; paint(); });
      function options(){
        const qOpt = {use: S.prefs.use, last: S.prefs.last, limit: 12};
        if (words(q).length){
          return search(q, 12).filter(f => !orig || f.id !== orig.id).map(f => crit === "free" || !base ? freeOpt(f) : (C.equivalent(db, it, f, crit, S.prefs.last[f.id]) || freeOpt(f)));
        }
        if (!base) return [];
        if (crit === "free") return C.substitutes(db, it, "kcal", qOpt).map(o => freeOpt(o.food));
        return C.substitutes(db, it, crit, qOpt);
      }
      function freeOpt(f){
        const ms = C.measureOf(f, lastMeasure(f)), x = {foodId: f.id, measure: ms.l, qty: 1}, c = calcItem(x);
        const b0 = base || {kcal: 0, c: 0, p: 0, l: 0};
        return {food: f, measure: ms, qty: 1, calc: c, free: true, delta: {kcal: c.kcal - b0.kcal, c: c.c - b0.c, p: c.p - b0.p, l: c.l - b0.l}};
      }
      function paint(){
        put(seg, CRIT.map(([k, l]) => h("button", {type: "button", class: crit === k ? "on" : "", role: "radio", "aria-checked": String(crit === k), onclick: () => { crit = k; picked = null; paint(); }}, l)));
        noteEl.textContent = crit === "kcal" ? "Quantidades com a mesma energia. Proteínas, fibras, vitaminas e minerais podem ser diferentes."
          : crit === "c" ? "Quantidades com a mesma quantidade de carboidratos. A energia e os outros nutrientes podem mudar."
          : crit === "p" ? "Quantidades com a mesma quantidade de proteínas. A energia e os outros nutrientes podem mudar."
          : "Troca livre: escolha o alimento e ajuste a quantidade depois.";
        const opts = options();
        put(listEl, opts.length ? opts.map(o => {
          const d = o.delta, main = crit === "c" ? d.c : crit === "p" ? d.p : d.kcal;
          return h("button", {class: "so" + (picked && picked.food.id === o.food.id ? " on" : ""), type: "button", onclick: () => { picked = o; paint(); }},
            h("span", {class: "so-n"}, o.food.dn), h("span", {class: "so-k"}, `${k0(o.calc.kcal)} kcal`),
            h("span", {class: "so-q"}, `${fmtQty(o.qty)} × ${o.measure.l} · ${k0(o.calc.g)} g`),
            h("span", {class: "so-d"}, crit === "kcal" || crit === "free" ? `${signed(d.kcal, k0)} kcal` : crit === "c" ? `C ${signed(d.c, fmtG)} g · ${signed(d.kcal, k0)} kcal` : `P ${signed(d.p, fmtG)} g · ${signed(d.kcal, k0)} kcal`));
        }) : h("div", {class: "empty"}, "Nenhuma alternativa com esse critério. Tente outro critério ou busque um alimento."));
        if (picked){
          const before = planTotal(plan).kcal, after = before + picked.delta.kcal;
          bar.hidden = false;
          put(bar, h("p", null, `${orig ? orig.dn : "Alimento removido"} → `, h("b", null, picked.food.dn), ` (${fmtQty(picked.qty)} × ${picked.measure.l}). Plano: ${k0(before)} → ${k0(after)} kcal.`),
            h("button", {class: "btn primary block", type: "button", onclick: () => {
              it.foodId = picked.food.id; it.measure = picked.measure.l; it.qty = picked.qty;
              noteUse(it.foodId); touch(p); view.edit = it.id; close(); rebuild(m); toast("Alimento substituído");
            }}, "Confirmar troca"));
        } else bar.hidden = true;
      }
      el.append(h("h2", null, `Substituir ${orig ? orig.dn : "alimento"}`),
        h("p", {class: "sh-sub"}, base ? `${fmtQty(it.qty)} × ${C.measureOf(orig, it.measure).l} · ${k0(base.g)} g · ${k0(base.kcal)} kcal` : ""),
        seg, h("div", {class: "search", style: "margin:12px 0 4px"}, ic("search"), sIn), noteEl, listEl, bar);
      paint();
    });
  }

  /* ---- copiar plano como texto ---- */
  function copyPlan(){
    const lines = [`PLANO ALIMENTAR · ${p.name}`];
    if (plan.objective) lines.push(`Objetivo: ${plan.objective}`);
    for (const m of plan.meals){
      const its = filled(m);

function copyText(text, okMsg){
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy") ? done() : toast("Não foi possível copiar"); } catch (e) { toast("Não foi possível copiar"); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

/* ---------- leitura da tabela nutricional por foto ----------
   Tudo acontece no aparelho (tesseract.js, hospedado junto com o app). A foto é lida, reduzida a texto e descartada:
   nada é enviado para servidores e nenhuma imagem ou miniatura é guardada. O iOS pode manter cópias temporárias
   próprias da câmera; essas não ficam sob controle do app. */
const OCR_BASE = new URL("vendor/tesseract/", location.href).href;
let ocrLoading = null;
function loadOCR(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return ocrLoading || (ocrLoading = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = OCR_BASE + "tesseract.min.js";
    sc.onload = () => res(window.Tesseract);
    sc.onerror = () => { ocrLoading = null; rej(new Error("leitor indisponível")); };
    document.head.append(sc);
  }));
}
function scanLabel(prefill, done){
  const input = h("input", {type: "file", accept: "image/*", hidden: true});
  document.body.append(input);
  input.addEventListener("change", () => {
    let file = input.files && input.files[0];
    input.value = ""; input.remove();
    if (!file) return;
    let step = h("p", {class: "scan-s"}, "Preparando a foto…"), bar = h("div", {class: "scan-bar"}, h("i"));
    const sh = sheet("Lendo a tabela", el => el.append(h("h2", null, "Lendo a tabela nutricional"),
      h("p", {class: "sh-sub"}, "A foto é lida neste aparelho e apagada em seguida. Nada é enviado."), bar, step));
    const progress = (txt, v) => { step.textContent = txt; if (v != null) bar.firstChild.style.width = `${Math.round(v * 100)}%`; };
    (async () => {
      let bmp = null, canvas = null, worker = null;
      try {
        bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
        file = null;   // o arquivo original não é mais referenciado
        // reduz e realça o contraste em tons de cinza (melhora a leitura de rótulos)
        const scale = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
        canvas = document.createElement("canvas");
        canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
        const ctx = canvas.getContext("2d", {willReadFrequently: true});
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close(); bmp = null;
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
        let lo = 255, hi = 0;
        for (let i = 0; i < d.length; i += 4){ const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = g; if (g < lo) lo = g; if (g > hi) hi = g; }
        const span = Math.max(1, hi - lo);
        for (let i = 0; i < d.length; i += 4){ const g = (d[i] - lo) * 255 / span; d[i] = d[i + 1] = d[i + 2] = g; }
        ctx.putImageData(img, 0, 0);
        progress("Carregando o leitor de texto (só na primeira vez)…", 0.1);
        const T = await loadOCR();
        worker = await T.createWorker("por", 1, {
          workerPath: OCR_BASE + "worker.min.js", corePath: OCR_BASE + "core", langPath: OCR_BASE + "lang", cacheMethod: "none",
          logger: m => { if (m.status === "recognizing text") progress("Lendo os valores…", 0.3 + 0.7 * m.progress); }
        });
        const {data} = await worker.recognize(canvas);
        const result = C.parseLabel(data.text, {confidence: data.confidence});
        result.confidence = data.confidence;
        sh.close();
        foodSheet({prefill, scan: result}, done);
      } catch (e) {
        progress("Não foi possível ler esta foto. Tente com mais luz, a tabela reta e preenchendo a tela, ou digite os dados.", null);
        sh.el.append(h("div", {class: "bk-row", style: "margin-top:14px"},
          h("button", {class: "btn primary block", type: "button", onclick: () => { sh.close(); scanLabel(prefill, done); }}, "Tentar outra foto"),
          h("button", {class: "btn ghost block", type: "button", onclick: () => { sh.close(); foodSheet({prefill}, done); }}, "Digitar os dados")));
      } finally {
        // descarte: nenhuma imagem permanece em memória ou armazenada
        if (bmp) bmp.close();
        if (canvas) { canvas.width = 0; canvas.height = 0; canvas = null; }
        file = null;
        if (worker) worker.terminate().catch(() => {});
      }
    })();
  });
  input.click();
}
