<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
</style>
<title>Nutri Prático</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Prático">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: uma coluna de app nativo (máx. 600px) sobre preto quente, barra de abas no rodapé.
   Superfícies em grafite separam os blocos; o cobre marca só o essencial; macros em champanhe, pátina, rosé e sálvia. */
:root{
  --bg:#0A0908; --surface:#191614; --surface-2:#221E1B; --surface-3:#2B2622;
  --ink:#F4EEE8; --ink-2:#CDC3B9; --muted:#968B81; --line:#2D2824; --line-2:#3B352F;
  --accent:#E08C4E; --accent-2:#F2A468; --accent-ink:#1C0E05; --accent-soft:#2F1E12; --accent-line:#6B4226;
  --carb:#E5C07C; --prot:#6FC4BE; --fat:#DE8FA4; --fib:#A8C98B; --danger:#FF7D74; --danger-soft:#33191A; --ok:#8FCB9B;
  --hero-1:#2E1D11; --hero-2:#181513; --scrim:rgba(0,0,0,.62); --shadow:0 14px 36px rgba(0,0,0,.5);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --r:18px; --tabbar:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px))}
.view{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabeçalho fixo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:16px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:70%}
.who .av{width:30px;height:30px;font-size:12px;border-width:1px}
.who b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{width:14px;height:14px;color:var(--muted);flex:none}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* Barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));transition:transform .2s}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-2)}
body.typing .tabbar{transform:translateY(110%)}

h1{font-size:32px;line-height:1.08;letter-spacing:-.035em;font-weight:650;margin:16px 0 4px;text-wrap:balance}
h2.sec{font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-weight:620;font-size:16.5px;letter-spacing:-.01em}
.hero{background:linear-gradient(155deg,var(--hero-1),var(--hero-2) 72%);border:1px solid var(--accent-line)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.warn{color:var(--accent-2)}

/* Botões e campos */
.btn{height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft);border:1px solid transparent}
.btn.plain{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:11px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:17px;outline:none;width:100%}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{height:40px;border-radius:10px;font-weight:550;font-size:14px;color:var(--muted);padding:0 4px;line-height:1.1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crit button{font-size:12.5px;letter-spacing:-.01em;padding:0 2px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.seg.big button{height:46px;font-size:15px}
.sheet .seg{background:var(--surface-2)}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:12.5px;height:44px;letter-spacing:-.01em;padding:0 2px;white-space:normal}
@media (max-width:370px){.seg4{grid-template-columns:repeat(2,1fr)}}
.row-actions{display:flex;gap:10px;margin-top:8px}
.row-actions .btn{flex:1}
.confirm{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-2)}
.ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger-soft);font-size:14px;color:var(--ink)}
.ask span{flex:1 1 140px}
.ask-b{display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-height:92%;overflow:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;font-weight:650;text-wrap:balance}
.sheet .sh-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.bk-row{display:flex;flex-direction:column;gap:10px}

/* Autocompletar */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface-3);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px;overscroll-behavior:contain}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;min-height:44px}
.ac-item.on{background:var(--accent-soft)}
.ac-item.pend{background:var(--danger-soft)}
.ac-l{flex:1;min-width:0;font-size:15px}
.ac-l b{font-weight:650;color:var(--accent-2)}
.ac-m{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-x{min-width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:18px;line-height:1;padding:0 6px}
.ac-item.pend .ac-x{color:var(--danger);font-size:13px;font-weight:600;background:var(--surface-2)}
.ac-sec{font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}

/* Avatares e listas */
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;letter-spacing:-.01em}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;border-top:1px solid var(--line);text-align:left;min-height:56px}
.li:first-child{border-top:0}
.li:active{background:var(--surface-2)}
.li-m{flex:1;min-width:0}
.li-t{font-weight:560;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t b{color:var(--accent-2);font-weight:inherit}
.li-s{color:var(--muted);font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-r{text-align:right;white-space:nowrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.li-r b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.check{display:grid;width:22px;height:22px;color:var(--accent-2);flex:none}
.check svg{width:22px;height:22px}
.li > svg,.li-go svg,.li > span[style] > svg{width:18px;height:18px;color:var(--muted);flex:none}
.av svg{width:20px;height:20px}
.chip{display:inline-block;font-size:9.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:8px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* Totais: nome do macro colorido, gramas e % na 1ª linha, g/kg na 2ª; fibras numa linha própria */
.tot-top{display:flex;align-items:center;gap:10px}
.tot-kcal{display:flex;align-items:baseline;gap:7px;flex:1;min-width:0}
.tot-kcal b{font-size:34px;font-weight:640;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tot-kcal span{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mwrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid > div{min-width:0;text-align:center;border-left:1px solid var(--line-2);padding:0 4px}
.mgrid > div:first-child{border-left:0}
.mgrid .k{font-size:12.5px;font-weight:650;letter-spacing:.01em}
.mgrid .v{font-size:21px;font-weight:650;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.mgrid .v small{font-size:13px;font-weight:550;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.mgrid .pc{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.mgrid .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fib{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-2);font-size:13px;font-variant-numeric:tabular-nums}
.fib .t-f{font-weight:650}
.fib b{font-weight:650;font-size:15px}
.fib .s{margin-left:auto;color:var(--muted);font-size:12px}
.mwrap.sm{margin-top:0;padding-top:0;border-top:0}
.mwrap.sm .k{font-size:12px}
.mwrap.sm .v{font-size:17px}
.mwrap.sm .v small{font-size:12px}
.mwrap.sm .pc{font-size:11.5px}
.mwrap.sm .s{font-size:11.5px}
.mwrap.sm .fib{margin-top:9px;padding-top:8px;border-top-color:var(--line)}
.mwrap.sm .mgrid > div{border-left-color:var(--line)}
@media (max-width:370px){.mgrid .v{font-size:18px}.mwrap.sm .v{font-size:15px}.mgrid .pc{margin-left:3px}}
.t-c{color:var(--carb)} .t-p{color:var(--prot)} .t-g{color:var(--fat)} .t-f{color:var(--fib)}
.miss{margin-top:10px;font-size:12px;color:var(--accent-2)}

/* Resumo fixo do plano, dentro do cabeçalho */
.sumbar{max-width:600px;margin:8px auto 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.sumbar .k{display:flex;align-items:baseline;gap:4px;white-space:nowrap;color:var(--muted)}
.sumbar .k b{font-size:16px;color:var(--ink);font-weight:650;letter-spacing:-.02em}
.sumbar .pc{font-size:11px;font-weight:650;color:var(--accent-2);padding:2px 7px;border-radius:999px;background:var(--accent-soft);margin-left:4px}
.sumbar .m{display:flex;gap:10px;margin-left:auto;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.sumbar .m b{font-weight:700;margin-right:2px}
.sumbar svg{width:14px;height:14px;color:var(--muted);flex:none}
@media (max-width:370px){.sumbar .m{gap:7px}.sumbar .k span.u{display:none}}

/* Início */
.hello{margin:18px 0 18px}
.hello h1{margin:0 0 4px}
.goal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.goal span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.dmeals .li-t{font-size:15.5px}
.dmeals .tm{width:46px;font-size:13.5px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums;flex:none}
.cta{display:flex;align-items:center;gap:14px}
.cta .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.cta .ic svg{width:20px;height:20px}
.cta div{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.cta b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin-bottom:1px}
.goal button{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2.sec{margin-right:0}
.link{font-size:13.5px;font-weight:600;color:var(--accent-2);padding:6px 2px}
.quiet{display:block;margin:26px auto 0;padding:8px 12px;font-size:12.5px;color:var(--muted);text-align:center;text-wrap:balance}
.quiet svg{width:13px;height:13px;vertical-align:-2px;margin-right:6px}

/* Painel circular: anel externo = planejado ÷ meta; anel interno = divisão da energia entre os macronutrientes */
.dial{position:relative;padding:14px 14px 12px;border-radius:24px;border:1px solid var(--line);
  background:radial-gradient(120% 70% at 50% 0%,#1F1813 0%,var(--surface) 55%,#141210 100%)}
.dial-wrap{position:relative;width:min(100%,292px);aspect-ratio:1;margin:0 auto}
.dial-svg{display:block;width:100%;height:100%;overflow:visible}
.dial-svg circle{fill:none}
.ticks line{stroke:var(--line-2);stroke-width:1.3;stroke-linecap:round}
.ticks line.mj{stroke:#4A423A;stroke-width:2}
.ticks line.lit{stroke:var(--accent-line)}
.ticks line.mj.lit{stroke:var(--accent)}
.trk{stroke:#231F1C;stroke-width:9}
.trk.in{stroke:#1E1B18;stroke-width:15}
.prog{stroke:var(--accent);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(224,140,78,.35));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.prog.over{stroke:var(--accent-2)}
.arc{stroke-width:15;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1) .15s,opacity .2s,stroke-width .2s}
.arc.t-c{stroke:var(--carb)} .arc.t-p{stroke:var(--prot)} .arc.t-g{stroke:var(--fat)}
.arc.dim{opacity:.22}
.arc.sel{stroke-width:19}
.dial-c{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dial-k{font-size:clamp(36px,11vw,46px);font-weight:640;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.dial-m{font-size:13px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p{margin-top:9px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p.over{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dial-p.dim{background:transparent;color:var(--muted);border-color:var(--line-2)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}

.it-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ed-l{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center}

.quick button.next{background:var(--accent);color:var(--accent-ink);margin-left:auto;padding:0 14px}
.ed-a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.add{padding:8px 12px 10px 16px;border-top:1px solid var(--line)}

.clipbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 6px 9px 14px;border-radius:var(--r);border:1px solid var(--accent-line);background:var(--accent-soft)}

.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left;font-size:13px;color:var(--muted)}

.opt{color:var(--muted);font-weight:400;opacity:.8}

.dc-t{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}

.src{margin:22px 4px 0;font-size:11.5px;color:var(--muted);line-height:1.55}

    h("div", {class: "hello"},
      h("div", {class: "sub"}, today),
      h("h1", null, `Olá, ${firstName(p.name)}`),
      h("div", {class: "goal"}, h("button", {onclick: () => go({tab: "plano"})}, plan.objective || "Definir objetivo"),
        tg ? h("span", null, `Meta ${k0(tg)} kcal`) : null)),

      h("span", {class: "ic", html: ICON.bolt}), h("div", null, h("b", null, "Calcule sua necessidade energética"), "Com peso e altura, o app sugere a meta de calorias."), h("span", {class: "li-go", html: ICON.right})) : null,
    h("div", {class: "sec-h"}, h("h2", {class: "sec"}, "Refeições"), meals.length ? h("button", {class: "link", onclick: () => go({tab: "plano"})}, "Abrir plano") : null),
    meals.length ? h("div", {class: "list dmeals"}, meals.map(m => {

        h("span", {class: "tm"}, m.time || "—"),

        h("div", {class: "li-r"}, h("b", null, k0(mt.kcal)), "kcal"));
    })) : h("div", {class: "card empty"}, h("b", null, "Seu plano está vazio"), "Monte as refeições do dia em poucos toques.",
      h("div", {style: "margin-top:14px"}, h("button", {class: "btn primary", onclick: () => go({tab: "plano"})}, "Montar meu plano"))),
    backupDue ? h("button", {class: "quiet", onclick: backupSheet}, ic("lock"), days == null ? "Seus dados ainda não têm backup · Fazer agora" : `Último backup há ${days} dias · Fazer agora`) : null));
}
const byTime = (a, b) => (a.time || "99") < (b.time || "99") ? -1 : (a.time || "99") > (b.time || "99") ? 1 : 0;

/* ---------- Painel circular ----------
   Anel externo: energia planejada ÷ meta (0–100%; acima da meta o anel fica cheio e o excesso aparece em texto).
   Anel interno: divisão da energia entre carboidratos, proteínas e gorduras (Atwater 4/4/9; os três somam 100%). */
function dial(t, tg, W){
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, a, ...kids) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); kids.forEach(k => e.append(k)); return e; };
  const s = C.macroSplit(t), pct = tg ? t.kcal / tg * 100 : null, fill = pct == null ? 0 : Math.min(pct, 100);
  const R1 = 124, R2 = 101, C1 = 2 * Math.PI * R1, C2 = 2 * Math.PI * R2;
  const MAC = [["c", "Carboidratos", "t-c", t.c, s.c], ["p", "Proteínas", "t-p", t.p, s.p], ["l", "Gorduras", "t-g", t.l, s.l]];
  let sel = null;
  const ticks = sv("g", {class: "ticks"});
  for (let i = 0; i < 50; i++){
    const a = i / 50 * 2 * Math.PI - Math.PI / 2, major = i % 5 === 0, r1 = 141, r2 = major ? 133.5 : 137;
    ticks.append(sv("line", {x1: 150 + r1 * Math.cos(a), y1: 150 + r1 * Math.sin(a), x2: 150 + r2 * Math.cos(a), y2: 150 + r2 * Math.sin(a),
      class: (major ? "mj" : "") + (i * 2 < fill ? " lit" : "")}));
  }
  const prog = sv("circle", {cx: 150, cy: 150, r: R1, class: "prog" + (pct > 100 ? " over" : ""), "stroke-dasharray": `${C1} ${C1}`, "stroke-dashoffset": C1, transform: "rotate(-90 150 150)"});
  const gap = s.atwater ? 0.012 : 0;
  let start = 0;
  const arcs = MAC.map(([k, , cls, , share]) => {
    const len = Math.max(0, share / 100 - gap) * C2;
    const el = sv("circle", {cx: 150, cy: 150, r: R2, class: "arc " + cls, "data-k": k, "stroke-dasharray": `0 ${C2}`, "stroke-dashoffset": -start * C2 - gap * C2 / 2, transform: "rotate(-90 150 150)"});
    el.dataset.len = len; start += share / 100;
    return el;
  });
  const svg = sv("svg", {viewBox: "0 0 300 300", class: "dial-svg", "aria-hidden": "true"},
    ticks, sv("circle", {cx: 150, cy: 150, r: R1, class: "trk"}), prog, sv("circle", {cx: 150, cy: 150, r: R2, class: "trk in"}), ...arcs);
  const center = h("div", {class: "dial-c"},
    h("div", {class: "dial-k"}, k0(t.kcal)),
    h("div", {class: "dial-m"}, tg ? `de ${k0(tg)} kcal` : "kcal planejadas"),
    pct != null ? h("div", {class: "dial-p" + (pct > 100 ? " over" : "")}, pct > 100 ? `${Math.round(pct)}% · +${k0(t.kcal - tg)} kcal` : `${Math.round(pct)}% da meta`) : h("div", {class: "dial-p dim"}, "sem meta"));
  const detail = h("div", {class: "dial-d", "aria-live": "polite"});
  const keys = h("div", {class: "keys", role: "group", "aria-label": "Macronutrientes"});
  function paintKeys(){
    put(keys, MAC.map(([k, name, cls, g, share]) => h("button", {class: "key" + (sel === k ? " on" : "") + (sel && sel !== k ? " dim" : ""), type: "button", "aria-pressed": String(sel === k),
      onclick: () => { sel = sel === k ? null : k; paintKeys(); }},
      h("span", {class: "k " + cls}, name), h("span", {class: "v"}, fmtG(g), h("small", null, "g")), h("span", {class: "s"}, `${Math.round(share)}%`))));
    arcs.forEach(a => { a.classList.toggle("sel", sel === a.dataset.k); a.classList.toggle("dim", !!sel && sel !== a.dataset.k); });
    const m = MAC.find(x => x[0] === sel);
    const seg = (...x) => h("span", {class: "nw"}, ...x);
    put(detail, m ? [seg(h("b", {class: m[2]}, m[1]), ` ${fmtG(m[3])} g`), seg(` · ${Math.round(m[4])}% da energia`), W ? seg(` · ${nf2.format(m[3] / W)} g/kg`) : null, seg(` · ${k0(m[3] * (m[0] === "l" ? 9 : 4))} kcal`)]
      : [seg(h("b", {class: "t-f"}, "Fibras"), ` ${fmtG(t.f)} g${t.miss.f ? "*" : ""}`), t.kcal ? seg(` · ${g1(t.f * 1000 / t.kcal)} g por 1.000 kcal`) : null]);
  }
  paintKeys();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    prog.setAttribute("stroke-dashoffset", C1 * (1 - fill / 100));
    arcs.forEach(a => a.setAttribute("stroke-dasharray", `${a.dataset.len} ${C2}`));
  }));
  const label = `Planejado ${k0(t.kcal)} kcal${tg ? ` de ${k0(tg)}, ${Math.round(pct)}% da meta` : ""}. Carboidratos ${fmtG(t.c)} g, ${Math.round(s.c)}%. Proteínas ${fmtG(t.p)} g, ${Math.round(s.p)}%. Gorduras ${fmtG(t.l)} g, ${Math.round(s.l)}%.`;
  return h("section", {class: "dial", "aria-label": label},
    h("div", {class: "dial-wrap"}, svg, center), keys, detail, missNote(t),
    h("div", {class: "dial-legend"}, h("span", null, h("i", {class: "lg-o"}), "Planejado ÷ meta"), h("span", null, h("i", {class: "lg-i"}), "Divisão da energia")));
}

function macroGrid(t, W, small){
  const s = C.macroSplit(t);
  const cell = (cls, k, grams, pc) => h("div", null,
    h("div", {class: "k " + cls}, k),
    h("div", {class: "v"}, fmtG(grams), h("small", null, "g"), h("span", {class: "pc"}, `${Math.round(pc)}%`)),
    h("div", {class: "s"}, W ? `${nf2.format(grams / W)} g/kg` : " "));
  return h("div", {class: "mwrap" + (small ? " sm" : "")},
    h("div", {class: "mgrid"}, cell("t-c", "Carboidratos", t.c, s.c), cell("t-p", "Proteínas", t.p, s.p), cell("t-g", "Gorduras", t.l, s.l)),
    h("div", {class: "fib"}, h("span", {class: "t-f"}, "Fibras"), h("b", null, `${fmtG(t.f)} g${t.miss.f ? "*" : ""}`),
      t.kcal ? h("span", {class: "s"}, `${g1(t.f * 1000 / t.kcal)} g por 1.000 kcal`) : null));
}
function missNote(t){
  const n = Object.values(t.miss || {}).reduce((a, b) => Math.max(a, b), 0);
  if (!n) return null;
  return h("div", {class: "miss"}, `* ${n === 1 ? "1 alimento não tem" : n + " alimentos não têm"} esse dado na TACO; o total pode estar subestimado.`);
}

/* ---------- Meu plano ---------- */
function renderPlan(p){
  const plan = p.plan;
  const r = C.energyOf(p);
  const target = () => plan.target || (r.ok && r.get ? Math.round(r.get) : null);
  const refs = new Map();   // id -> elementos que mudam sem redesenhar a tela
  const open = new Set(view.open || []);

  /* resumo fixo no cabeçalho; toque abre os detalhes */
  const sumbar = h("button", {class: "sumbar", "aria-label": "Ver resumo nutricional completo", onclick: summarySheet});
  function paintSum(){
    const t = planTotal(plan), tg = target(), pct = tg ? Math.round(t.kcal / tg * 100) : null;
    put(sumbar,
      h("span", {class: "k"}, h("b", null, k0(t.kcal)), tg ? ` / ${k0(tg)}` : "", h("span", {class: "u"}, " kcal"), pct != null ? h("span", {class: "pc"}, `${pct}%`) : null),
      h("span", {class: "m", "aria-label": `Carboidratos ${fmtG(t.c)} g, proteínas ${fmtG(t.p)} g, gorduras ${fmtG(t.l)} g, fibras ${fmtG(t.f)} g`},
        h("span", null, h("b", {class: "t-c"}, "C"), fmtG(t.c)), h("span", null, h("b", {class: "t-p"}, "P"), fmtG(t.p)),
        h("span", null, h("b", {class: "t-g"}, "G"), fmtG(t.l)), h("span", null, h("b", {class: "t-f"}, "F"), fmtG(t.f))));
  }
  function summarySheet(){
    sheet("Resumo do plano", (el) => {
      const t = planTotal(plan), s = C.macroSplit(t);
      el.append(h("h2", null, "Resumo do plano"), h("p", {class: "sh-sub"}, "Valores planejados para o dia. Não é um registro do que foi consumido."),
        dial(t, target(), p.energy.weight),
        h("div", {class: "note"}, "As porcentagens usam 4 kcal/g para carboidratos e proteínas e 9 kcal/g para gorduras (fatores de Atwater). ",
          `A energia total vem da TACO, calculada pela fonte com fatores próprios de cada alimento; por isso pode diferir um pouco da soma dos macronutrientes (${k0(s.atwater)} kcal).`),
        h("div", {style: "height:12px"}),
        h("button", {class: "btn ghost block", onclick: copyPlan}, ic("copy"), "Copiar plano em texto"));
    });
  }

  /* objetivo e meta */
  const obj = h("input", {class: "input", id: "objetivo", placeholder: "Objetivo", value: plan.objective || "", enterkeyhint: "done", "aria-label": "Objetivo"});
  autocomplete(obj, {
    items: optionSource("objectives"),
    onPick: it => { obj.value = it.value; plan.objective = it.value; touch(p); obj.blur(); },
    onRemove: it => { S.prefs.objectives = S.prefs.objectives.filter(o => o !== it.value); save(); },
    enterPicks: v => !!v.trim() && !S.prefs.objectives.some(o => norm(o) === norm(v.trim())) && optionSource("objectives")(v).length > 0,
    onEnter: () => { plan.objective = canonical("objectives", obj.value); obj.value = plan.objective; rememberOption("objectives", plan.objective); touch(p); obj.blur(); }
  });
  obj.addEventListener("input", () => { plan.objective = obj.value; touch(p); });
  obj.addEventListener("change", () => rememberOption("objectives", obj.value));
  const tgt = h("input", {class: "input num", id: "meta", inputmode: "numeric", placeholder: r.ok && r.get ? k0(r.get) : "kcal", value: plan.target ? String(plan.target) : "", "aria-label": "Meta de calorias"});
  tgt.addEventListener("input", () => { const v = parseInt(tgt.value.replace(/\D/g, ""), 10); plan.target = v > 0 ? v : null; touch(p); paintSum(); });

  const mealsEl = h("div", {class: "meals"});
  const pasteNew = h("div");

  /* ---- refeição ---- */
  const nextMealName = () => { const used = new Set(plan.meals.map(m => norm(m.name))); return DEFAULT_MEALS.find(n => !used.has(norm(n))) || ""; };
  function addMeal(items, focusName = true){
    const m = {id: uid(), name: "", time: "", items: items || []};
    plan.meals.push(m); touch(p); open.add(m.id); syncOpen();
    const card = buildMeal(m); mealsEl.append(card);
    if (focusName) { card.querySelector(".meal-name").focus(); card.scrollIntoView({block: "start", behavior: "smooth"}); }
    paintSum(); return m;
  }
  function syncOpen(){ view.open = [...open]; try { sessionStorage.setItem(KEY + ".view", JSON.stringify(view)); } catch (e) {} }
  function rebuild(m, focus){
    const old = refs.get(m.id)?.card, el = buildMeal(m);
    if (old) old.replaceWith(el); else mealsEl.append(el);
    paintSum();
    if (focus) focus();
    return el;
  }
  function toggle(m){ if (open.has(m.id)) { open.delete(m.id); if (view.edit && m.items.some(i => i.id === view.edit)) view.edit = null; } else open.add(m.id); syncOpen(); rebuild(m); }

  /* copiar, colar, duplicar e mover */
  const clip = () => S.prefs.clip;
  const clipLabel = () => { const c = clip(); return c ? `${c.name || "Refeição"} · ${nItems(c.items.length)}` : ""; };
  const cloneItems = items => items.filter(i => db.has(i.foodId)).map(i => ({id: uid(), foodId: i.foodId, measure: i.measure, qty: i.qty}));
  function copyMeal(m){
    S.prefs.clip = {name: m.name.trim(), items: filled(m).map(i => ({foodId: i.foodId, measure: i.measure, qty: i.qty}))};
    save(); paintPasteNew(); toast(`${m.name.trim() || "Refeição"} copiada`);
  }
  function pasteInto(m, mode){
    m.items = (mode === "add" ? filled(m) : []).concat(cloneItems(clip().items));
    touch(p); open.add(m.id); syncOpen(); rebuild(m); toast("Refeição colada");
  }
  function askPaste(m){
    if (!filled(m).length) { pasteInto(m, "replace"); return; }
    ask(refs.get(m.id).askEl, `${m.name.trim() || "Esta refeição"} já tem ${nItems(filled(m).length)}. Colar ${clip().name || "a refeição copiada"}:`, [
      {label: "Somar", cls: "ghost", fn: () => pasteInto(m, "add")},
      {label: "Substituir", cls: "primary", fn: () => pasteInto(m, "replace")}]);
  }
  function duplicateMeal(m){
    const i = plan.meals.indexOf(m);
    const c = {id: uid(), name: m.name.trim() ? `${m.name.trim()} (cópia)` : "", time: "", items: cloneItems(filled(m))};
    plan.meals.splice(i + 1, 0, c); touch(p); open.add(c.id); syncOpen();
    const el = buildMeal(c); refs.get(m.id).card.after(el); paintSum(); toast("Refeição duplicada");
    el.scrollIntoView({block: "start", behavior: "smooth"});
  }
  /* Refeições com horário seguem a ordem do relógio; as sem horário ficam no fim, na ordem atual */
  function orderByTime(focusM){
    const before = plan.meals.map(x => x.id).join();
    const timed = plan.meals.filter(x => x.time).sort(byTime), untimed = plan.meals.filter(x => !x.time);
    plan.meals = [...timed, ...untimed];
    if (plan.meals.map(x => x.id).join() === before) return;
    touch(p);
    for (const x of plan.meals) mealsEl.append(refs.get(x.id).card);
    if (focusM) refs.get(focusM.id).card.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  function moveMeal(m, dir){
    const i = plan.meals.indexOf(m), j = i + dir;
    if (j < 0 || j >= plan.meals.length) return;
    [plan.meals[i], plan.meals[j]] = [plan.meals[j], plan.meals[i]]; touch(p);
    const a = refs.get(m.id).card, b = refs.get(plan.meals[i].id).card;
    if (dir < 0) b.before(a); else b.after(a);
    a.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  function paintPasteNew(){
    put(pasteNew, clip() && clip().items.length ? h("div", {class: "clipbar", role: "status"},
      h("span", {class: "cb-i", html: ICON.copy}),
      h("div", {class: "cb-t"}, h("b", null, "Refeição copiada"), clipLabel()),
      h("button", {class: "btn primary sm", type: "button", onclick: () => { addMeal(cloneItems(clip().items)); toast("Refeição colada"); }}, "Colar como nova"),
      h("button", {class: "x", type: "button", "aria-label": "Descartar refeição copiada", html: ICON.x, onclick: () => { S.prefs.clip = null; save(); paintPasteNew(); }})) : null);
  }
  function mealMenu(m){
    const i = plan.meals.indexOf(m), n = filled(m).length;
    actionSheet(m.name.trim() || "Refeição", n ? `${nItems(n)} · ${k0(mealTotal(m).kcal)} kcal` : "Sem alimentos", [
      n ? {label: "Copiar refeição", cls: "primary", fn: () => copyMeal(m)} : null,
      clip() && clip().items.length ? {label: `Colar aqui: ${clipLabel()}`, fn: () => askPaste(m)} : null,
      n ? {label: "Criar outra igual (duplicar)", fn: () => duplicateMeal(m)} : null,
      i > 0 ? {label: "Mover para cima", fn: () => moveMeal(m, -1)} : null,
      i < plan.meals.length - 1 ? {label: "Mover para baixo", fn: () => moveMeal(m, 1)} : null,
      {label: "Excluir refeição", cls: "danger", fn: () => {
        open.add(m.id); syncOpen(); const el = rebuild(m);
        ask(refs.get(m.id).askEl, `Excluir ${m.name.trim() ? "“" + m.name.trim() + "”" : "esta refeição"} e ${n ? "os " + nItems(n) : "ela"}?`, [{label: "Excluir", fn: () => {
          plan.meals = plan.meals.filter(x => x !== m); touch(p); el.remove(); refs.delete(m.id); paintSum();
        }}]);
      }}]);
  }

  function buildMeal(m){
    const isOpen = open.has(m.id);
    const card = h("section", {class: "meal" + (isOpen ? " open" : ""), "data-id": m.id});
    const kcalEl = h("div", {class: "mh-k"}), subEl = h("div", {class: "mh-s"});
    const askEl = h("div", {class: "meal-ask"}), footEl = h("div", {class: "mfoot"});
    refs.set(m.id, {card, kcalEl, subEl, footEl, askEl});
    const chev = h("button", {class: "chev", type: "button", "aria-label": isOpen ? "Recolher refeição" : "Abrir refeição", "aria-expanded": String(isOpen), html: ICON.chev, onclick: e => { e.stopPropagation(); toggle(m); }});
    let nameEl;
    if (isOpen){
      nameEl = h("input", {class: "meal-name", placeholder: nextMealName() || "Nome da refeição", value: m.name, enterkeyhint: "next", "aria-label": "Nome da refeição"});
      autocomplete(nameEl, {
        items: optionSource("meals"),

function copyText(text, okMsg){
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy") ? done() : toast("Não foi possível copiar"); } catch (e) { toast("Não foi possível copiar"); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

/* ---------- leitura da tabela nutricional por foto ----------
   Tudo acontece no aparelho (tesseract.js, hospedado junto com o app). A foto é lida, reduzida a texto e descartada:
   nada é enviado para servidores e nenhuma imagem ou miniatura é guardada. O iOS pode manter cópias temporárias
   próprias da câmera; essas não ficam sob controle do app. */
const OCR_BASE = new URL("vendor/tesseract/", location.href).href;
let ocrLoading = null;
function loadOCR(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return ocrLoading || (ocrLoading = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = OCR_BASE + "tesseract.min.js";
    sc.onload = () => res(window.Tesseract);
    sc.onerror = () => { ocrLoading = null; rej(new Error("leitor indisponível")); };
    document.head.append(sc);
  }));
}
function scanLabel(prefill, done){
  const input = h("input", {type: "file", accept: "image/*", hidden: true});
  document.body.append(input);
  input.addEventListener("change", () => {
    let file = input.files && input.files[0];
    input.value = ""; input.remove();
    if (!file) return;
    let step = h("p", {class: "scan-s"}, "Preparando a foto…"), bar = h("div", {class: "scan-bar"}, h("i"));
    const sh = sheet("Lendo a tabela", el => el.append(h("h2", null, "Lendo a tabela nutricional"),
      h("p", {class: "sh-sub"}, "A foto é lida neste aparelho e apagada em seguida. Nada é enviado."), bar, step));
    const progress = (txt, v) => { step.textContent = txt; if (v != null) bar.firstChild.style.width = `${Math.round(v * 100)}%`; };
    (async () => {
      let bmp = null, canvas = null, worker = null;
      try {
        bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
        file = null;   // o arquivo original não é mais referenciado
        // reduz e realça o contraste em tons de cinza (melhora a leitura de rótulos)
        const scale = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
        canvas = document.createElement("canvas");
        canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
        const ctx = canvas.getContext("2d", {willReadFrequently: true});
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close(); bmp = null;
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
        let lo = 255, hi = 0;
        for (let i = 0; i < d.length; i += 4){ const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = g; if (g < lo) lo = g; if (g > hi) hi = g; }
        const span = Math.max(1, hi - lo);
        for (let i = 0; i < d.length; i += 4){ const g = (d[i] - lo) * 255 / span; d[i] = d[i + 1] = d[i + 2] = g; }
        ctx.putImageData(img, 0, 0);
        progress("Carregando o leitor de texto (só na primeira vez)…", 0.1);
        const T = await loadOCR();
        worker = await T.createWorker("por", 1, {
          workerPath: OCR_BASE + "worker.min.js", corePath: OCR_BASE + "core", langPath: OCR_BASE + "lang", cacheMethod: "none",
          logger: m => { if (m.status === "recognizing text") progress("Lendo os valores…", 0.3 + 0.7 * m.progress); }
        });
        const {data} = await worker.recognize(canvas);
        const result = C.parseLabel(data.text, {confidence: data.confidence});
        result.confidence = data.confidence;
        sh.close();
        foodSheet({prefill, scan: result}, done);
      } catch (e) {
        progress("Não foi possível ler esta foto. Tente com mais luz, a tabela reta e preenchendo a tela, ou digite os dados.", null);
        sh.el.append(h("div", {class: "bk-row", style: "margin-top:14px"},
          h("button", {class: "btn primary block", type: "button", onclick: () => { sh.close(); scanLabel(prefill, done); }}, "Tentar outra foto"),
          h("button", {class: "btn ghost block", type: "button", onclick: () => { sh.close(); foodSheet({prefill}, done); }}, "Digitar os dados")));
      } finally {
        // descarte: nenhuma imagem permanece em memória ou armazenada
        if (bmp) bmp.close();
        if (canvas) { canvas.width = 0; canvas.height = 0; canvas = null; }
        file = null;
        if (worker) worker.terminate().catch(() => {});
      }
    })();
  });
  input.click();
}

    const paintSegs = () => {
      put(basisSeg, [["100", `100 ${unit}`], ["porcao", "Porção"]].map(([k, l]) => h("button", {type: "button", class: basis === k ? "on" : "", role: "radio", "aria-checked": String(basis === k), onclick: () => { basis = k; paintSegs(); check(); }}, l)));
      put(unitSeg, [["g", "g"], ["ml", "ml"]].map(([k, l]) => h("button", {type: "button", class: unit === k ? "on" : "", role: "radio", "aria-checked": String(unit === k), onclick: () => { unit = k; paintSegs(); }}, l)));

      fld("al-lip", "Gorduras totais (g)", "fat", true), fld("al-fib", "Fibras (g)", "fib", false)];
    const extraFields = EXTRA.map(([k, l, u]) => fld("al-" + k, `${l} (${u})`, k, false));
    const hasExtra = EXTRA.some(([k]) => v0(k) != null);
    function check(){
      const req = ["kcal", "c", "p", "fat"].every(k => val(fields[k]) != null);

      h("div", {class: "eyebrow", style: "margin:4px 0 8px"}, "Porção de referência"),

      h("div", {class: "field"}, h("label", {for: "al-porcao-nome"}, "Medida caseira", h("span", {class: "opt"}, " opcional")), pLbl),
      h("div", {class: "field"}, h("label", null, "Os valores abaixo são por"), basisSeg),

      const ms = (portion ? [[pl, portion.amount]] : []).concat(oldMs.filter(x => x.l !== pl).map(x => [x.l, x.g]));

  });

    h("p", null, "Adultos: por padrão, a média entre FAO/OMS 1985 (taxa metabólica basal de Schofield × fator de atividade) e DRI 2005 (IOM), que estima o gasto total pela idade, peso, altura e nível de atividade. Você pode escolher usar só um dos dois protocolos; as equações não mudam."),
    h("p", null, "Crianças e adolescentes (3 a 18 anos): DRI 2005, que inclui a energia para o crescimento. Os fatores de atividade da FAO/OMS 1985 foram definidos para adultos, então não entram na média. O app não aplica déficit calórico automático."),
    h("p", null, "Abaixo de 3 anos o app mostra só a taxa basal, porque as equações de gasto total dessa faixa dependem de outras informações."),
    h("h3", null, "Composição dos alimentos"),
    h("p", null, "TACO 4ª edição (NEPA/UNICAMP, 2011). Quando a TACO marca um valor como “em reanálise”, o app não usa zero: avisa que o total pode estar subestimado. “Traço” e “não se aplica” valem zero."),
    h("p", null, "Medidas caseiras: Tabela de Medidas Referidas da POF 2008–2009 (IBGE)."),
    h("h3", null, "Porcentagens dos macronutrientes"),
    h("p", null, "Usam 4 kcal/g para carboidratos e proteínas e 9 kcal/g para gorduras. A energia total vem da própria TACO; por isso ela pode diferir um pouco da soma dos macronutrientes."),
    h("h3", null, "Substituições"),
    h("p", null, "Sugere alimentos com o mesmo papel principal (fonte de carboidrato, proteína ou gordura) e calcula a quantidade com a mesma energia, carboidratos ou proteínas. Alimentos equivalentes nesse critério não são nutricionalmente idênticos."),
    h("p", null, "Este app organiza o planejamento. Ele não substitui orientação de nutricionista ou médico, especialmente para crianças, gestantes e pessoas com doenças."))));
}

/* ---------- Necessidade energética ----------
   Resumo primeiro (TMB, GET e protocolo escolhido); as equações ficam em "Fórmulas e cálculos". */
const METHOD_LABEL = {media: "Média FAO/OMS 1985 + DRI 2005", fao: "FAO/OMS 1985", dri: "DRI 2005", "fao-tmb": "FAO/OMS 1985 · só taxa basal"};
function renderEnergy(p, body){
  const e = p.energy;
  const W = h("input", {class: "input", id: "peso", inputmode: "decimal", placeholder: "0", value: e.weight ? fq.format(e.weight) : "", "aria-label": "Peso em kg", enterkeyhint: "next"});
  const H = h("input", {class: "input", id: "altura", inputmode: "decimal", placeholder: "0", value: e.height ? fq.format(e.height) : "", "aria-label": "Altura em cm", enterkeyhint: "done"});
  const num = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v : null; };
  W.addEventListener("input", () => { e.weight = num(W.value); touch(p); paint(); });
  H.addEventListener("input", () => { let v = num(H.value); if (v != null && v < 3) v = v * 100; e.height = v; touch(p); paint(); });   // aceita 1,65 m
  W.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); H.focus(); } });
  H.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); H.blur(); } });
  function segOf(labels, key, label){
    const seg = h("div", {class: "seg seg4", role: "radiogroup", "aria-label": label});
    const paintSeg = () => seg.replaceChildren(...labels.map((l, i) => h("button", {type: "button", class: (e[key] ?? 1) === i ? "on" : "", role: "radio", "aria-checked": String((e[key] ?? 1) === i),
      onclick: () => { e[key] = i; touch(p); paintSeg(); paint(); }}, l)));
    paintSeg(); return seg;
  }
  const faoSeg = segOf(C.FAO_LV, "fao", "Atividade, FAO/OMS 1985"), driSeg = segOf(C.DRI_LV, "dri", "Atividade física, DRI 2005");
  const methodSeg = h("div", {class: "seg", role: "radiogroup", "aria-label": "Protocolo usado"});
  const faoBox = h("div", {class: "act"}, h("div", {class: "act-t"}, "Atividade ", h("span", null, "FAO/OMS 1985")), faoSeg);
  const driBox = h("div", {class: "act"}, h("div", {class: "act-t"}, "Atividade física ", h("span", null, "DRI 2005")), driSeg);
  const faoRes = h("div"), driRes = h("div"), hero = h("div"), why = h("p", {class: "eq-n"});
  const resGrid = (tmb, fator, fl, get) => h("div", {class: "res"},
    h("div", null, h("div", {class: "k"}, "TMB"), h("div", {class: "v"}, tmb == null ? "—" : k0(tmb))),
    h("div", null, h("div", {class: "k"}, fl), h("div", {class: "v"}, fator == null ? "—" : nf2.format(fator))),
    h("div", null, h("div", {class: "k"}, "GET"), h("div", {class: "v acc"}, get == null ? "—" : k0(get))));
  const useBtn = h("button", {class: "btn primary block", type: "button", disabled: true, onclick: () => {
    const r = C.energyOf(p); if (!r.ok || !r.get) return;
    p.plan.target = Math.round(r.get); touch(p); toast(`Meta do plano: ${k0(r.get)} kcal`); paint();
  }}, "Usar como meta do plano");
  const metaNote = h("p", {class: "meta-n"});
  function paint(){
    const r = C.energyOf(p);
    const pick = ["fao", "dri"].includes(e.method) ? e.method : "media";
    const adult = !(r.age != null && r.age < 18);
    methodSeg.hidden = !adult;
    put(methodSeg, [["media", "Média"], ["fao", "FAO/OMS 1985"], ["dri", "DRI 2005"]].map(([k, l]) =>
      h("button", {type: "button", class: pick === k ? "on" : "", role: "radio", "aria-checked": String(pick === k), onclick: () => { e.method = k; touch(p); paint(); }}, l)));
    // mostra só as atividades que entram no protocolo escolhido
    faoBox.hidden = !adult || pick === "dri";
    driBox.hidden = adult && pick === "fao";
    if (!r.ok){
      put(hero, h("div", {class: "card hero"}, h("div", {class: "eyebrow"}, adult ? METHOD_LABEL[pick] : "DRI 2005"),
        h("div", {class: "hero-grid"}, h("div", null, h("div", {class: "lbl"}, "TMB"), h("div", {class: "big"}, "—")), h("div", null, h("div", {class: "lbl"}, "GET"), h("div", {class: "big gold"}, "—"))),
        h("div", {class: "hero-foot"}, "Informe peso e altura para calcular")));
      useBtn.disabled = true; useBtn.textContent = "Usar como meta do plano"; metaNote.textContent = "";
      put(faoRes, resGrid(null, C.FAO_FA[p.sex][e.fao ?? 1], "FA", null)); put(driRes, resGrid(null, null, "AF", null)); why.textContent = "";
      return;
    }
    put(hero, h("div", {class: "card hero"}, h("div", {class: "eyebrow"}, r.child && r.method === "dri" ? "DRI 2005 · inclui crescimento" : METHOD_LABEL[r.method]),
      h("div", {class: "hero-grid"},
        h("div", null, h("div", {class: "lbl"}, "TMB"), h("div", {class: "big"}, k0(r.tmb), h("small", null, "kcal"))),
        h("div", null, h("div", {class: "lbl"}, "GET"), h("div", {class: "big gold"}, r.get ? k0(r.get) : "—", r.get ? h("small", null, "kcal") : null))),
      h("div", {class: "hero-foot"}, h("span", null, `IMC ${g1(r.imc)}`), h("span", null, ageLabel(r.age)), h("span", null, `${fq.format(e.weight)} kg · ${fq.format(e.height)} cm`)),
      r.child ? h("p", {class: "note warn"}, "Para crianças e adolescentes vale a DRI 2005, que inclui a energia do crescimento. O IMC precisa ser avaliado pelas curvas de crescimento, não pelos pontos de corte de adultos.") : null));
    put(faoRes, resGrid(r.fao.tmb, r.fao.fa, "FA", r.child ? null : r.fao.get),
      h("div", {class: "eq"}, `TMB = ${nf1.format(r.fao.coef)} × P ${r.fao.cons < 0 ? "−" : "+"} ${Math.abs(r.fao.cons)} (${r.fao.range} anos)`, h("br"),
        r.child ? "Fatores de atividade definidos para adultos: não usados abaixo de 18 anos." : `GET = TMB × ${nf2.format(r.fao.fa)}`));
    put(driRes, r.dri ? [resGrid(r.dri.tmb, r.dri.PA, "AF", r.dri.get), h("div", {class: "eq"}, `GET (EER) = ${r.dri.eq}`, h("br"), "I = idade · P = kg · A = m · TMB pela equação BEE da DRI 2005")]
      : [resGrid(null, null, "AF", null), h("div", {class: "note warn"}, "As equações DRI 2005 deste app cobrem a partir de 3 anos.")]);
    why.textContent = r.method === "media" ? `Média: TMB (${k0(r.fao.tmb)} + ${k0(r.dri.tmb)}) ÷ 2 = ${k0(r.tmb)} kcal · GET (${k0(r.fao.get)} + ${k0(r.dri.get)}) ÷ 2 = ${k0(r.get)} kcal.`
      : r.child ? "Abaixo de 18 anos o app usa só a DRI 2005." : r.method === "fao-tmb" ? "Sem equação de gasto total para esta idade: só a taxa basal." : `Usando apenas ${METHOD_LABEL[r.method]}.`;
    const tg = p.plan.target, same = r.get && tg === Math.round(r.get);
    useBtn.disabled = !r.get || same; useBtn.classList.toggle("set", !!same);
    useBtn.textContent = !r.get ? "Usar como meta do plano" : same ? `✓ Meta do plano: ${k0(r.get)} kcal` : `Usar ${k0(r.get)} kcal como meta do plano`;
    metaNote.textContent = r.get && tg && !same ? `Meta atual do plano: ${k0(tg)} kcal.` : "";
  }
  body.append(hero, methodSeg, h("div", {style: "display:grid;gap:6px"}, useBtn, metaNote),
    h("div", {class: "card"},
      h("div", {class: "measures"},
        h("div", {class: "field", style: "margin:0"}, h("label", {for: "peso"}, "Peso"), h("div", {class: "mfield"}, W, h("span", null, "kg"))),
        h("div", {class: "field", style: "margin:0"}, h("label", {for: "altura"}, "Altura"), h("div", {class: "mfield"}, H, h("span", null, "cm")))),
      faoBox, driBox),
    h("details", {class: "card adv formulas"}, h("summary", null, "Fórmulas e cálculos"),
      h("div", {class: "card-t", style: "margin-top:12px"}, "FAO/OMS 1985"), faoRes,
      h("div", {class: "card-t", style: "margin-top:16px"}, "DRI 2005"), driRes, why));
  paint();
}

/* ---------- cadastro e edição de perfil ---------- */
function maskDate(v){ const d = v.replace(/\D/g, "").slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d; }
function toISO(br){
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || dt > new Date() || y < 1900) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
const fromISO = iso => iso ? iso.split("-").reverse().join("/") : "";
function profileSheet(p){
  const editing = !!p;
  let sex = p ? p.sex : null;
  sheet(editing ? "Editar perfil" : "Novo perfil", (el, close) => {
    const name = h("input", {class: "input", id: "pf-nome", placeholder: "Nome", value: p ? p.name : "", enterkeyhint: "next", autocapitalize: "words", autocomplete: "off"});
    const birth = h("input", {class: "input num", id: "pf-nasc", placeholder: "dd/mm/aaaa", inputmode: "numeric", value: p ? fromISO(p.birth) : "", autocomplete: "off"});
    const err = h("div", {class: "err"});
    const seg = h("div", {class: "seg big", role: "radiogroup", "aria-label": "Sexo"});
    const ok = h("button", {class: "btn primary block", type: "submit"}, editing ? "Salvar" : "Criar perfil");
    const paintSeg = () => seg.replaceChildren(...[["F", "Feminino"], ["M", "Masculino"]].map(([v, l]) =>
      h("button", {type: "button", class: sex === v ? "on" : "", role: "radio", "aria-checked": String(sex === v), onclick: () => { sex = v; paintSeg(); check(); }}, l)));
    const check = () => { ok.disabled = !(name.value.trim() && toISO(birth.value) && sex); };
    name.addEventListener("input", check);
    name.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); birth.focus(); } });
    birth.addEventListener("input", () => {
      birth.value = maskDate(birth.value);
      err.textContent = birth.value.length === 10 && !toISO(birth.value) ? "Data inválida. Use dd/mm/aaaa." : "";
      if (birth.value.length === 10 && toISO(birth.value)) birth.blur();
      check();
    });
    paintSeg(); check();
    const delWrap = h("div", {style: "margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"});
    const idle = () => delWrap.replaceChildren(h("button", {class: "btn danger block", type: "button", onclick: () => ask(delWrap, `Excluir o perfil de ${p.name} e todo o plano dele? Isso não pode ser desfeito.`, [{label: "Excluir", fn: () => {
      S.patients = S.patients.filter(x => x.id !== p.id);
      if (S.activeId === p.id) S.activeId = (S.patients[0] || {}).id || null;
      saveNow(); close(); go({tab: "inicio", open: [], edit: null}); toast("Perfil excluído");
    }}])}, "Excluir perfil"));
    if (editing) idle();
    const form = h("form", null,
      h("h2", null, editing ? "Editar perfil" : "Novo perfil"), h("p", {class: "sh-sub"}, editing ? "" : "Você pode cadastrar cada pessoa da família."),
      h("div", {class: "field"}, h("label", {for: "pf-nome"}, "Nome"), name),
      h("div", {class: "field"}, h("label", {for: "pf-nasc"}, "Data de nascimento"), birth, err),
      h("div", {class: "field"}, h("label", null, "Sexo (usado nas equações de energia)"), seg),
      h("div", {class: "row-actions"}, h("button", {class: "btn ghost", type: "button", onclick: close}, "Cancelar"), ok),
      editing ? delWrap : null);
    form.addEventListener("submit", e => {
      e.preventDefault(); check(); if (ok.disabled) return;
      if (editing){ p.name = name.value.trim(); p.birth = toISO(birth.value); p.sex = sex; touch(p); close(); render(); return; }
      const np = {id: uid(), name: name.value.trim(), birth: toISO(birth.value), sex, updated: Date.now(),
        energy: {weight: null, height: null, fao: 1, dri: 1}, plan: {objective: "", target: null, meals: []}};
      S.patients.push(np); S.activeId = np.id; saveNow(); close(); go({tab: "perfil", open: [], edit: null}); toast(`Perfil de ${firstName(np.name)} criado`);
      setTimeout(() => { const w = $("#peso"); if (w) w.focus(); }, 300);
    });
    el.append(form);
    if (!editing) setTimeout(() => name.focus(), 60);
  });
}

/* ---------- dados e backup ---------- */
const DAY = 864e5;
const nPeople = n => n === 1 ? "1 perfil" : `${n} perfis`;
function dataRow(){
  const real = S.patients.filter(p => !p.example).length;
  const days = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / DAY) : null;
  const due = real > 0 && (days == null || days >= 7);
  const when = days == null ? "Nenhum backup feito ainda" : days === 0 ? "Último backup: hoje" : days === 1 ? "Último backup: ontem" : `Último backup: há ${days} dias`;
  return h("div", {class: "datacard" + (due ? " due" : "")},
    h("span", {class: "dc-ic", html: ICON.lock}),
    h("div", {class: "dc-t"}, h("b", null, "Salvos só neste aparelho"), h("span", null, when)),
    h("button", {class: "btn sm " + (due ? "primary" : "ghost"), onclick: backupSheet}, due ? "Fazer backup" : "Backup"));
}
function backupSheet(){
  const backupText = () => JSON.stringify({app: "nutri-pratico", version: VERSION, exported: new Date().toISOString(), data: S});
  sheet("Backup", (el, close) => {
    const status = h("div", {class: "err", style: "color:var(--muted)"});
    const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});
    const confirmBox = h("div");
    const marked = () => { S.lastBackup = Date.now(); saveNow(); };
    async function exportNow(){
      const name = `nutri-pratico-backup-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([backupText()], {type: "application/json"});
      const done = () => { marked(); status.textContent = "Backup gerado. Guarde o arquivo em Arquivos, iCloud ou e-mail."; };
      try {
        const f = new File([blob], name, {type: "application/json"});
        if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: "Backup Nutri Prático"}); done(); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      try { const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); done(); }
      catch (e) { status.textContent = "Não foi possível gerar o arquivo neste navegador."; }
    }
    function copyNow(){
      const txt = backupText();
      const ok = () => { marked(); status.textContent = "Backup copiado. Cole em “Colar backup” no app instalado."; };
      const fallback = () => {
        const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
        try { document.execCommand("copy") ? ok() : (status.textContent = "Não foi possível copiar."); } catch (e) { status.textContent = "Não foi possível copiar."; }
        ta.remove();
      };
      try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
    }
    const pasteArea = h("textarea", {class: "input", id: "bk-colar", rows: "4", placeholder: "Toque aqui, segure e escolha Colar", style: "height:auto;padding:12px 14px;font-size:16px;resize:vertical"});
    const pasteBox = h("div", {class: "bk-row"}, pasteArea, h("button", {class: "btn primary block", type: "button", onclick: () => offerRestore(pasteArea.value)}, "Continuar"));
    pasteBox.hidden = true;
    file.addEventListener("change", () => {
      const f = file.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => offerRestore(rd.result); rd.readAsText(f); file.value = "";
    });
    function offerRestore(text, label){
      let b; try { b = JSON.parse(String(text).trim()); } catch (e) {}
      const d = b && (b.data || (Array.isArray(b.patients) ? b : null));
      if (!d || !Array.isArray(d.patients) || !d.prefs) { status.textContent = "Esse conteúdo não é um backup do Nutri Prático."; return; }
      put(confirmBox, h("div", {class: "confirm", style: "flex-wrap:wrap"},
        h("span", {style: "flex:1 1 100%"}, `Substituir ${nPeople(S.patients.length)} deste aparelho por ${nPeople(d.patients.length)} ${label || (b.exported ? "do backup de " + new Date(b.exported).toLocaleDateString("pt-BR") : "do backup")}?`),
        h("button", {class: "btn ghost", type: "button", style: "flex:1", onclick: () => confirmBox.replaceChildren()}, "Cancelar"),
        h("button", {class: "btn primary", type: "button", style: "flex:1", onclick: () => {
          try { localStorage.setItem(KEY + ".antes-de-restaurar", JSON.stringify(S)); } catch (e) {}
          for (const f of db.list.filter(x => x.own)) db.remove(f.id);
          try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
          S = null; load(); close(); go({tab: "inicio", open: [], edit: null}); toast("Backup restaurado");
        }}, "Restaurar")));
    }
    let snap = null; try { snap = localStorage.getItem(SNAP); } catch (e) {}
    el.append(h("h2", null, "Backup"),
      h("p", {class: "sh-sub"}, S.lastBackup ? `Último backup: ${new Date(S.lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda."),
      h("div", {class: "bk-row"},
        embedded ? null : h("button", {class: "btn primary block", type: "button", onclick: exportNow}, "Exportar backup (arquivo)"),
        h("button", {class: embedded ? "btn primary block" : "btn ghost block", type: "button", onclick: copyNow}, "Copiar backup"),
        h("div", {class: "eyebrow", style: "margin-top:8px"}, "Restaurar"),
        h("button", {class: "btn ghost block", type: "button", onclick: () => { pasteBox.hidden = false; pasteArea.focus(); }}, "Colar backup"),
        embedded ? null : h("button", {class: "btn ghost block", type: "button", onclick: () => file.click()}, "Restaurar de um arquivo"),
        snap ? h("button", {class: "btn ghost block", type: "button", onclick: () => offerRestore(snap, "da cópia automática feita antes da atualização")}, "Voltar à cópia de antes da atualização") : null,
        pasteBox, file, status, confirmBox,
        h("button", {class: "btn plain block", type: "button", onclick: close}, "Fechar")));
  });
}

/* ---------- início ---------- */
load();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v && TABS.some(t => t[0] === v.tab)) view = Object.assign(view, v, {edit: null}); } catch (e) {}
render();
})();
</script>
