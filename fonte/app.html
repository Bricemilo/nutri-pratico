const KEY = "nutripratico.v1", VERSION = 5, SNAP = KEY + ".antes-da-v" + VERSION, SNAPS = [SNAP, KEY + ".antes-da-v4", KEY + ".antes-da-v3", KEY + ".antes-da-v2"];
const DEFAULT_OBJ = ["Alimentação equilibrada", "Manutenção do peso", "Emagrecimento", "Hipertrofia muscular", "Performance esportiva",

      for (const m of pl.meals){ m.time = m.time || ""; m.items = m.items || []; }
    }
    p.logs = p.logs || {};
    for (const k of LOG_KINDS) p.logs[k] = p.logs[k] || [];
    p.care = Object.assign(CARE0(), p.care || {});
    // até a v4 cada prioridade era só uma frase: vira prioridade ativa, com o mesmo texto, na mesma ordem, sem indicadores escolhidos
    p.care.goals.forEach((g, i) => { if (g.status) return; g.name = g.name || g.text || "Prioridade"; delete g.text; Object.assign(g, {id: g.id || uid(), at: g.at || Date.now(), tpl: null, desc: "", status: "ativa", order: i, main: false, star: false, inds: [], targets: {}}); });
    // até a v4 "Fórmula manipulada" era uma categoria contada com os suplementos: vira característica do item, que segue em Suplementos como antes
    for (const m of p.care.meds) if (m.cat === "formula") { m.cat = "suplemento"; m.comp = true; m.parts = m.parts || []; m.catOld = true; }
    for (const m of p.care.meds) { if (!m.cat) m.cat = "suplemento"; m.times = m.times || []; }

    // até a v3 cada exame era um item com a data da última realização (last), o intervalo combinado (every) e o resultado em texto.

    for (const x of p.care.exams) if (!x.status) { x.status = x.last ? "realizado" : "solicitado"; x.date = x.last || ""; x.time = ""; delete x.last; }

}

function autocomplete(input, o){
  const list = h("div", {class: "ac", role: "listbox"}); list.hidden = true;
  const attach = () => { if (list.parentElement !== input.parentElement && input.parentElement) input.parentElement.append(list); };   // o campo pode ainda não estar na tela
  input.setAttribute("autocomplete", "off"); input.setAttribute("autocorrect", "off"); input.setAttribute("spellcheck", "false");
  let items = [], active = 0, nav = false, pend = -1;
  function render(){
    attach();
    items = o.items(input.value);
    if (!items.length || document.activeElement !== input) { list.hidden = true; return; }
    active = Math.min(active, items.length - 1);
    const kids = [];
    if (o.title && o.title(input.value)) kids.push(h("div", {class: "ac-sec"}, o.title(input.value)));
    items.forEach((it, i) => {
      const el = h("div", {class: "ac-item" + (i === active ? " on" : "") + (i === pend ? " pend" : ""), role: "option"},
        h("span", {class: "ac-l", html: i === pend ? `Remover “${esc(it.label)}” da lista?` : highlight(it.label, input.value)}),
        it.meta ? h("span", {class: "ac-m"}, it.meta) : null,
        it.removable ? h("button", {class: "ac-x", type: "button", "aria-label": i === pend ? "Confirmar remoção" : "Remover opção da lista"}, i === pend ? "Remover" : "×") : null);
      el.addEventListener("mousedown", e => e.preventDefault());
      el.addEventListener("click", e => {
        if (e.target.closest(".ac-x")) { if (pend === i) { pend = -1; o.onRemove(it); } else pend = i; render(); return; }
        if (pend === i) { pend = -1; render(); return; }
        pick(i);
      });
      kids.push(el);
    });
    list.replaceChildren(...kids);
    list.hidden = false;
  }
  function pick(i){ const it = items[i]; if (!it) return; list.hidden = true; o.onPick(it); }
  input.addEventListener("input", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("focus", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("blur", () => { list.hidden = true; o.onBlur && o.onBlur(); });
  input.addEventListener("keydown", e => {
    const open = !list.hidden && items.length;
    if (e.key === "ArrowDown" && open) { e.preventDefault(); nav = true; active = (active + 1) % items.length; render(); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); nav = true; active = (active - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter") {
      if (e.isComposing) return;
      if (open && (nav || (o.enterPicks ? o.enterPicks(input.value) : true))) { e.preventDefault(); pick(active); }
      else if (o.onEnter) { e.preventDefault(); list.hidden = true; o.onEnter(); }
    }
    else if (e.key === "Escape") list.hidden = true;
  });
  return {close(){ list.hidden = true; }};
}

/* ---------- Refeição feita (consumo) e refeições favoritas ----------
   "Feita" registra a refeição do plano como consumida hoje, com uma cópia dos valores daquele momento.
   O plano continua sendo o planejado; o consumo fica em p.logs.eaten, separado. */
const doneOf = (p, m) => logsOf(p).eaten.find(e => e.date === C.dayKey() && e.mealId === m.id);
const r1 = x => Math.round(x * 10) / 10;
function toggleDone(p, m, after){
  const L = logsOf(p), cur = doneOf(p, m), label = m.name.trim() || "Refeição";
  if (cur){
    const i = L.eaten.indexOf(cur); L.eaten.splice(i, 1); touch(p); after();
    toast(`Registro de ${label.toLowerCase()} desfeito`, () => { L.eaten.splice(i, 0, cur); touch(p); after(); });
    return;
  }
  const t = mealTotal(m); if (!t.kcal && !filled(m).length) return;
  const e = {id: uid(), at: Date.now(), date: C.dayKey(), mealId: m.id, name: label, time: m.time || "",
    t: {kcal: r1(t.kcal), c: r1(t.c), p: r1(t.p), l: r1(t.l), f: r1(t.f)}, items: filled(m).map(i => ({foodId: i.foodId, measure: i.measure, qty: i.qty}))};
  L.eaten.push(e); touch(p); after();
  toast(`${label} registrada · ${k0(e.t.kcal)} kcal`, () => { L.eaten.splice(L.eaten.indexOf(e), 1); touch(p); after(); });
}
function doneBtn(p, m, after){
  const d = !!doneOf(p, m), n = filled(m).length, label = m.name.trim() || "refeição";
  return h("button", {class: "done" + (d ? " on" : ""), type: "button", disabled: !n && !d, "aria-pressed": String(d),
    "aria-label": d ? `${label}: feita hoje. Toque para desmarcar` : `Marcar ${label} como feita hoje`, html: ICON.check,
    onclick: e => { e.stopPropagation(); toggleDone(p, m, after); }});
}
// Favoritas valem para toda a família (S.prefs.savedMeals): a mesma refeição serve para várias pessoas.
const favMeals = () => S.prefs.savedMeals;
function saveFavMeal(m){
  const name = m.name.trim() || "Refeição", list = favMeals(), old = list.find(x => norm(x.name) === norm(name));
  const fav = {id: old ? old.id : uid(), name, time: m.time || "", at: Date.now(), items: filled(m).map(i => ({foodId: i.foodId, measure: i.measure, qty: i.qty}))};
  const i = old ? list.indexOf(old) : -1;
  if (old) list.splice(i, 1, fav); else list.push(fav);
  save();
  toast(old ? `Favorita “${name}” atualizada` : `“${name}” nas favoritas`, () => { if (old) list.splice(list.indexOf(fav), 1, old); else list.splice(list.indexOf(fav), 1); save(); render(); });
}
const isFavMeal = m => favMeals().some(x => norm(x.name) === norm(m.name.trim() || "Refeição"));
const favKcal = f => C.mealTotal(db, {items: f.items.filter(i => db.has(i.foodId))}).kcal;

/* ---------- Hoje: resumo integrado ----------
   Responde "como estou e qual o próximo passo": painel da alimentação planejada, três indicadores de saúde,
   no máximo uma sugestão (core.nextAction) e atalhos de registro. */
const today = () => C.dayKey();
// cuidados de saúde do perfil: água (valor manual em mL, ou null = estimativa), suplementos/medicamentos, exames e prioridades
const careOf = p => p.care || (p.care = CARE0());
const waterOf = p => C.waterRec(p.energy.weight, C.ageOf(p.birth), careOf(p).water);
const fmtL = ml => (ml / 1000).toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const logsOf = p => { const L = p.logs || (p.logs = {}); for (const k of LOG_KINDS) L[k] = L[k] || []; return L; };
const fmtDur = m => m == null ? "—" : m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h${Math.round(m % 60) ? " " + pad2(Math.round(m % 60)) : ""}`;
const pad2 = n => String(n).padStart(2, "0");
const fmtMin = m => `${nf0.format(Math.round(m || 0))} min`;   // sempre em minutos (Exercício na Home, como a referência da OMS)
const MOODS = ["Muito mal", "Mal", "Mais ou menos", "Bem", "Muito bem"];
const adultOf = p => (C.ageOf(p.birth) ?? 0) >= 18;
function relDay(k){
  const d = C.addDays(today(), 0) === k ? 0 : C.addDays(k, 1) === today() ? 1 : null;
  if (d === 0) return "Hoje"; if (d === 1) return "Ontem";
  const [y, m, dd] = k.split("-"); return new Date(+y, m - 1, +dd).toLocaleDateString("pt-BR", {weekday: "short", day: "2-digit", month: "2-digit"});
}
function healthCtx(p){
  const L = logsOf(p), r = C.energyOf(p), t = today();
  return {energyOk: r.ok && !!r.get, hasPlan: p.plan.meals.some(m => filled(m).length), age: C.ageOf(p.birth),
    move: {count: L.move.length, week: C.moveWeek(L.move, t)}, sleep: {count: L.sleep.length, stats: C.sleepStats(L.sleep, t)}};
}

/* Reflexos dos cartões (camadas 3 e 4 do material): SVG vetorial estático, gerado uma vez por material e reutilizado.
   Uma lâmina de luz curva nasce apagada na base (sob a legenda) e se intensifica até a borda direita: corpo translúcido,
   estrias finas (a microtextura acetinada), brilho largo e fio de luz nítido, ponto quente onde a luz incide.
   viewBox 180×120 ancorado embaixo à direita ("slice"): a curva não deforma em cartões mais baixos, só perde o alto.
   Parâmetros: sx início na base · ey altura na borda direita · c1/c2 curvatura · n/ox/oy estrias e afastamento · pk posição do ponto quente
   · fill corpo · glow brilho · sec segundo reflexo (gemas). Sem filtros nem animação; montado uma vez por material e clonado a cada desenho da Home. */
const JEWEL = (() => {

  };
  const f = v => +v.toFixed(1);
  const curve = (o, dx, dy) => [[o.sx + dx, 126 + dy], [o.c1[0] + dx, o.c1[1] + dy], [o.c2[0] + dx, o.c2[1] + dy], [(o.ex || 186) + dx, o.ey + dy]];
  const d = P => `M${f(P[0][0])} ${f(P[0][1])}C${P.slice(1).map(q => `${f(q[0])} ${f(q[1])}`).join(" ")}`;
  const at = (P, t) => [0, 1].map(i => (1 - t) ** 3 * P[0][i] + 3 * (1 - t) ** 2 * t * P[1][i] + 3 * (1 - t) * t * t * P[2][i] + t ** 3 * P[3][i]);

/* Gráfico de linha genérico: eixo do tempo proporcional às datas reais; cada ponto é um registro; a linha só liga os pontos.

  if (o.band) { const a = Y(o.band.hi != null ? Math.min(o.band.hi, y1) : y1), b = Y(o.band.lo != null ? Math.max(o.band.lo, y0) : y0);

const RANGES = [["all", "Tudo"], [365, "12 meses"], [90, "3 meses"], [30, "30 dias"]];

/* ---------- Painel circular ----------
   Anel externo: energia planejada ÷ meta (0–100%, marcas em 25/50/75/100%; acima da meta o anel fica cheio e o excesso aparece em texto).
   Mostra sempre valores PLANEJADOS: o app ainda não registra o que foi consumido.
   Anel interno: divisão da energia entre carboidratos, proteínas e gorduras (Atwater 4/4/9; os três somam 100%). */
function dial(t, tg, W, o = {}){
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, a, ...kids) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); kids.forEach(k => e.append(k)); return e; };
  const s = C.macroSplit(t), pct = tg ? t.kcal / tg * 100 : null, fill = pct == null ? 0 : Math.min(pct, 100);
  const R1 = 124, R2 = o.mini ? 112 : 101, C1 = 2 * Math.PI * R1, C2 = 2 * Math.PI * R2;
  const MAC = [["c", "Carboidratos", "t-c", t.c, s.c], ["p", "Proteínas", "t-p", t.p, s.p], ["l", "Gorduras", "t-g", t.l, s.l]];
  let sel = null;
  // escala: quatro marcas (25, 50, 75 e 100% da meta); acendem quando alcançadas
  const ticks = sv("g", {class: "ticks"});
  for (let i = 0; i < 4; i++){
    const a = i / 4 * 2 * Math.PI - Math.PI / 2;
    ticks.append(sv("line", {x1: 150 + 141 * Math.cos(a), y1: 150 + 141 * Math.sin(a), x2: 150 + 133 * Math.cos(a), y2: 150 + 133 * Math.sin(a), class: fill >= (i ? i * 25 : 100) ? "lit" : ""}));

  const prog = sv("circle", {cx: 150, cy: 150, r: R1, class: "prog" + (pct > 100 ? " over" : "") + (hasEat ? " plan" : ""), "stroke-dasharray": `${C1} ${C1}`, "stroke-dashoffset": C1, transform: "rotate(-90 150 150)"});
  // consumido: mesmo anel, cobre cheio sobre o planejado (cobre translúcido)
  const eatArc = hasEat ? sv("circle", {cx: 150, cy: 150, r: R1, class: "eatarc", "stroke-dasharray": `${C1} ${C1}`, "stroke-dashoffset": C1, transform: "rotate(-90 150 150)"}) : null;
  const gap = s.atwater ? 0.012 : 0;
  let start = 0;
  const arcs = MAC.map(([k, , cls, , share]) => {
    const len = Math.max(0, share / 100 - gap) * C2;
    const el = sv("circle", {cx: 150, cy: 150, r: R2, class: "arc " + cls, "data-k": k, "stroke-dasharray": `0 ${C2}`, "stroke-dashoffset": -start * C2 - gap * C2 / 2, transform: "rotate(-90 150 150)"});

  const center = h("div", {class: "dial-c"},
    h("div", {class: "dial-k"}, k0(t.kcal)),
    h("div", {class: "dial-m"}, "kcal planejadas"),
    pct != null ? h("div", {class: "dial-p" + (pct > 100 ? " over" : "")}, pct > 100 ? `${Math.round(pct)}% · +${k0(t.kcal - tg)} kcal` : `${Math.round(pct)}% · meta ${k0(tg)}`) : h("div", {class: "dial-p dim"}, "sem meta definida"));
  const detail = h("div", {class: "dial-d", "aria-live": "polite"});
  const keys = h("div", {class: "keys", role: "group", "aria-label": "Macronutrientes"});
  function paintKeys(){
    put(keys, MAC.map(([k, name, cls, g, share]) => h("button", {class: "key" + (sel === k ? " on" : "") + (sel && sel !== k ? " dim" : ""), type: "button", "aria-pressed": String(sel === k),
      onclick: () => { sel = sel === k ? null : k; paintKeys(); }},
      h("span", {class: "k " + cls}, name), h("span", {class: "v"}, fmtG(g), h("small", null, "g")), h("span", {class: "s"}, `${Math.round(share)}%`))));
    arcs.forEach(a => { a.classList.toggle("sel", sel === a.dataset.k); a.classList.toggle("dim", !!sel && sel !== a.dataset.k); });
    const m = MAC.find(x => x[0] === sel);
    const seg = (...x) => h("span", {class: "nw"}, ...x);
    put(detail, m ? [seg(h("b", {class: m[2]}, m[1]), ` ${fmtG(m[3])} g`), seg(` · ${Math.round(m[4])}% da energia`), W ? seg(` · ${nf2.format(m[3] / W)} g/kg`) : null, seg(` · ${k0(m[3] * (m[0] === "l" ? 9 : 4))} kcal`)]
      : [seg(h("b", {class: "t-f"}, "Fibras"), ` ${fmtG(t.f)} g${t.miss.f ? "*" : ""}`), t.kcal ? seg(` · ${g1(t.f * 1000 / t.kcal)} g por 1.000 kcal`) : null]);
  }
  paintKeys();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    prog.setAttribute("stroke-dashoffset", C1 * (1 - fill / 100));
    if (eatArc && eatFill > 0) eatArc.setAttribute("stroke-dashoffset", C1 * (1 - eatFill / 100));
    arcs.forEach(a => a.setAttribute("stroke-dasharray", `${a.dataset.len} ${C2}`));
  }));
  const label = `Planejado ${k0(t.kcal)} kcal${tg ? ` de ${k0(tg)}, ${Math.round(pct)}% da meta` : ""}.${hasEat ? ` Consumido ${k0(o.eaten)} kcal.` : ""} Carboidratos ${fmtG(t.c)} g, ${Math.round(s.c)}%. Proteínas ${fmtG(t.p)} g, ${Math.round(s.p)}%. Gorduras ${fmtG(t.l)} g, ${Math.round(s.l)}%.`;
  if (o.mini){
    svg.setAttribute("viewBox", "26 26 248 248");
    put(center, h("div", {class: "dial-k"}, k0(t.kcal)), h("div", {class: "dial-m"}, "kcal planejadas"));
    return h("div", {class: "dial-wrap mini" + (o.big ? " gx" : ""), role: "img", "aria-label": label}, svg, center);
  }
  const ringKey = hasEat ? h("div", {class: "ringkey"}, h("span", null, h("i", {class: "rk-p"}), `Planejado ${k0(t.kcal)}`), h("span", null, h("i", {class: "rk-e"}), `Consumido ${k0(o.eaten)}`), h("span", null, `Meta ${k0(tg)} kcal`)) : null;
  return h("section", {class: "dial" + (o.compact ? " compact" : ""), "aria-label": label},
    o.head || null, h("div", {class: "dial-wrap"}, svg, center), ringKey, keys, detail, missNote(t), o.extra || null);
}

// Anel de energia dos macronutrientes (fração da energia de C, P e G pelos fatores 4/4/9, como em C.macroSplit), com o total planejado no centro.
// O total vem da energia declarada de cada alimento (TACO ou rótulo), não da soma 4/4/9: os dois podem diferir alguns por cento (ver PRODUTO.md §39).
// v47: anel mais fino e maior (o número respira), pontas arredondadas com um respiro entre os arcos.
// Ao entrar na tela (ou trocar de plano), os arcos se desenham num giro e o número sobe até o total; com "Reduzir movimento", aparece pronto.
const RM = matchMedia("(prefers-reduced-motion: reduce)");
function macroRing(t, sp, anim){
  const R = 52, L = 2 * Math.PI * R, SW = 7, segs = [["t-c", sp.c], ["t-p", sp.p], ["t-g", sp.l]].filter(x => x[1] > 0);
  const gap = segs.length > 1 ? SW + 3.4 : 0;   // com pontas redondas, o espaço visível entre os arcos fica em ~3,4 (de 120)
  let off = 0; const arcs = segs.map(([c, pc]) => { const len = L * pc / 100, d = Math.max(0.01, len - gap);
    const a = `<circle class="rg ${c}" cx="60" cy="60" r="${R}" stroke-dasharray="${d.toFixed(2)} ${(L - d).toFixed(2)}" stroke-dashoffset="${(-(off + gap / 2)).toFixed(2)}"/>`; off += len; return a; }).join("");
  const go = anim && !RM.matches && segs.length > 0;
  const mask = go ? `<mask id="sx-m" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><circle class="sx-sweep" cx="60" cy="60" r="${R}" stroke="#fff" stroke-width="16" stroke-dasharray="${L.toFixed(2)} ${L.toFixed(2)}" stroke-dashoffset="${L.toFixed(2)}"/></mask>` : "";
  const num = h("b", null, k0(go ? 0 : t.kcal));
  const el = h("div", {class: "sx-ring" + (go ? " anim" : ""), "aria-hidden": "true"},
    h("span", {style: "display:contents", html: `<svg viewBox="0 0 120 120"><circle class="rg-trk" cx="60" cy="60" r="${R}"/><g transform="rotate(-90 60 60)">${mask}<g${go ? ' mask="url(#sx-m)"' : ""}>${arcs}</g></g></svg>`}),
    h("span", {class: "sx-c"}, num, h("span", null, "kcal")));
  if (go){   // o número acompanha o giro (mesma duração e curva de desaceleração)
    const end = t.kcal, t0 = performance.now() + 120, dur = 1050;
    const step = now => { if (!num.isConnected && now - t0 > 200) return; const x = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - x, 3);

}

  /* ---- substituição inteligente ---- */
  function swapSheet(m, it){
    const orig = db.get(it.foodId);
    let crit = "kcal", picked = null, q = "";
    const CRIT = [["kcal", "Energia"], ["c", "Carboidratos"], ["p", "Proteínas"], ["free", "Livre"]];
    const base = calcItem(it);
    sheet("Substituir alimento", (el, close) => {
      const seg = h("div", {class: "seg crit", role: "radiogroup", "aria-label": "Critério da substituição"});
      const listEl = h("div", {class: "subs"}), noteEl = h("p", {class: "note"}), bar = h("div", {class: "confirmbar"});

        const qOpt = {use: S.prefs.use, last: S.prefs.last, limit: 12};
        if (words(q).length){
          return search(q, 12).filter(f => !orig || f.id !== orig.id).map(f => crit === "free" || !base ? freeOpt(f) : (C.equivalent(db, it, f, crit, S.prefs.last[f.id]) || freeOpt(f)));
        }
        if (!base) return [];
        if (crit === "free") return C.substitutes(db, it, "kcal", qOpt).map(o => freeOpt(o.food));
        return C.substitutes(db, it, crit, qOpt);
      }
      function freeOpt(f){
        const ms = C.measureOf(f, lastMeasure(f)), x = {foodId: f.id, measure: ms.l, qty: 1}, c = calcItem(x);
        const b0 = base || {kcal: 0, c: 0, p: 0, l: 0};
        return {food: f, measure: ms, qty: 1, calc: c, free: true, delta: {kcal: c.kcal - b0.kcal, c: c.c - b0.c, p: c.p - b0.p, l: c.l - b0.l}};
      }
      function paint(){
        put(seg, CRIT.map(([k, l]) => h("button", {type: "button", class: crit === k ? "on" : "", role: "radio", "aria-checked": String(crit === k), onclick: () => { crit = k; picked = null; paint(); }}, l)));
        noteEl.textContent = crit === "kcal" ? "Quantidades com a mesma energia. Proteínas, fibras, vitaminas e minerais podem ser diferentes."

          : crit === "p" ? "Quantidades com a mesma quantidade de proteínas. A energia e os outros nutrientes podem mudar."
          : "Troca livre: escolha o alimento e ajuste a quantidade depois.";
        const opts = options();

          const d = o.delta, main = crit === "c" ? d.c : crit === "p" ? d.p : d.kcal;
          return h("button", {class: "so" + (picked && picked.food.id === o.food.id ? " on" : ""), type: "button", onclick: () => { picked = o; paint(); }},
            h("span", {class: "so-n"}, o.food.dn), h("span", {class: "so-k"}, `${k0(o.calc.kcal)} kcal`),
            h("span", {class: "so-q"}, `${fmtQty(o.qty)} × ${o.measure.l} · ${k0(o.calc.g)} g`),
            h("span", {class: "so-d"}, crit === "kcal" || crit === "free" ? `${signed(d.kcal, k0)} kcal` : crit === "c" ? `C ${signed(d.c, fmtG)} g · ${signed(d.kcal, k0)} kcal` : `P ${signed(d.p, fmtG)} g · ${signed(d.kcal, k0)} kcal`));
        }) : h("div", {class: "empty"}, "Nenhuma alternativa com esse critério. Tente outro critério ou busque um alimento."));
        if (picked){
          const before = planTotal(plan).kcal, after = before + picked.delta.kcal;
          bar.hidden = false;
          put(bar, h("p", null, `${orig ? orig.dn : "Alimento removido"} → `, h("b", null, picked.food.dn), ` (${fmtQty(picked.qty)} × ${picked.measure.l}). Plano: ${k0(before)} → ${k0(after)} kcal.`),
            h("button", {class: "btn primary block", type: "button", onclick: () => {
              it.foodId = picked.food.id; it.measure = picked.measure.l; it.qty = picked.qty;
              noteUse(it.foodId); touch(p); view.edit = it.id; close(); rebuild(m); toast("Alimento substituído");
            }}, "Confirmar troca"));
        } else bar.hidden = true;
      }
      el.append(h("h2", null, `Substituir ${orig ? orig.dn : "alimento"}`),
        h("p", {class: "sh-sub"}, base ? `${fmtQty(it.qty)} × ${C.measureOf(orig, it.measure).l} · ${k0(base.g)} g · ${k0(base.kcal)} kcal` : ""),
        seg, h("div", {class: "search", style: "margin:12px 0 4px"}, ic("search"), sIn), noteEl, listEl, bar);
      paint();
    });
  }

  /* ---- copiar plano como texto ---- */

    mealsEl,
    h("div", {class: "add-row"}, h("button", {class: "add-meal", onclick: () => addMeal()}, ic("plus"), "Adicionar refeição")),
    srcNote("Valores planejados. Composição: TACO 4ª ed. (NEPA/UNICAMP, 2011). Medidas caseiras: POF 2008–2009 (IBGE).")));
  paintPlans(); paintSum();
  if (!plan.meals.length) addMeal(null, false);
  if (view.focusMeal){
    const R = refs.get(view.focusMeal); view.focusMeal = null;
    if (R) setTimeout(() => R.card.scrollIntoView({block: "start", behavior: "smooth"}), 60);
  }

function copyText(text, okMsg){
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy") ? done() : toast("Não foi possível copiar"); } catch (e) { toast("Não foi possível copiar"); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

function foodDetail(f, after){
  const p = active();
  let mlabel = lastMeasure(f);
  sheet(f.dn, (el, close) => {
    const body = h("div");
    const star = h("button", {class: "btn ghost sm", type: "button"});
    const paintStar = () => put(star, h("span", {html: isFav(f.id) ? ICON.starOn : ICON.star, style: "display:contents"}), isFav(f.id) ? "Favorito" : "Favoritar");
    star.addEventListener("click", () => { toggleFav(f.id); paintStar(); after && after(); });
    paintStar();
    function paint(){
      const ms = C.measureOf(f, mlabel), c = C.calcItem(db, {foodId: f.id, measure: ms.l, qty: ms.l === "Grama" ? 100 : 1});

/* ---------- leitura da tabela nutricional por foto ----------
   Tudo acontece no aparelho (tesseract.js, hospedado junto com o app). A foto é lida, reduzida a texto e descartada:
   nada é enviado para servidores e nenhuma imagem ou miniatura é guardada. O iOS pode manter cópias temporárias
   próprias da câmera; essas não ficam sob controle do app. */
const OCR_BASE = new URL("vendor/tesseract/", location.href).href;
let ocrLoading = null;
function loadOCR(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return ocrLoading || (ocrLoading = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = OCR_BASE + "tesseract.min.js";
    sc.onload = () => res(window.Tesseract);
    sc.onerror = () => { ocrLoading = null; rej(new Error("leitor indisponível")); };
    document.head.append(sc);
  }));
}
function scanLabel(prefill, done){
  const input = h("input", {type: "file", accept: "image/*", hidden: true});
  document.body.append(input);
  input.addEventListener("change", () => {
    let file = input.files && input.files[0];
    input.value = ""; input.remove();
    if (!file) return;
    let step = h("p", {class: "scan-s"}, "Preparando a foto…"), bar = h("div", {class: "scan-bar"}, h("i"));
    const sh = sheet("Lendo a tabela", el => el.append(h("h2", null, "Lendo a tabela nutricional"),
      h("p", {class: "sh-sub"}, "A foto é lida neste aparelho e apagada em seguida. Nada é enviado."), bar, step));
    const progress = (txt, v) => { step.textContent = txt; if (v != null) bar.firstChild.style.width = `${Math.round(v * 100)}%`; };
    (async () => {
      let bmp = null, canvas = null, worker = null;
      try {
        bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
        file = null;   // o arquivo original não é mais referenciado
        // reduz e realça o contraste em tons de cinza (melhora a leitura de rótulos)
        const scale = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
        canvas = document.createElement("canvas");
        canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
        const ctx = canvas.getContext("2d", {willReadFrequently: true});
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close(); bmp = null;
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
        let lo = 255, hi = 0;
        for (let i = 0; i < d.length; i += 4){ const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = g; if (g < lo) lo = g; if (g > hi) hi = g; }
        const span = Math.max(1, hi - lo);
        for (let i = 0; i < d.length; i += 4){ const g = (d[i] - lo) * 255 / span; d[i] = d[i + 1] = d[i + 2] = g; }
        ctx.putImageData(img, 0, 0);
        progress("Carregando o leitor de texto (só na primeira vez)…", 0.1);
        const T = await loadOCR();
        worker = await T.createWorker("por", 1, {
          workerPath: OCR_BASE + "worker.min.js", corePath: OCR_BASE + "core", langPath: OCR_BASE + "lang", cacheMethod: "none",
          logger: m => { if (m.status === "recognizing text") progress("Lendo os valores…", 0.3 + 0.7 * m.progress); }
        });
        const {data} = await worker.recognize(canvas);
        const result = C.parseLabel(data.text, {confidence: data.confidence});
        result.confidence = data.confidence;
        sh.close();
        foodSheet({prefill, scan: result}, done);
      } catch (e) {
        progress("Não foi possível ler esta foto. Tente com mais luz, a tabela reta e preenchendo a tela, ou digite os dados.", null);
        sh.el.append(h("div", {class: "bk-row", style: "margin-top:14px"},
          h("button", {class: "btn primary block", type: "button", onclick: () => { sh.close(); scanLabel(prefill, done); }}, "Tentar outra foto"),
          h("button", {class: "btn ghost block", type: "button", onclick: () => { sh.close(); foodSheet({prefill}, done); }}, "Digitar os dados")));
      } finally {
        // descarte: nenhuma imagem permanece em memória ou armazenada
        if (bmp) bmp.close();
        if (canvas) { canvas.width = 0; canvas.height = 0; canvas = null; }
        file = null;
        if (worker) worker.terminate().catch(() => {});
      }
    })();
  });
  input.click();
}

    const hasExtra = EXTRA.some(([k]) => v0(k) != null);
    function check(){

    h("p", null, "Resultados de exames são guardados como informados (valor, unidade, data da coleta e referência do laboratório). Nomes equivalentes formam um só marcador (ex.: LDL, LDL-C e Colesterol LDL). No gráfico, unidades diferentes só se juntam quando há conversão validada para aquele analito: glicose 18,016 (mg/dL por mmol/L); colesterol total, LDL, HDL e não HDL 38,67; triglicerídeos 88,57; creatinina 88,42 (µmol/L por mg/dL); ácido úrico 59,48; vitamina D (25-OH) 2,496 (nmol/L por ng/mL); vitamina B12 0,7378 (pmol/L por pg/mL); hemoglobina 10 (g/L por g/dL); PCR ultrassensível 10 (mg/L por mg/dL); hemoglobina glicada pela equação mestra IFCC–NGSP (% = 0,09148 × mmol/mol + 2,152). Sem conversão validada, o resultado fica fora do gráfico e continua na lista. O eixo do tempo respeita o intervalo real entre as datas; a linha só liga as medições."),
    h("h3", null, "Substituições"),
    h("p", null, "Sugere alimentos com o mesmo papel principal (fonte de carboidrato, proteína ou gordura) e calcula a quantidade com a mesma energia, carboidratos ou proteínas. Alimentos equivalentes nesse critério não são nutricionalmente idênticos."),
    h("p", null, "Este app organiza o planejamento. Ele não substitui orientação de nutricionista ou médico, especialmente para crianças, gestantes e pessoas com doenças."));
}

/* ---------- Necessidade energética ----------
   Resumo primeiro (TMB, GET e protocolo escolhido); as equações ficam em "Fórmulas e cálculos". */
// Limitações em uma frase, exibidas sob o seletor (o detalhe fica em "Como o Briceno Life calcula").
const METHOD_NOTE = {
  dri: "Padrão. Estima o gasto total por idade, peso, altura e atividade. Feita para pessoas saudáveis; em sobrepeso, gestação ou doenças é menos precisa.",
  fao: "Taxa basal pelo peso (Schofield) × fator de atividade. Não usa a altura; os fatores descrevem grupos, não indivíduos.",
  media: "Média das duas estimativas. Não é um método científico próprio: serve para comparar os protocolos."};
const METHOD_LABEL = {media: "Média FAO/OMS 1985 + DRI 2005", fao: "FAO/OMS 1985", dri: "DRI 2005", "fao-tmb": "FAO/OMS 1985 · só taxa basal"};
/* ---------- cadastro e edição de perfil ---------- */
function maskDate(v){ const d = v.replace(/\D/g, "").slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d; }
function toISO(br){
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || dt > new Date() || y < 1900) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
const fromISO = iso => iso ? iso.split("-").reverse().join("/") : "";
function profileSheet(p){
  const editing = !!p;
  let sex = p ? p.sex : null;
  sheet(editing ? "Editar perfil" : "Novo perfil", (el, close) => {
    const name = h("input", {class: "input", id: "pf-nome", placeholder: "Nome", value: p ? p.name : "", enterkeyhint: "next", autocapitalize: "words", autocomplete: "off"});
    const birth = h("input", {class: "input num", id: "pf-nasc", placeholder: "dd/mm/aaaa", inputmode: "numeric", value: p ? fromISO(p.birth) : "", autocomplete: "off"});
    const err = h("div", {class: "err"});
    const seg = h("div", {class: "seg big", role: "radiogroup", "aria-label": "Sexo"});
    const ok = h("button", {class: "btn primary block", type: "submit"}, editing ? "Salvar" : "Criar perfil");
    const paintSeg = () => seg.replaceChildren(...[["F", "Feminino"], ["M", "Masculino"]].map(([v, l]) =>
      h("button", {type: "button", class: sex === v ? "on" : "", role: "radio", "aria-checked": String(sex === v), onclick: () => { sex = v; paintSeg(); check(); }}, l)));
    const check = () => { ok.disabled = !(name.value.trim() && toISO(birth.value) && sex); };
    name.addEventListener("input", check);
    name.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); birth.focus(); } });
    birth.addEventListener("input", () => {
      birth.value = maskDate(birth.value);
      err.textContent = birth.value.length === 10 && !toISO(birth.value) ? "Data inválida. Use dd/mm/aaaa." : "";
      if (birth.value.length === 10 && toISO(birth.value)) birth.blur();
      check();
    });
    paintSeg(); check();
    const delWrap = h("div", {style: "margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"});
    const idle = () => delWrap.replaceChildren(h("button", {class: "btn danger block", type: "button", onclick: () => ask(delWrap, `Excluir o perfil de ${p.name} e todo o plano dele? Isso não pode ser desfeito.`, [{label: "Excluir", fn: () => {
      const docIds = [...careOf(p).exams, ...careOf(p).appts, ...careOf(p).procs].flatMap(x => (x.docs || []).map(d => d.id));
      S.patients = S.patients.filter(x => x.id !== p.id); docsGC(docIds);
      if (S.activeId === p.id) S.activeId = (S.patients[0] || {}).id || null;
      saveNow(); close(); go({tab: "hoje", open: [], edit: null}); toast("Perfil excluído");
    }}])}, "Excluir perfil"));
    if (editing) idle();
    const form = h("form", null,
      h("h2", null, editing ? "Editar perfil" : "Novo perfil"), h("p", {class: "sh-sub"}, editing ? "" : "Você pode cadastrar cada pessoa da família."),
      h("div", {class: "field"}, h("label", {for: "pf-nome"}, "Nome"), name),
      h("div", {class: "field"}, h("label", {for: "pf-nasc"}, "Data de nascimento"), birth, err),
      h("div", {class: "field"}, h("label", null, "Sexo (usado nas equações de energia)"), seg),
      h("div", {class: "row-actions"}, h("button", {class: "btn ghost", type: "button", onclick: close}, "Cancelar"), ok),
      editing ? delWrap : null);
    form.addEventListener("submit", e => {
      e.preventDefault(); check(); if (ok.disabled) return;
      if (editing){ p.name = name.value.trim(); p.birth = toISO(birth.value); p.sex = sex; touch(p); close(); render(); return; }
      const np = {id: uid(), name: name.value.trim(), birth: toISO(birth.value), sex, updated: Date.now(),
        energy: {weight: null, height: null, fao: 1, dri: 1}, plan: {id: uid(), name: "", pos: 0, objective: "", target: null, meals: []}, plans: []};
      S.patients.push(np); S.activeId = np.id; saveNow(); close(); go({tab: "perfil", open: [], edit: null}); toast(`Perfil de ${firstName(np.name)} criado`);
      setTimeout(() => bodySheet(np), 320);   // próximo passo natural: peso e altura
    });
    el.append(form);
    if (!editing) setTimeout(() => name.focus(), 60);
  });
}

/* ---------- dados e backup ---------- */
const DAY = 864e5;
const nPeople = n => n === 1 ? "1 perfil" : `${n} perfis`;
function dataRow(){
  const real = S.patients.filter(p => !p.example).length;
  const days = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / DAY) : null;
  const due = real > 0 && (days == null || days >= 7);
  const when = days == null ? "Nenhum backup feito ainda" : days === 0 ? "Último backup: hoje" : days === 1 ? "Último backup: ontem" : `Último backup: há ${days} dias`;
  return h("div", {class: "datacard" + (due ? " due" : "")},
    h("span", {class: "dc-ic", html: ICON.lock}),
    h("div", {class: "dc-t"}, h("b", null, "Salvos só neste aparelho"), h("span", null, when)),
    h("button", {class: "btn sm " + (due ? "primary" : "ghost"), onclick: backupSheet}, due ? "Fazer backup" : "Backup"));
}
function backupSheet(){
  const backupText = () => JSON.stringify({app: "nutri-pratico", version: VERSION, exported: new Date().toISOString(), data: S});
  sheet("Backup", (el, close) => {
    const status = h("div", {class: "err", style: "color:var(--muted)"});
    const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});
    const confirmBox = h("div");
    const marked = () => { S.lastBackup = Date.now(); saveNow(); };
    async function exportNow(){
      const name = `nutri-pratico-backup-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([backupText()], {type: "application/json"});
      const done = () => { marked(); status.textContent = "Backup gerado. Guarde o arquivo em Arquivos, iCloud ou e-mail."; };
      try {
        const f = new File([blob], name, {type: "application/json"});
        if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: "Backup Briceno Life"}); done(); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      try { const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); done(); }
      catch (e) { status.textContent = "Não foi possível gerar o arquivo neste navegador."; }
    }
    function copyNow(){
      const txt = backupText();
      const ok = () => { marked(); status.textContent = "Backup copiado. Cole em “Colar backup” no app instalado."; };
      const fallback = () => {
        const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
        try { document.execCommand("copy") ? ok() : (status.textContent = "Não foi possível copiar."); } catch (e) { status.textContent = "Não foi possível copiar."; }
        ta.remove();
      };
      try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
    }
    const pasteArea = h("textarea", {class: "input", id: "bk-colar", rows: "4", placeholder: "Toque aqui, segure e escolha Colar", style: "height:auto;padding:12px 14px;font-size:16px;resize:vertical"});
    const pasteBox = h("div", {class: "bk-row"}, pasteArea, h("button", {class: "btn primary block", type: "button", onclick: () => offerRestore(pasteArea.value)}, "Continuar"));
    pasteBox.hidden = true;
    file.addEventListener("change", () => {
      const f = file.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => offerRestore(rd.result); rd.readAsText(f); file.value = "";
    });
    function offerRestore(text, label){
      let b; try { b = JSON.parse(String(text).trim()); } catch (e) {}
      const d = b && (b.data || (Array.isArray(b.patients) ? b : null));
      if (!d || !Array.isArray(d.patients) || !d.prefs) { status.textContent = "Esse conteúdo não é um backup do Briceno Life."; return; }
      put(confirmBox, h("div", {class: "confirm", style: "flex-wrap:wrap"},
        h("span", {style: "flex:1 1 100%"}, `Substituir ${nPeople(S.patients.length)} deste aparelho por ${nPeople(d.patients.length)} ${label || (b.exported ? "do backup de " + new Date(b.exported).toLocaleDateString("pt-BR") : "do backup")}?`),
        h("button", {class: "btn ghost", type: "button", style: "flex:1", onclick: () => confirmBox.replaceChildren()}, "Cancelar"),
        h("button", {class: "btn primary", type: "button", style: "flex:1", onclick: () => {
          const prev = JSON.stringify(S);
          try { localStorage.setItem(KEY + ".antes-de-restaurar", prev); } catch (e) {}
          try { localStorage.setItem(KEY, JSON.stringify(d)); }
          catch (e) { status.textContent = "Não foi possível restaurar: o armazenamento deste aparelho está cheio ou bloqueado. Nada foi alterado."; confirmBox.replaceChildren(); return; }
          for (const f of db.list.filter(x => x.own)) db.remove(f.id);
          S = null; load(); close(); go({tab: "hoje", open: [], edit: null}); toast("Backup restaurado");
        }}, "Restaurar")));
    }
    let snap = null; try { for (const k of SNAPS) if (!snap) snap = localStorage.getItem(k); } catch (e) {}   // a cópia mais recente feita antes de uma atualização
    el.append(h("h2", null, "Backup"),
      h("p", {class: "sh-sub"}, S.lastBackup ? `Último backup: ${new Date(S.lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda."),
      h("p", {class: "note", style: "margin:-8px 0 14px"}, "O backup contém os dados de saúde da família (inclusive agenda, exames, resultados, procedimentos, prioridades e medições), sem criptografia. Guarde o arquivo em um lugar só seu. Documentos anexados (PDF e imagens) não entram no backup: ficam só neste aparelho."),
      h("div", {class: "bk-row"},
        embedded ? null : h("button", {class: "btn primary block", type: "button", onclick: exportNow}, "Exportar backup (arquivo)"),
        h("button", {class: embedded ? "btn primary block" : "btn ghost block", type: "button", onclick: copyNow}, "Copiar backup"),
        h("div", {class: "eyebrow", style: "margin-top:8px"}, "Restaurar"),
        h("button", {class: "btn ghost block", type: "button", onclick: () => { pasteBox.hidden = false; pasteArea.focus(); }}, "Colar backup"),
        embedded ? null : h("button", {class: "btn ghost block", type: "button", onclick: () => file.click()}, "Restaurar de um arquivo"),
        snap ? h("button", {class: "btn ghost block", type: "button", onclick: () => offerRestore(snap, "da cópia automática feita antes da atualização")}, "Voltar à cópia de antes da atualização") : null,
        pasteBox, file, status, confirmBox,
        h("button", {class: "btn plain block", type: "button", onclick: close}, "Fechar")));
  });
}

/* ---------- início ---------- */
(() => {   // tamanho de texto do iPhone (Ajustes → Tela e Brilho → Tamanho do Texto), com limite para o layout não quebrar
  const pr = document.createElement("span"); pr.style.font = "-apple-system-body"; pr.textContent = "a"; document.body.append(pr);
  const px = pr.style.font ? parseFloat(getComputedStyle(pr).fontSize) : 0; pr.remove();
  if (px) document.documentElement.style.fontSize = Math.min(24, Math.max(15, px)) + "px";
  document.documentElement.classList.toggle("big-text", px >= 19);   // texto ampliado: layouts de 4 colunas viram 2×2
})();
load();
measureViewport();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v && (TABS.some(t => t[0] === v.tab) || v.tab === "perfil")) view = Object.assign(view, v, {edit: null}); if (view.sub === "favoritos") view.sub = "plano"; } catch (e) {}
render();
settleLayout();
})();
