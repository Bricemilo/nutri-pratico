<title>Briceno Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briceno Life">
<style>
/* Layout: uma coluna de app nativo (máx. 600px) sobre preto quente, barra de abas no rodapé.
   Superfícies em grafite separam os blocos; o cobre marca só o essencial; macros em champanhe, pátina, rosé e sálvia. */
:root{
  --bg:#0A0908; --surface:#191614; --surface-2:#221E1B; --surface-3:#2B2622;
  --ink:#F4EEE8; --ink-2:#CDC3B9; --muted:#968B81; --line:#2D2824; --line-2:#3B352F;
  --accent:#E08C4E; --accent-2:#F2A468; --accent-ink:#1C0E05; --accent-soft:#2F1E12; --accent-line:#6B4226;
  --carb:#E58D4D; --prot:#AE625C; --prot-ink:#CB8078; --fat:#E9C56F; --fib:#86AB91; --ring:#CDC3B9; --food:#E08C4E; --move:#5FC4B8; --sleep:#9C93EE; --mood:#E58BB0; --water:#62B8D6; --energy:#D9B872; --supp:#AFC274; --meds:#8EAAD8; --danger:#FF7D74; --danger-soft:#33191A; --ok:#8FCB9B;
  --hero-1:#2E1D11; --hero-2:#181513; --scrim:rgba(0,0,0,.62); --shadow:0 14px 36px rgba(0,0,0,.5);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --tabbar:58px;
  /* Design system: espaçamento em base 4, raios e escala tipográfica (em rem: acompanha o tamanho de texto do iPhone) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-s:12px; --r-m:16px; --r-l:20px; --r-xl:24px;
  --t-cap:.765rem; --t-sm:.824rem; --t-body:.941rem; --t-h:1rem; --t-sec:1.118rem; --t-title:1.3rem; --t-page:1.882rem; --t-num:1.529rem; --t-num-l:2.353rem;
  /* BRICEÑO · Digital Jewelry — tokens oficiais (referência visual: Home v23; documentação em DESIGN-SYSTEM.md).
     Oito materiais: cor do material + base profunda. Usar sempre por estes nomes; não criar variações locais. */
  --dj-copper:#DE8A4A;    --dj-copper-deep:#1E1108;      /* Nutrição · cobre acetinado */
  --dj-emerald:#3FBFA0;   --dj-emerald-deep:#061B16;     /* Exercício · titânio esmeralda */
  --dj-amethyst:#9F86EA;  --dj-amethyst-deep:#170F2C;    /* Sono · ametista profunda */
  --dj-ruby:#E66F8E;      --dj-ruby-deep:#250D17;        /* Emocional · rubi rosado */
  --dj-champagne:#D7B378; --dj-champagne-deep:#19130B;   /* GET · bronze champanhe (Perfil; fora da Home desde a v31) */
  --dj-sapphire:#35A9E0;  --dj-sapphire-deep:#06172A;    /* Hidratação · safira azul */
  --dj-peridot:#A6C452;   --dj-peridot-deep:#0F1708;     /* Suplementos · peridoto oliva */
  --dj-midnight:#6F98E6;  --dj-midnight-deep:#0B1430;    /* Exames · safira da meia-noite (também o ícone dos medicamentos) */
  --dj-amber:#E0A25C;     --dj-amber-deep:#1D1307;       /* Consultas · âmbar mel */
  --dj-rosegold:#E39A8A;                                  /* Procedimentos · ouro rosé (ícone e destaque nos módulos; sem cartão próprio na Home) */
  /* sinal cobre (aba ativa, segmento das divisórias) e fio das divisórias */
  --dj-signal:#EEA36A; --dj-signal-line:#E39A60;
  --dj-hairline:rgba(150,136,124,.40); --dj-hairline-core:rgba(172,142,116,.58); --dj-hairline-seg:rgba(222,156,108,.96);
  /* raios: cartão, pastilha de ícone, botão-ferramenta */
  --dj-r-card:18px; --dj-r-tile:8px; --dj-r-tool:13px;
  /* área segura inferior efetiva. Em alguns iPhones, no app instalado, o iOS informa à página a altura da tela sem a faixa do relógio
     (ex.: 797 em vez de 844 pt) e não desenha nada abaixo dela: o indicador de início fica FORA da área do app, mas env() continua
     informando 34. --vgap (medido em measureViewport, no início de toda passada de layout) desconta essa parte; nos demais casos --sab = env(safe-area-inset-bottom). */
  --sab:max(0px, calc(env(safe-area-inset-bottom,0px) - var(--vgap,0px)));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:var(--t-body);line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* espaço final das telas: altura da barra + 28. A área segura inferior já entra uma vez, no padding da página (:root, versão instalável);
   somá-la aqui também a duplicava (62 pt em vez de 28 acima da barra ao fim da rolagem) */
.app{max-width:600px;margin:0 auto;padding-bottom:calc(var(--tabbar) + 28px)}
.app:has(> .home){padding-bottom:var(--home-pb,calc(var(--tabbar) + 16px + var(--sab)))}
.view{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cabeçalho fixo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:var(--t-body)}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.mark-b{display:block;object-fit:cover;background:#140D09;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:70%}
.who .av{width:30px;height:30px;font-size:var(--t-cap);border-width:1px}
.who b{font-weight:600;font-size:var(--t-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{width:14px;height:14px;color:var(--muted);flex:none}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* Barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + var(--sab)) max(12px,env(safe-area-inset-left,0px));transition:transform .2s}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:var(--t-cap);font-weight:600;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-2)}
body.typing .tabbar{transform:translateY(110%)}

h1{font-size:1.882rem;line-height:1.08;letter-spacing:-.035em;font-weight:650;margin:16px 0 4px;text-wrap:balance}
h2.sec{font-size:0.765rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px}
.sub{color:var(--muted);font-size:var(--t-sm)}
.eyebrow{font-size:var(--t-cap);font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-t{font-weight:620;font-size:0.971rem;letter-spacing:-.01em}
.hero{background:linear-gradient(155deg,var(--hero-1),var(--hero-2) 72%);border:1px solid var(--accent-line)}
.note{font-size:var(--t-cap);color:var(--muted);margin-top:8px;line-height:1.5}
.warn{color:var(--accent-2)}

/* Botões e campos */
.btn{height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft);border:1px solid transparent}
.btn.plain{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 13px;font-size:var(--t-sm);border-radius:11px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:var(--t-cap);color:var(--muted);font-weight:500}
.input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:1rem;outline:none;width:100%}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:var(--danger);font-size:0.765rem;min-height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{height:40px;border-radius:10px;font-weight:550;font-size:var(--t-sm);color:var(--muted);padding:0 4px;line-height:1.1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crit button{font-size:var(--t-cap);letter-spacing:-.01em;padding:0 2px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.seg.big button{height:46px;font-size:var(--t-body)}
.sheet .seg{background:var(--surface-2)}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:var(--t-cap);height:44px;letter-spacing:-.01em;padding:0 2px;white-space:normal}
@media (max-width:370px){.seg4{grid-template-columns:repeat(2,1fr)}}
.row-actions{display:flex;gap:10px;margin-top:8px}
.row-actions .btn{flex:1}
.confirm{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:var(--t-sm);color:var(--ink-2)}
.ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger-soft);font-size:var(--t-sm);color:var(--ink)}
.ask span{flex:1 1 140px}
.ask-b{display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + var(--sab)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-height:92%;overflow:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:1.294rem;letter-spacing:-.02em;margin:0 0 4px;font-weight:650;text-wrap:balance}
.sheet .sh-sub{font-size:var(--t-sm);color:var(--muted);margin:0 0 16px}
.bk-row{display:flex;flex-direction:column;gap:10px}

/* Autocompletar */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface-3);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px;overscroll-behavior:contain}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;min-height:44px}
.ac-item.on{background:var(--accent-soft)}
.ac-item.pend{background:var(--danger-soft)}
.ac-l{flex:1;min-width:0;font-size:var(--t-body)}
.ac-l b{font-weight:650;color:var(--accent-2)}
.ac-m{font-size:var(--t-cap);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-x{min-width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:1.059rem;line-height:1;padding:0 6px}
.ac-item.pend .ac-x{color:var(--danger);font-size:0.765rem;font-weight:600;background:var(--surface-2)}
.ac-sec{font-size:var(--t-cap);font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}

/* Avatares e listas */
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:600;font-size:var(--t-body);flex:none;letter-spacing:-.01em}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;border-top:1px solid var(--line);text-align:left;min-height:56px}
.li:first-child{border-top:0}
.li:active{background:var(--surface-2)}
.li-m{flex:1;min-width:0}
.li-t{font-weight:560;font-size:var(--t-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t b{color:var(--accent-2);font-weight:inherit}
.li-s{color:var(--muted);font-size:0.765rem;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:grid;width:22px;height:22px;color:var(--accent-2);flex:none}
.check svg{width:22px;height:22px}
.li > svg,.li-go svg,.li > span[style] > svg{width:18px;height:18px;color:var(--muted);flex:none}
.av svg{width:20px;height:20px}
.chip{display:inline-block;font-size:var(--t-cap);font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:8px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:6px}

/* Totais: nome do macro colorido, gramas e % na 1ª linha, g/kg na 2ª; fibras numa linha própria */
.mwrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid > div{min-width:0;text-align:center;border-left:1px solid var(--line-2);padding:0 4px}
.mgrid > div:first-child{border-left:0}
.mgrid .k{font-size:var(--t-cap);font-weight:650;letter-spacing:.01em}
.mgrid .v{font-size:1.235rem;font-weight:650;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.mgrid .v small{font-size:0.765rem;font-weight:550;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.mgrid .pc{font-size:var(--t-cap);font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.mgrid .s{font-size:var(--t-cap);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fib{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-2);font-size:0.765rem;font-variant-numeric:tabular-nums}
.fib .t-f{font-weight:650}
.fib b{font-weight:650;font-size:var(--t-body)}
.fib .s{margin-left:auto;color:var(--muted);font-size:var(--t-cap)}
.mwrap.sm{margin-top:0;padding-top:0;border-top:0}
.mwrap.sm .k{font-size:var(--t-cap)}
.mwrap.sm .v{font-size:1rem}
.mwrap.sm .v small{font-size:var(--t-cap)}
.mwrap.sm .pc{font-size:var(--t-cap)}
.mwrap.sm .s{font-size:var(--t-cap)}
.mwrap.sm .fib{margin-top:9px;padding-top:8px;border-top-color:var(--line)}
.mwrap.sm .mgrid > div{border-left-color:var(--line)}
@media (max-width:370px){.mgrid .v{font-size:1.059rem}.mwrap.sm .v{font-size:var(--t-body)}.mgrid .pc{margin-left:3px}}
/* macros: âmbar (carboidratos), terracota (proteínas), amarelo (gorduras), sálvia (fibras).
   Em texto, a proteína usa --prot-ink (contraste 5,5:1); a cor de referência fica para anéis e marcadores. */
.t-c{color:var(--carb)} .t-p{color:var(--prot-ink)} .t-g{color:var(--fat)} .t-f{color:var(--fib)}
.miss{margin-top:10px;font-size:var(--t-cap);color:var(--accent-2)}

/* Resumo fixo do plano, dentro do cabeçalho */
.sumbar{max-width:600px;margin:8px auto 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);width:100%;font-size:var(--t-cap);font-variant-numeric:tabular-nums}
.sumbar .k{display:flex;align-items:baseline;gap:4px;white-space:nowrap;color:var(--muted)}
.sumbar .k b{font-size:var(--t-body);color:var(--ink);font-weight:650;letter-spacing:-.02em}
.sumbar .pc{font-size:var(--t-cap);font-weight:650;color:var(--accent-2);padding:2px 7px;border-radius:999px;background:var(--accent-soft);margin-left:4px}
.sumbar .m{display:flex;gap:10px;margin-left:auto;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.sumbar .m b{font-weight:700;margin-right:2px}
.sumbar svg{width:14px;height:14px;color:var(--muted);flex:none}
@media (max-width:370px){.sumbar .m{gap:7px}.sumbar .k span.u{display:none}}

/* Início */
.hello{margin:18px 0 18px}
.hello h1{margin:0 0 4px}
.cta{display:flex;align-items:center;gap:14px}
.cta .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.cta .ic svg{width:20px;height:20px}
.cta div{flex:1;min-width:0;font-size:var(--t-sm);color:var(--muted)}
.cta b{display:block;color:var(--ink);font-size:var(--t-body);font-weight:600;margin-bottom:1px}
.link{font-size:var(--t-sm);font-weight:600;color:var(--accent-2);padding:6px 2px}

/* Painel circular: anel externo = planejado ÷ meta; anel interno = divisão da energia entre os macronutrientes */
.dial{position:relative;padding:14px 14px 12px;border-radius:24px;border:1px solid var(--line);background:var(--surface)}
.dial-wrap{position:relative;width:min(100%,292px);aspect-ratio:1;margin:0 auto}
.dial-svg{display:block;width:100%;height:100%;overflow:visible}
.dial-svg circle{fill:none}
.ticks line{stroke:#4A423A;stroke-width:2;stroke-linecap:round}
.ticks line.lit{stroke:var(--ring)}
.trk{stroke:#231F1C;stroke-width:9}
.trk.in{stroke:#1E1B18;stroke-width:15}
.prog{stroke:var(--ring);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.prog.over{stroke:var(--accent-2)}
.arc{stroke-width:15;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1) .15s,opacity .2s,stroke-width .2s}
.arc.t-c{stroke:var(--carb)} .arc.t-p{stroke:var(--prot)} .arc.t-g{stroke:var(--fat)}
.arc.dim{opacity:.22}
.arc.sel{stroke-width:19}
.dial-c{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dial-k{font-size:clamp(36px,11vw,46px);font-weight:640;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.dial-m{font-size:0.765rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p{margin-top:9px;font-size:var(--t-cap);font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.dial-p.over{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dial-p.dim{background:transparent;color:var(--muted);border-color:var(--line-2)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.key{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;text-align:center;min-width:0;transition:opacity .2s,border-color .2s}
.key .k{font-size:var(--t-cap);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.key .v{font-size:1.118rem;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.key .v small{font-size:var(--t-cap);font-weight:550;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.key .s{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
.key.on{border-color:var(--accent-line);background:var(--accent-soft)}
.key.dim{opacity:.5}
.dial-d{min-height:20px;margin-top:10px;text-align:center;font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.5}
.dial-d b{font-weight:650}
.dial-d .nw{white-space:nowrap}
.dial .miss{text-align:center}
.dial.compact .dial-wrap{width:min(100%,236px)}
.dial.compact .dial-k{font-size:2.353rem}
.dial.compact .dial-c{inset:20%}
.dial.compact .keys{margin-top:8px}
.dial.compact .key{padding:7px 4px 6px}
.dial.compact .key .v{font-size:1rem}
.sheet .dial{margin-top:4px}
@media (max-width:370px){.key .v{font-size:0.971rem}.key .k{font-size:var(--t-cap);letter-spacing:-.02em}.dial{padding:12px 10px 10px}}
@media (prefers-reduced-motion:reduce){.prog,.arc{transition:none}}

/* Plano */
.plan-head{display:grid;grid-template-columns:1fr 112px;gap:10px;margin-top:14px}
.meals{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:visible}
.meal.open{border-color:var(--line-2)}
.mh{display:flex;align-items:center;gap:10px;padding:13px 10px 13px 16px;min-height:64px;border-radius:var(--r);cursor:pointer}
.meal.open .mh{border-radius:var(--r) var(--r) 0 0;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:default}
.mh-m{flex:1;min-width:0}
.mh-n{font-size:1rem;font-weight:650;letter-spacing:-.015em;color:var(--accent-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-n.unnamed{color:var(--muted);font-weight:500}
.mh-s{font-size:0.765rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-k{font-size:var(--t-body);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.mh-k small{font-size:var(--t-cap);color:var(--muted);font-weight:500;margin-left:3px}
.chev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.chev svg{width:18px;height:18px}
.meal.open .chev{transform:rotate(180deg)}
.meal-name{width:100%;border:0;background:transparent;font-size:1rem;font-weight:650;letter-spacing:-.015em;outline:none;padding:4px 0;color:var(--accent-2);text-overflow:ellipsis}
.meal-name::placeholder{color:var(--muted);font-weight:500}
.mtools{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 16px}
.tw{position:relative;flex:none;width:96px;height:34px}
.tw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;border:1px dashed var(--line-2);border-radius:10px;font-size:0.765rem;color:var(--muted);pointer-events:none}
.tw span svg{width:14px;height:14px}
.tw.has span{display:none}
.meal-time{position:absolute;inset:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);text-align:center;font-size:var(--t-body);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0 6px;margin:0;min-width:0}
.meal-time::-webkit-date-and-time-value{text-align:center}
.meal-time::-webkit-calendar-picker-indicator{display:none}
.tw:not(.has) .meal-time{opacity:0}
.mtools .btn.sm{height:34px}
.meal-ask{padding:0 12px}
.meal-ask:empty{display:none}

/* Alimento dentro da refeição */
.it{border-top:1px solid var(--line)}
.mbody .it:first-child{border-top:0}
.it-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;width:100%;padding:12px 16px;text-align:left}
.it-name{font-size:var(--t-body);font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-name.gone{color:var(--muted);font-style:italic}
.it-k{font-size:var(--t-body);font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.it-k small{font-size:var(--t-cap);color:var(--muted);font-weight:500;margin-left:2px}
.it-sub{font-size:0.765rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-sub b{color:var(--ink-2);font-weight:600}
.it.edit{background:var(--bg)}
.it.edit .it-main{padding-bottom:6px}
.it-ed{padding:0 16px 14px}
.ed-l{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center}
.cell{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;font-size:var(--t-body);outline:none;width:100%;min-width:0;text-overflow:ellipsis}
.cell:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.qty{text-align:center;font-weight:650;font-variant-numeric:tabular-nums;padding:0 4px;font-size:1rem}
.grams{text-align:right;font-weight:620;font-variant-numeric:tabular-nums;font-size:var(--t-body);white-space:nowrap;min-width:44px}
.ed-m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px;font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ed-m span{white-space:nowrap}
.ed-m b{font-weight:700;margin-right:3px}
.quick{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;height:36px;min-width:44px;padding:0 10px;border-radius:10px;background:var(--surface-3);font-weight:620;font-variant-numeric:tabular-nums;text-align:center}
.quick button.next{background:var(--accent);color:var(--accent-ink);margin-left:auto;padding:0 14px}
.ed-a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ed-a .btn{flex:1 1 auto}
.add{padding:8px 12px 10px 16px;border-top:1px solid var(--line)}
.add-in{width:100%;height:44px;border:0;background:transparent;font-size:var(--t-body);outline:none;padding:0}
.add-in::placeholder{color:var(--muted)}
.add-l{display:flex;align-items:center;gap:8px;color:var(--muted)}
.add-l svg{width:18px;height:18px;flex:none;color:var(--accent-2)}
.mfoot{padding:11px 12px 12px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.mfoot .eyebrow{margin:0 0 8px 4px}
.add-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.add-meal{width:100%;height:54px;border-radius:var(--r);border:1.5px dashed var(--line-2);color:var(--ink-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.add-meal svg{width:18px;height:18px;flex:none}
.clipbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 6px 9px 14px;border-radius:var(--r);border:1px solid var(--accent-line);background:var(--accent-soft)}
.cb-i svg{width:18px;height:18px;color:var(--accent-2);display:block}
.cb-t{flex:1;min-width:0;font-size:var(--t-cap);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-t b{display:block;font-size:var(--t-sm);color:var(--ink);font-weight:600}
.clipbar .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.clipbar .x svg{width:16px;height:16px}

/* Alimentos */
.search{position:relative;margin:14px 0 12px}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:var(--t-body);outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.star{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:none}
.star svg{width:19px;height:19px}
.star.on{color:var(--accent-2)}
.nut{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center;margin-top:12px}
.nut div{background:var(--surface-2);border-radius:12px;padding:9px 2px}
.nut .k{font-size:var(--t-cap);font-weight:650}
.nut .v{font-size:var(--t-body);font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nut .v small{font-size:var(--t-cap);color:var(--muted);font-weight:500;margin-left:1px}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mchips button{height:34px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-size:var(--t-sm);color:var(--ink-2)}
.food-li{padding-right:6px;cursor:pointer}
.food-li .li-t{display:flex;align-items:center;gap:6px;font-size:var(--t-body)}
.food-li .li-t > span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.f-brand{font-size:var(--t-cap);color:var(--ink-2);font-weight:500;white-space:nowrap;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.food-li .star{width:34px}
.food-li .li-s .src-b{margin-right:6px;vertical-align:1px}
.mini-n{display:flex;gap:9px}
.src-b{flex:none;font-size:var(--t-cap);font-weight:650;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;border-radius:5px;color:var(--muted);border:1px solid var(--line-2)}
.src-b.own{color:var(--accent-2);border-color:var(--accent-line)}
.mini-n b{color:var(--ink-2);font-weight:600}
.mini-n i{font-style:normal;font-weight:700;margin-right:1px}
.xtra{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:var(--t-cap);color:var(--muted)}
.xtra b{color:var(--ink-2);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left;font-size:0.765rem;color:var(--muted)}
.choice b{display:block;color:var(--ink);font-size:var(--t-body);font-weight:600;margin-bottom:2px}
.choice .ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.choice .ic svg{width:22px;height:22px}
.choice[disabled]{opacity:.5}
.scan-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.scan-bar i{display:block;height:100%;width:4%;background:var(--accent);border-radius:3px;transition:width .3s}
.scan-s{font-size:var(--t-sm);color:var(--ink-2);margin:12px 0 0;line-height:1.5}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opt{color:var(--muted);font-weight:400;opacity:.8}
.input.flag{border-color:var(--accent);background:var(--accent-soft)}
.fl-n{font-size:var(--t-cap);color:var(--accent-2);line-height:1.35;margin-top:-2px}
details.adv{margin:4px 0 12px}
details.adv summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);padding:10px 0}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin:-3px 0 0 auto;transition:transform .2s}
details.adv[open] summary::after{transform:rotate(225deg);margin-top:3px}
details.formulas{padding:4px 16px 14px;margin:0}
details.formulas summary{font-size:var(--t-body)}
.eq-n{font-size:var(--t-cap);color:var(--ink-2);margin:12px 0 0;font-variant-numeric:tabular-nums;line-height:1.5}
.act{margin-top:16px}
.act-t{font-size:var(--t-cap);color:var(--muted);font-weight:500;margin-bottom:7px}
.act-t span{color:var(--ink-2);font-weight:600}
.btn.set[disabled]{opacity:1;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line)}
.meta-n{margin:0;text-align:center;font-size:var(--t-cap);color:var(--muted)}
.meta-n:empty{display:none}
.li.fam{padding:0 8px 0 0;gap:4px}
.fam-b{display:flex;align-items:center;gap:13px;flex:1;min-width:0;padding:12px 8px 12px 16px;text-align:left}
.li.fam .icon-btn{background:transparent;border-color:transparent;color:var(--muted)}
.li.fam.cur .av{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2.sec .sec-n{float:right;letter-spacing:.02em;text-transform:none;font-weight:500}
.mchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}

/* Substituição */
.crit{margin:4px 0 12px}
.subs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.so{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 12px;border-radius:13px;background:var(--surface-2);border:1px solid transparent;text-align:left;width:100%}
.so.on{border-color:var(--accent);background:var(--accent-soft)}
.so-n{font-weight:600;font-size:var(--t-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-k{font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.so-q{font-size:0.765rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-d{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.confirmbar{position:sticky;bottom:calc(-18px - var(--sab));margin:12px -18px calc(-18px - var(--sab));padding:12px 18px calc(14px + var(--sab));background:var(--surface);border-top:1px solid var(--line-2)}
.confirmbar p{margin:0 0 10px;font-size:var(--t-sm);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Perfil e energia */
.measures{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{position:relative}
.mfield input{height:58px;font-size:1.412rem;font-weight:600;letter-spacing:-.02em;padding-right:44px}
.mfield span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:var(--t-sm);pointer-events:none}
.big{font-size:2.235rem;font-weight:620;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:var(--t-sm);font-weight:500;letter-spacing:0;margin-left:4px;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.res > div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.res .k{font-size:var(--t-cap);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:650}
.res .v{font-size:1.176rem;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.res .v.acc{color:var(--accent-2)}
.eq{margin-top:12px;font-size:var(--t-cap);color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums}
.datacard{display:flex;align-items:center;gap:12px}
.datacard.due{border-color:var(--accent-line)}
.dc-ic svg{width:18px;height:18px;color:var(--muted);display:block}
.dc-t{flex:1;min-width:0;font-size:var(--t-cap);color:var(--muted)}
.dc-t b{display:block;color:var(--ink);font-size:var(--t-sm);font-weight:600}
@media (max-width:370px){.big{font-size:1.824rem}.big small{font-size:var(--t-cap);margin-left:2px}.datacard{flex-wrap:wrap}.datacard .dc-t{flex:1 1 0}.datacard .btn{width:100%}}
.prose{font-size:var(--t-sm);color:var(--ink-2);line-height:1.6}
.prose h3{font-size:var(--t-body);color:var(--ink);margin:18px 0 4px}
.prose p{margin:0 0 8px}

/* Refeição feita e favoritas */
.done-w{display:contents}
.done{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.done svg{width:16px;height:16px}
.done.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done[disabled]{opacity:.3}
.mh .done{margin-right:-2px}
.favs{margin-top:16px}
.favs-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.favs-l{display:flex;flex-direction:column;gap:6px}
.fav{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--accent-line);text-align:left;font-size:var(--t-body)}
.fav svg{width:16px;height:16px;color:var(--accent-2);flex:none}
.fav .nm{flex:1;min-width:0;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav .kc{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
/* ===== Design system v5 =====
   Pilares: alimentação (cobre), movimento (turquesa), sono (violeta), bem-estar (rosa). Cada um tinge só o próprio módulo.
   Superfície padrão .panel: grafite, raio 20, sem contorno; título .panel-h. */







  
 






.na{flex-direction:row;align-items:center;gap:12px;padding:14px 40px 14px 14px;margin-top:12px;border-radius:18px}
.na > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.na-ic{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-2);display:grid;place-items:center;flex:none}
.na-ic svg{width:20px;height:20px}
.panel{display:block;width:100%;margin-top:12px;padding:14px 16px 14px;border-radius:20px;background:var(--surface);text-align:left}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:0 0 10px;font-size:var(--t-body);font-weight:620;letter-spacing:-.01em;text-align:left}
.panel-h .li-go svg{width:16px;height:16px;color:var(--muted);display:block}






.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0;padding-top:0}
.mrow-b{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.mrow .tm{width:42px;flex:none;font-size:0.765rem;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-size:var(--t-body);font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{display:block;font-size:var(--t-cap);color:var(--muted)}

/* ===== Home v21 — Beyond Luxury: Digital Jewelry sobre fundo preto, em três grupos =====
   Grade de 4: margem 16 · entre cartões 12 (8 em telas estreitas) · padding 12 vertical / 14 horizontal · raio 18 · pastilha 28.
   Cabeçalho: seletor + "+" (barra fixa) · saudação e data, sem marca nem ornamento — os cartões são as joias, o fundo é a vitrine.
   A · pilares 2 × 2 (linhas iguais) · Signature divider · B · Gasto diário + Hidratação · Signature divider · C · Suplementos + Medicamentos (altura de B).
   Alturas naturais pelo conteúdo, sem mínimos fixos; a sobra de tela vai sobretudo para o respiro das divisórias (ver spread no código).
   Camadas de cada cartão (.hc): 1 base cromática profunda · 2 luz ambiente · 3 reflexo curvo vetorial (.hc-fx, SVG de JEWEL)
   · 4 microtextura (estrias finas da lâmina) · 5 aro de 1 px que acende onde a luz incide · 6 conteúdo sobre a zona escura. */
/* tokens de espaço da Home (grade de 4): todos os intervalos vêm daqui; o código (spread) lê --air e --air-min */
.home{--hc-gap:12px;--hc-pad:14px;--hc-pv:12px;--hc-r:var(--dj-r-card);--sp-head:16px;--sp-div:20px;--air:24px;--air-min:16px}
.hi-h{margin:2px 0 calc(var(--sp-head) + var(--xh,0px))}

.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:var(--hc-gap)}
/* Signature divider (duas, idênticas): fio grafite quente que esmaece em transição longa (22%) e ganha calor e presença ao centro + segmento cobre acetinado de 32 (ecoa o filete da aba ativa), em 1 px físico */
.hdiv,.dj-divider{position:relative;height:1px;background:linear-gradient(90deg,rgba(150,136,124,0),var(--dj-hairline) 22%,var(--dj-hairline-core) 50%,var(--dj-hairline) 78%,rgba(150,136,124,0))}
.hdiv{margin:calc(var(--sp-div) + var(--xd,0px)) 0}
.hdiv::after,.dj-divider::after{content:"";position:absolute;left:50%;top:0;width:32px;height:100%;margin-left:-16px;background:linear-gradient(90deg,rgba(214,150,104,0),var(--dj-hairline-seg) 50%,rgba(214,150,104,0))}
@media (min-resolution:2dppx){.hdiv,.dj-divider{transform:scaleY(.5)}}
@media (min-resolution:3dppx){.hdiv,.dj-divider{transform:scaleY(.3334)}}
.hgrid.odd .hc:last-child{grid-column:1 / -1}
.hc{--g:#D98A4E;--gd:#20130A;--ra:140deg;--rt:34%;--rb:80%;--lb:30%;--lt:16%;
  position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;min-width:0;padding:var(--hc-pv,12px) var(--hc-pad,14px);border-radius:var(--hc-r,var(--dj-r-card));text-align:left;
  border:1px solid transparent;
  background:
    radial-gradient(75% 85% at 100% 100%,color-mix(in srgb,var(--g) var(--lb),transparent),transparent 72%) padding-box,
    radial-gradient(90% 80% at 0% 0%,color-mix(in srgb,var(--g) var(--lt),transparent),transparent 70%) padding-box,
    linear-gradient(165deg,color-mix(in srgb,var(--g) 22%,var(--gd)),color-mix(in srgb,var(--g) 5%,var(--gd)) 55%,color-mix(in srgb,var(--g) 12%,var(--gd))) padding-box,
    linear-gradient(var(--ra),color-mix(in srgb,color-mix(in srgb,var(--g) 85%,#fff) var(--rt),transparent),color-mix(in srgb,var(--g) 26%,transparent) 38%,color-mix(in srgb,var(--g) 28%,transparent) 58%,color-mix(in srgb,color-mix(in srgb,var(--g) 80%,#fff) var(--rb),transparent)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 30px -20px rgba(0,0,0,1);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),filter .16s ease}
.hc:active{transform:scale(.98);filter:brightness(1.12)}
.hc:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.hc-fx{position:absolute;inset:0;z-index:-1;pointer-events:none;
  /* o reflexo aparece inteiro no alto e na borda direita; na faixa do número e da legenda (metade inferior esquerda) fica atenuado */
  -webkit-mask-image:linear-gradient(to bottom,#000 38%,transparent 56%),linear-gradient(to right,rgba(0,0,0,.22) 52%,rgba(0,0,0,.5) 84%,#000 100%);
  mask-image:linear-gradient(to bottom,#000 38%,transparent 56%),linear-gradient(to right,rgba(0,0,0,.22) 52%,rgba(0,0,0,.5) 84%,#000 100%)}
.hc-fx svg{display:block;width:100%;height:100%}
/* compactos: legenda mais perto do reflexo; a faixa direita do texto fica um pouco mais atenuada (o reflexo segue inteiro no alto e na borda) */

/* oito materiais: cor (--g), base (--gd), luz de canto (--lb), luz do alto (--lt), direção e força do aro (--ra/--rt/--rb); o reflexo vem de JEWEL */
.hc.food  {--g:var(--dj-copper);--gd:var(--dj-copper-deep);--lb:34%;--lt:26%;--ra:150deg;--rt:56%;--rb:96%}  /* cobre acetinado */

.hc.supp  {--g:var(--dj-peridot);--gd:var(--dj-peridot-deep);--lb:25%;--lt:22%;--ra:150deg;--rt:56%;--rb:84%}  /* peridoto oliva */
.hc.meds  {--g:var(--dj-midnight);--gd:var(--dj-midnight-deep);--lb:36%;--lt:18%;--ra:135deg;--rt:42%;--rb:90%}  /* safira da meia-noite */
/* ícone: pequena peça — pastilha tonal elevada, aro fino aceso no alto, sombra de contato mínima, símbolo nítido */
.hc-h{display:flex;align-items:center;gap:10px;min-width:0}
.hc-i{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:var(--dj-r-tile);color:color-mix(in srgb,var(--g) 78%,#fff);
  border:1px solid transparent;
  background:linear-gradient(155deg,color-mix(in srgb,var(--g) 30%,var(--gd)),color-mix(in srgb,var(--g) 10%,var(--gd))) padding-box,
    linear-gradient(160deg,color-mix(in srgb,var(--g) 72%,#fff),color-mix(in srgb,var(--g) 22%,transparent) 55%,color-mix(in srgb,var(--g) 40%,transparent)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.55)}
.hc-i svg{width:17px;height:17px;display:block}
.hc-t{flex:1;font-size:var(--t-sm);font-weight:580;letter-spacing:-.012em;color:rgba(247,242,236,.94);line-height:1.25;min-width:0}
/* sem espaço para título ao lado da pastilha (texto ampliado, telas estreitas): ícone sobre o título, em todos os cartões */
.home.stack .hc-h{flex-direction:column;align-items:flex-start;gap:8px}
.hc-t{white-space:nowrap}
.home.stack .hc-t{flex:none;width:100%;white-space:normal}
/* palavras nunca são partidas: se uma palavra (título, valor, unidade ou legenda) não cabe inteira em meia largura — tela estreita com texto
   muito ampliado —, a grade passa a uma coluna (.one); a quebra dentro da palavra fica só como última defesa nesse arranjo */
.hc-s,.hc-v,.hc-t{-webkit-hyphens:manual;hyphens:manual}
.home.one .hgrid{grid-template-columns:minmax(0,1fr)}
.home.one .hc-s,.home.one .hc-v b.txt,.home.one .hc-t{overflow-wrap:anywhere}
/* valor e unidade em texto corrido, na mesma linha de base, com o mesmo espaço (~4) antes de toda unidade ("875 kcal", "3 h /semana", "2.730 kcal/dia");
   se a unidade descer de linha, o espaço some e ela começa exatamente na coluna do número */
.hc-v{display:block;font-size:var(--t-sm);line-height:1.08;padding-top:12px;min-width:0;max-width:100%}
.hc-v b{display:inline-block;max-width:100%;vertical-align:baseline}
.hc-v b{font-weight:580;letter-spacing:-.025em;line-height:1.08;color:#F8F3ED;font-variant-numeric:tabular-nums;white-space:nowrap}
.hc-v small{font-size:var(--t-sm);font-weight:500;letter-spacing:-.005em;color:rgba(244,238,232,.7);white-space:nowrap}
.hc-s{margin-top:3px;font-size:var(--t-cap);color:rgba(244,238,232,.86);line-height:1.25;min-height:1.25em}
.hc-v b.nr{font-size:var(--t-body);font-weight:560;letter-spacing:-.01em;line-height:1.25;white-space:normal;color:rgba(244,238,232,.92)}
/* nível 1 · pilares: número 28, valor e legenda ancorados na base (se um valor em texto quebrar, a última linha segue alinhada com o vizinho)
   nível 2 · indicadores: padding vertical 12, número 22 logo abaixo do título (alinhado no par mesmo se uma legenda quebrar em duas linhas);
   na linha de Suplementos e Medicamentos, sem legenda nos dois, o número fica centrado no espaço abaixo do título (nem colado ao topo, nem isolado no rodapé) */
.hc.l1{min-height:max(var(--l1-min,0px),var(--ha,0px))}
.hc.l1 .hc-v{padding-top:6px}
.hc .hc-v{margin-top:auto}
.hc.l1 .hc-v b{font-size:var(--t-num)}
/* valores (números e estados como "Bem"): entrelinha 1 em todos, para que as linhas de base coincidam nos pares; mensagens de estado vazio (.nr) mantêm 1,25 */
.hc-v b:not(.nr){line-height:1}
.hc.l1 .hc-v b.long{font-size:1.294rem;white-space:normal}
.hc.l2 .hc-v{padding-top:calc(6px + var(--xb,0px));margin-top:0}
/* grupo C: altura do grupo B; sem legenda nos dois, o número fica centrado no espaço abaixo do título */
.hg-c .hc{min-height:calc(var(--hbc,0px) + var(--xb,0px))}
.hg-c:not(:has(.hc-s:not(:empty))) .hc-v{margin-block:auto}
.hc.l2 .hc-v b{font-size:1.294rem}
.hc.l2 .hc-s{margin-top:2px}
.hc.l2 .hc-s:empty{display:none}
.hc.empty .hc-s{color:rgba(244,238,232,.92)}
/* proteção de leitura: quando um texto longo alcança o reflexo, um halo na cor-base do cartão escurece só o entorno das letras */
.hc-v,.hc-s{text-shadow:0 0 2px var(--gd),0 0 6px var(--gd),0 0 12px var(--gd),0 0 18px color-mix(in srgb,var(--gd) 80%,transparent)}
.hc.l1 .hc-v b.nr,.hc.l2 .hc-v b.nr{font-size:var(--t-body)}
.hc-v b.txt{white-space:normal}
html.big-text .hc.l1 .hc-v b.txt{font-size:1.294rem}
/* topo: "+" em cobre acetinado — ferramenta, não protagonista: brilho contido, aro discreto, sombra curta */
.icon-btn.accent{border-radius:var(--dj-r-tool);color:#22120A;border:1px solid transparent;
  background:linear-gradient(170deg,#C3804E,#A9663A 55%,#94562A) padding-box,linear-gradient(170deg,rgba(236,188,148,.6),rgba(169,102,58,.35) 50%,rgba(96,52,22,.8)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,228,202,.16),0 2px 6px -3px rgba(0,0,0,.8)}
/* barra superior: seletor e "+" com 44 de altura, centrados na mesma linha */
.top{padding-top:8px;padding-bottom:8px}
.top-row{min-height:44px}
.top .who{min-height:44px;padding:6px 12px 6px 6px}
.top .icon-btn{width:44px;height:44px}
.icon-btn.accent:active{filter:brightness(.92)}
.who{background:linear-gradient(160deg,#1C1815,#141210);border-color:rgba(224,140,78,.22)}
/* barra inferior: divisória fina; aba ativa em cobre com filete que esmaece nas pontas, sob o rótulo */
/* barra inferior: 58 de conteúdo (como a barra nativa, com rótulo de 13 legível) + a área do indicador de início do iOS (env), que fica livre;
   o filete da aba ativa fica dentro da aba, 4 abaixo do rótulo — nenhum espaço do app abaixo dele além da área segura do sistema */
.tabbar{border-top-color:rgba(255,255,255,.07);padding-top:4px;padding-bottom:var(--sab)}
.tab{position:relative;gap:4px;padding:4px 0 6px;line-height:1.2;transition:transform .12s ease}
.tab:active{transform:scale(.94)}
.tab.on{color:var(--dj-signal)}
.tab.on::after{content:"";position:absolute;bottom:0;left:50%;width:34px;height:2px;margin-left:-17px;border-radius:2px;background:linear-gradient(90deg,rgba(222,140,80,0),var(--dj-signal-line),rgba(222,140,80,0))}
@media (max-width:380px){.home{--hc-gap:8px;--hc-pad:12px}.hc-h{gap:8px}.hc.l1 .hc-v b{font-size:1.412rem}.hc.l1 .hc-v b.long{font-size:1.118rem}.hc.l1 .hc-v b.txt:not(.long){font-size:1.294rem}}
@media (prefers-reduced-motion:reduce){.hc,.tab{transition:none}.hc:active,.tab:active{transform:none}}
/* ===== BRICEÑO Design System v29 — três materiais, uma linguagem (ver DESIGN-SYSTEM.md) =====
   A · Signature Jewelry (.hc, jewelCard): só os oito cartões da Home. Cor profunda, reflexo vetorial, aro aceso.
   B · Precision Glass (.dj-glass): painéis protagonistas fora da Home — resumo nutricional, indicadores de Saúde, identificação no Perfil.
       Grafite profundo com leve tom do tema (--tint), aro fino que acende no alto, profundidade discreta. Sem reflexo.
   C · Quiet Luxury (.dj-quiet): listas, grupos, formulários e informação secundária. Grafite, borda sutil, nenhum ornamento.
   A sofisticação cresce com a importância da informação, não com a quantidade de efeitos. */
:root{
  --dj-glass-base:linear-gradient(168deg,#1C1916 0%,#151311 60%,#131110 100%);
  --dj-quiet:#171513; --dj-quiet-line:rgba(255,255,255,.06); --dj-quiet-rule:rgba(255,255,255,.065);
  --dj-tile:linear-gradient(155deg,#221E1B,#191614); --dj-tile-line:rgba(255,255,255,.07);
  --dj-r-panel:20px;
  /* tipografia por papel (rem: acompanha o tamanho de texto do iPhone) */
  --dj-type-page:1.765rem; --dj-type-section:var(--t-sec); --dj-type-title:var(--t-body); --dj-type-num:var(--t-num); --dj-type-unit:var(--t-sm); --dj-type-meta:var(--t-sm); --dj-type-label:var(--t-cap);
}
/* B · Precision Glass */
.dj-glass,.sumcard,.hstack .hrow,.idc{--tint:var(--dj-copper);border:1px solid transparent;border-radius:var(--dj-r-panel);
  background:radial-gradient(130% 110% at 0% 0%,color-mix(in srgb,var(--tint) 10%,transparent),transparent 58%) padding-box,var(--dj-glass-base) padding-box,
    linear-gradient(165deg,color-mix(in srgb,var(--tint) 36%,rgba(255,255,255,.08)),rgba(255,255,255,.055) 32%,rgba(255,255,255,.035) 72%,color-mix(in srgb,var(--tint) 14%,rgba(255,255,255,.03))) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 32px -26px rgba(0,0,0,.9)}
/* C · Quiet Luxury */
.dj-quiet,.goalcard,.prows,.glist,.gempty,.view > details.src.more,.hstack .na,.hstack .na.good{background:var(--dj-quiet);border:1px solid var(--dj-quiet-line);border-radius:var(--dj-r-panel)}
.panel:not(.sumcard):not(.idc):not(.goalcard){background:var(--dj-quiet);border:1px solid var(--dj-quiet-line)}
/* pastilha de ícone fora da Home: grafite com aro fino (cor do símbolo = significado, quando houver) */
.pr-i,.gl-i,.gr-i{background:var(--dj-tile);border:1px solid var(--dj-tile-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
/* segmented control premium (Plano do dia / Alimentos; abas de Saúde; protocolos): trilho grafite, seleção em cobre acetinado */
.seg{background:#110F0E;border:1px solid var(--dj-quiet-line);border-radius:14px;padding:3px;gap:3px}
.seg button{border-radius:11px;color:var(--ink-2);transition:background-color .18s ease,color .18s ease,transform .12s ease}
.seg button:active{transform:scale(.97)}
.seg button.on{background:linear-gradient(170deg,#E39A60,#D0844C 55%,#BF7442);color:#1C0E05;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,236,214,.28),0 1px 3px rgba(0,0,0,.55)}
/* NUTRIÇÃO — resumo (Precision Glass cobre): divisórias finas, números tabulares, fibras integradas ao resumo */
.sumcard .sc-m{border-top-color:var(--dj-quiet-rule)}
.sumcard .sc-m > span + span{border-left-color:var(--dj-quiet-rule)}
.sumcard .sc-f{border-top-color:var(--dj-quiet-rule);align-items:baseline}
.sumcard .sc-f span{font-size:var(--t-cap);font-weight:600;color:var(--fib)}
.sumcard .sc-btn:active{background:rgba(255,255,255,.02)}
/* objetivo: pastilha com o alvo em cobre, edição sempre visível */
.goalcard .gl-i{color:var(--dj-copper)}
.goalcard .gl-e{border-color:var(--dj-tile-line);background:var(--dj-tile)}
/* refeições: lista Quiet Luxury contínua, horários em cobre, calorias alinhadas, separadores finos */
.meals > .meal{background:var(--dj-quiet);border-left:1px solid var(--dj-quiet-line);border-right:1px solid var(--dj-quiet-line)}
.meals > .meal:first-child{border-top:1px solid var(--dj-quiet-line)}
.meals > .meal:last-child{border-bottom:1px solid var(--dj-quiet-line)}
.meals > .meal + .meal{border-top:1px solid var(--dj-quiet-rule)}
.meals > .meal:not(.open) .mh:active{background:rgba(255,255,255,.03)}
.meals > .meal.open .mh{background:#1D1A17}
.add-row .add-meal:not(.fav-b){border:1px solid color-mix(in srgb,var(--dj-copper) 70%,transparent);background:color-mix(in srgb,var(--dj-copper) 6%,transparent)}
.add-row .add-meal:not(.fav-b):active{background:color-mix(in srgb,var(--dj-copper) 14%,transparent)}
/* SAÚDE — indicadores (Precision Glass com o material da Home de cada módulo) */
.hstack .hrow.move{--tint:var(--dj-emerald);--c:var(--dj-emerald)}
.hstack .hrow.sleep{--tint:var(--dj-amethyst);--c:var(--dj-amethyst)}
.hstack .hrow.wb{--tint:var(--dj-ruby);--c:var(--dj-ruby)}
.hstack .hrow.water{--tint:var(--dj-sapphire);--c:var(--dj-sapphire)}
.hstack .hrow .hp-i{width:40px;height:40px;border-radius:12px;color:color-mix(in srgb,var(--c) 82%,#fff);border:1px solid transparent;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 30%,#14110F),color-mix(in srgb,var(--c) 10%,#14110F)) padding-box,
    linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 22%,transparent) 55%,color-mix(in srgb,var(--c) 36%,transparent)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.55)}
.hstack .hrow:active{transform:scale(.985)}
/* suplementos e medicamentos: mesmas cores da Home (peridoto · safira da meia-noite) */
.gr-i.c-suplemento,.gr-i.c-formula{color:var(--dj-peridot)} .gr-i.c-medicamento{color:var(--dj-midnight)}
.grow:active{background-color:rgba(255,255,255,.03)}
.sec-add{background:var(--dj-tile);border:1px solid color-mix(in srgb,var(--dj-copper) 40%,transparent);color:var(--dj-copper)}
/* PERFIL — identificação (Precision Glass cobre, monograma com aro fino) e grupos Quiet Luxury */
.idc .av{background:radial-gradient(circle at 30% 25%,#3A2617,#1F150D);border:1px solid color-mix(in srgb,var(--dj-copper) 55%,transparent);color:#F0B585;box-shadow:inset 0 1px 0 rgba(255,236,214,.12)}
.prows > *{background-image:linear-gradient(var(--dj-quiet-rule),var(--dj-quiet-rule))}
.prows > :first-child{background-image:none}
.prow:active,.ec-h:active{background-color:rgba(255,255,255,.03)}
.prow.due .pr-i{color:var(--dj-copper);border-color:color-mix(in srgb,var(--dj-copper) 35%,transparent)}
@media (prefers-reduced-motion:reduce){.seg button,.hstack .hrow{transition:none}.seg button:active,.hstack .hrow:active{transform:none}}
/* ===== v30 — composição: Nutrição como instrumento, Perfil como painel pessoal, seções com fio ===== */

.sec-t{display:flex;align-items:center;gap:12px;margin:var(--s6) 2px 10px;font-size:var(--t-cap);font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:#B9937A;line-height:1.3}
.sec-t::after{content:"";flex:1;min-width:24px;height:1px;background:linear-gradient(90deg,rgba(185,147,122,.4),rgba(185,147,122,0))}

@media (min-resolution:3dppx){.sec-t::after{transform:scaleY(.3334)}}

.sec-row .sec-t{flex:1;margin:0}
/* controle secundário do topo (compartilhar): mesma família do seletor de membro */
.top .icon-btn:not(.accent){border-radius:var(--dj-r-tool);background:linear-gradient(160deg,#1C1815,#141210);border:1px solid rgba(224,140,78,.22);color:var(--ink)}
.top .icon-btn:not(.accent):active{filter:brightness(1.15)}
/* NUTRIÇÃO · painel-instrumento: anel de energia com o total no centro + legenda 2 × 2 (gramas e % da energia), fibras como quarta medida */
.sumcard .sc-btn{padding:14px 16px 14px}
.sx-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

.sx-g small{margin-left:.2em;font-size:var(--t-sm);font-weight:500;color:var(--muted)}

@media (max-width:380px){.sx-ring{width:100px}.sx-core{gap:16px}.sx-c b{font-size:1.294rem}}
@media (max-width:340px){.sx-ring{width:92px}.sx-core{gap:12px}.sx-c b{font-size:1.176rem}}
@media (prefers-reduced-motion:reduce){.sx-ring.anim .sx-sweep,.sx-ring.anim .sx-c{animation:none}}
/* v47: planos alimentares (um toque troca o plano em uso) */
.pl-row{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pl-row::-webkit-scrollbar{display:none}
.pl-c{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;max-width:15rem;padding:0 15px;border-radius:22px;border:1px solid var(--dj-quiet-line);background:var(--dj-quiet);font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.pl-c .pl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-c.on{color:var(--ink);border-color:rgba(224,140,78,.5);background:rgba(224,140,78,.1)}
.pl-c .pl-x{display:flex;margin-right:-3px}
.pl-c .pl-x svg{width:15px;height:15px;color:var(--accent-2)}
.pl-dup{color:var(--ink-2);border-style:dashed;border-color:var(--line-2);background:transparent}
.pl-dup .pl-i{display:flex}
.pl-dup.ico{width:44px;padding:0;justify-content:center}
@media (max-width:360px){.pl-w{display:none}}
.pl-dup .pl-i svg{width:17px;height:17px;color:var(--accent-2)}
/* objetivo: três energias lado a lado e nunca confundidas — meta (cobre), plano, gasto estimado */
.goalcard .goalrow{flex-direction:column;align-items:stretch;gap:12px;padding:14px 16px}
.gl-top{display:flex;align-items:center;gap:14px;min-width:0}
.goalcard .gl-m{flex:1;min-width:0}
.goalcard .gl-t{font-size:var(--t-cap);font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:#B9937A;white-space:nowrap}
.goalcard .gl-o{font-size:var(--t-body);font-weight:620;color:var(--ink);white-space:normal;line-height:1.3}
.gl-led{display:flex;flex-direction:column;border-top:1px solid var(--dj-quiet-rule);margin:0 -16px;padding:4px 16px 0}
.gl-c{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;min-width:0;padding:8px 0}
.gl-c + .gl-c{border-top:1px solid var(--dj-quiet-rule)}
.gl-k{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-size:var(--t-sm);color:var(--ink-2);min-width:0}
.gl-n{font-size:var(--t-cap);color:var(--muted)}
.gl-n:empty{display:none}
.gl-c b{margin-left:auto;font-size:var(--t-body);font-weight:660;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.gl-c b small{font-size:var(--t-cap);font-weight:500;color:var(--muted)}
.gl-c.meta b{color:#F0B585}
/* refeições: coluna de horário com fio vertical, nome em destaque, quantidade secundária, calorias alinhadas */
.meals > .meal .mh-tm{width:auto;min-width:calc(3.05em + 12px);padding-right:12px;margin-right:2px;align-self:stretch;display:flex;align-items:center;border-right:1px solid var(--dj-quiet-rule);font-size:var(--t-body);letter-spacing:-.01em}
@media (max-width:380px){.meals > .meal .mh{gap:10px}.meals > .meal .mh-tm{min-width:calc(3.05em + 8px);padding-right:8px;font-size:var(--t-sm)}}
.meals > .meal .chev{color:var(--muted)}
/* v45 · refeição em duas colunas: nome e, abaixo, o horário em cobre · alimentos; calorias à direita */
.mh-st{color:var(--accent-2);font-weight:620}
/* v45 · objetivo numa linha; a seta abre meta, plano e GET */
.goalcard .goalrow{min-height:56px}
.gl-x{width:32px;height:32px;display:grid;place-items:center;flex:none;color:var(--muted);transition:transform .2s}
.gl-x svg{width:18px;height:18px}
.gl-x.on{transform:rotate(180deg)}
.goalcard .gl-m{flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap}
.gl-edit{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-top:6px;border-top:1px solid var(--dj-quiet-rule);font-size:var(--t-sm);font-weight:600;color:var(--accent-2)}
.gl-edit svg{width:15px;height:15px}
/* nome nunca espremido: abaixo de ~5,5 caracteres de largura (tela estreita com texto ampliado), calorias e seta descem para a linha de baixo, à direita */
.meals > .meal .mh{flex-wrap:wrap;row-gap:2px}
.meals > .meal .mh-m{flex:1 1 5.5em}
.meals > .meal .mh-k{margin-left:auto}
/* PERFIL · painel pessoal */
.idc{gap:16px;padding:16px}
.idc .av{width:58px;height:58px;font-size:1.118rem;letter-spacing:.02em}
.idc .pr-m b{font-size:1.235rem;font-weight:660;letter-spacing:-.02em}
.idc .pr-m span{font-size:var(--t-sm);color:var(--ink-2);white-space:normal;overflow:visible;text-overflow:clip}
.idc .pr-m span + span{color:var(--muted)}
/* linha de informação: título · resumo à esquerda, valor-chave à direita (tabular). Sem cortes: o valor desce inteiro quando não cabe */
.prows .pr-m{gap:2px}
.pr-l{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px;row-gap:1px;min-width:0}
.prows .pr-l > span:first-child{flex:1 1 auto;min-width:0}
.prows .pr-l .pr-v{flex:none;margin-left:auto;font-size:var(--t-sm);font-weight:640;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.prows .pr-l .pr-v.ec-v{color:#E9C89A}
.prows .prow.due .pr-l .pr-v{color:var(--accent-2)}
.prows .prow.due .pr-l > span:first-child{color:var(--muted)}
/* ===== v31 · Home com agenda (Consultas, Exames) e Suplementos e Medicamentos num só cartão; módulos da Saúde ===== */
.hc.appt{--g:var(--dj-amber);--gd:var(--dj-amber-deep);--lb:30%;--lt:22%;--ra:150deg;--rt:56%;--rb:90%}  /* âmbar mel */
.hc.exam{--g:var(--dj-midnight);--gd:var(--dj-midnight-deep);--lb:36%;--lt:18%;--ra:135deg;--rt:42%;--rb:90%}  /* safira da meia-noite */
/* agenda: linha 2 = data e horário (17 px, uma linha), linha 3 = identificação (uma linha, reticências); sem compromisso, mensagem em até duas linhas */
.hc.ev .hc-v b.dt{font-size:var(--t-h);font-weight:600;letter-spacing:-.012em;line-height:1.1}
/* o recorte das reticências não pode cortar o halo de leitura: a caixa avança sobre o respiro do cartão (o texto continua na mesma coluna) e o halo fica contido nela */
.hc.l2 .hc-s.clip,.hc-s.clip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;padding:6px var(--hc-pad,14px);margin:-4px calc(-1 * var(--hc-pad,14px)) -6px;
  text-shadow:0 0 2px var(--gd),0 0 5px var(--gd),0 0 9px color-mix(in srgb,var(--gd) 85%,transparent)}
.hc.ev .hc-v b.nr{font-size:var(--t-sm);font-weight:560;line-height:1.25}
.hc-add{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;color:color-mix(in srgb,var(--g) 80%,#fff);border:1px solid color-mix(in srgb,var(--g) 38%,transparent);background:color-mix(in srgb,var(--g) 10%,transparent)}
.hc-add svg{width:13px;height:13px;display:block}
/* Suplementos e Medicamentos: dois contadores, número antes do nome, alinhados na coluna do título */
/* altura natural igual à de Hidratação (não empurra os pilares nem a última linha) */
.hc.cnt .hc-v.hc-lg{display:flex;flex-direction:column;gap:2px;padding-top:calc(4px + var(--xb,0px))}
.hc-lr{display:flex;align-items:baseline;gap:6px;white-space:nowrap;min-width:0;line-height:1.05}
.hc.cnt .hc-lr b{font-size:var(--t-h);font-weight:620;letter-spacing:-.02em;line-height:1.05;min-width:.62em}
.hc-lr span{font-size:var(--t-sm);font-weight:520;line-height:1.05;color:rgba(244,238,232,.88)}
.home.stack .hc-lr{white-space:normal}

/* módulos da Saúde: voltar, título com "+", destaque do próximo compromisso */
.back{display:inline-flex;align-items:center;gap:2px;height:44px;margin:2px 0 -6px -8px;padding:0 10px 0 2px;font-size:var(--t-body);font-weight:550;color:var(--dj-signal)}
.back svg{width:20px;height:20px;display:block}
.pg-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pg-row h1.pg{margin:4px 2px;min-width:0}
.view.mod .pg-s{margin-top:0}
.nx{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;margin-top:14px;padding:16px;text-align:left}
.nx.appt{--tint:var(--dj-amber)} .nx.exam{--tint:var(--dj-midnight)}
.nx:not(.none):active{transform:scale(.99)}
.nx-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.nx-e{font-size:var(--t-cap);font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--tint) 78%,#fff)}
.nx-r{font-size:var(--t-cap);font-weight:600;color:var(--ink-2);white-space:nowrap}
.nx-d{font-size:var(--t-sec);font-weight:640;letter-spacing:-.015em;line-height:1.25}
.nx-t{margin-top:4px;font-size:var(--t-body);font-weight:580;color:var(--ink);overflow-wrap:break-word}
.nx-s{font-size:var(--t-sm);color:var(--ink-2);overflow-wrap:break-word}
.nx.none{gap:4px}
.nx.none b{font-size:var(--t-body);font-weight:620}
.nx.none span{font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.nx.none .btn{align-self:flex-start;margin-top:10px;height:44px}
.view.mod .seg.seg-2{margin-bottom:10px}
.view.mod .seg.seg-2 button{height:44px}
/* linhas de compromisso: data em pastilha (dia e mês), título, situação quando importa */
.dtile{width:42px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1;
  background:var(--dj-tile);border:1px solid var(--dj-tile-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.dtile b{font-size:var(--t-h);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dtile span{font-size:.706rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#B9937A;margin-top:4px}
.dtile.nd b{color:var(--muted)}
.gr-tt{min-width:0;overflow-wrap:break-word}
.chip.st{margin-left:0;vertical-align:0;letter-spacing:.06em}
.chip.st.due{color:var(--accent-2);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.st.fut{color:color-mix(in srgb,var(--dj-amber) 85%,#fff);border-color:color-mix(in srgb,var(--dj-amber) 35%,transparent);background:transparent}
.gr-x{font-size:var(--t-cap);color:var(--muted);line-height:1.35}
.gr-x .due{color:var(--accent-2)}
.gr-i.c-appt{color:var(--dj-amber)} .gr-i.c-exam{color:var(--dj-midnight)}
.gnone{margin:0;padding:14px 16px;font-size:var(--t-sm);color:var(--muted);line-height:1.45}
.gnone.solo{background:var(--dj-quiet);border:1px solid var(--dj-quiet-line);border-radius:var(--dj-r-panel)}
.srch{position:relative;margin:0 0 10px}
.srch .input{padding-left:42px;height:46px}
.srch-i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;pointer-events:none}
.srch-i svg{width:18px;height:18px}
.more-l{display:block;margin:6px auto 0;min-height:44px;padding:0 12px}
.chips.sugs button{height:36px}
.input.dt-in{-webkit-appearance:none;appearance:none;display:flex;align-items:center;text-align:left;min-width:0;line-height:50px}
.input.dt-in::-webkit-date-and-time-value{text-align:left}
/* compromissos que já passaram sem registro */
.panel.conf{margin-top:12px;border-color:color-mix(in srgb,var(--dj-copper) 32%,transparent)}
.cf-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--dj-quiet-rule)}
.panel-h + .cf-row{border-top:0;padding-top:2px}
.cf-m{flex:1 1 9rem;min-width:0;display:flex;flex-direction:column;gap:1px}
.cf-m b{font-weight:600;overflow-wrap:break-word}
.cf-m span{font-size:var(--t-sm);color:var(--ink-2)}
.cf-b{display:flex;gap:8px;margin-left:auto}
.cf-b .btn{height:44px}
/* histórico anual de consultas: 12 meses, barras empilhadas (realizadas · a confirmar · agendadas · canceladas) */
.mcp{padding:14px 14px 12px}
.chips.yrs{margin-bottom:12px}
.chips.yrs button{height:36px}
.mc-sum{margin:0 2px 12px;font-size:var(--t-sm);color:var(--ink-2)}
.mc-sum b{font-size:1.412rem;font-weight:650;color:var(--ink);letter-spacing:-.02em;margin-right:2px;font-variant-numeric:tabular-nums}
.mc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;height:156px}
.mc-c{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;border-radius:9px;padding:4px 0 6px}
.mc-c.on{background:rgba(255,255,255,.06)}
.mc-n{height:14px;font-size:var(--t-cap);font-weight:650;line-height:14px;color:color-mix(in srgb,var(--dj-amber) 85%,#fff);font-variant-numeric:tabular-nums}
.mc-b{flex:1;width:100%;max-width:16px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px;background:rgba(255,255,255,.035)}
.mc-b i{display:block;flex:none;border-radius:4px;min-height:4px}
.mcp i.d{background:linear-gradient(180deg,#F2C285,var(--dj-amber))}
.mcp i.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--dj-amber) 60%,transparent) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dj-amber) 60%,transparent)}
.mcp i.f{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--dj-amber) 85%,transparent)}
.mcp i.k{background:rgba(150,139,129,.5)}
.mc-l{font-size:var(--t-cap);font-weight:600;line-height:1;color:var(--muted)}
.mc-c.on .mc-l{color:var(--ink)}
.mc-k{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;font-size:var(--t-cap);color:var(--ink-2)}
.mc-k-i{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.mc-k-i i{display:block;width:10px;height:10px;border-radius:3px}
.mc-hint{margin:10px 2px 0;font-size:var(--t-cap);color:var(--muted)}
.mc-list{margin-top:8px}
.mc-list .glist{background:transparent;border-color:var(--dj-quiet-rule)}
/* evolução dos resultados: marcador, período, gráfico de linha com eixo de tempo real */
.lcp{padding:14px}
.chips.mk{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.mk::-webkit-scrollbar{display:none}
.chips.mk button{flex:none;height:38px}
.lc-h2{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin:14px 2px 10px}
.lc-h2 b{font-size:var(--t-body);font-weight:620}
.lc-h2 span{font-size:var(--t-cap);color:var(--muted)}
.seg.lr{margin-bottom:8px}
.lc-box{margin:2px -6px 0}
svg.lc{display:block;width:100%;height:auto;overflow:visible}
.lc-g{stroke:rgba(255,255,255,.07);stroke-width:1}
.lc-y{stroke:rgba(255,255,255,.14);stroke-width:1;stroke-dasharray:2 3}
.lc-t{fill:#9A8F85;font-size:12px;font-family:var(--font);font-variant-numeric:tabular-nums}
.lc-band{fill:rgba(111,152,230,.11)}
.lc-bt{fill:rgba(176,198,240,.8);font-size:11px;font-family:var(--font)}
.lc-l{fill:none;stroke:color-mix(in srgb,var(--dj-midnight) 55%,transparent);stroke-width:1.4;stroke-linejoin:round}
.lc-p{fill:#9DBBF2;stroke:#0D121C;stroke-width:1.5}
.lc-p.on{fill:#E8F0FF;stroke:var(--dj-midnight);stroke-width:2.5}
.lc-h{fill:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lc-d{margin-top:8px;padding:10px 2px 0;border-top:1px solid var(--dj-quiet-rule);min-height:4.5em}
.lc-dv{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 4px}
.lc-dv b{font-size:1.412rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lc-dv span{color:var(--ink-2);font-size:var(--t-sm)}
.lc-dv .lc-dd{margin-left:auto;padding-left:10px}
.lc-d p{margin:4px 0 0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.lc-one{margin:0 2px 6px;font-size:var(--t-sm);color:var(--ink-2)}
.grow.lr{min-height:56px}
.lr-v{flex:none;font-weight:620;font-variant-numeric:tabular-nums;font-size:var(--t-body);white-space:nowrap}
.lr-v small{color:var(--muted);font-weight:500;font-size:var(--t-cap)}
.lcp .glist{background:transparent;border-color:var(--dj-quiet-rule)}
/* exames realizados por ano: discreto */
.yrc{padding:8px 16px}
.yr-r{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2em;align-items:center;gap:12px;min-height:34px;font-size:var(--t-sm);color:var(--ink-2);font-variant-numeric:tabular-nums}
.yr-r b{text-align:right;color:var(--ink);font-weight:600}
.yr-b{height:6px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden}
.yr-b i{display:block;height:100%;border-radius:3px;background:color-mix(in srgb,var(--dj-midnight) 75%,transparent)}
/* ficha do exame */
.kvs{display:flex;flex-direction:column;margin:2px 0 4px}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:var(--t-sm)}
.kv:first-child{border-top:0}
.kv span{color:var(--muted);flex:none}
.kv b{flex:1 1 9em;font-weight:550;text-align:right;min-width:0;overflow-wrap:break-word}
.kvt{margin:8px 0;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.kvt span{font-size:var(--t-cap);color:var(--muted)}
.kvt p{margin:4px 0 0;white-space:pre-wrap;font-size:var(--t-sm);line-height:1.5}
.ask-n{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:var(--t-sm)}
.sheet .glist{border-color:var(--line)}
.grow.dr{padding:0 6px 0 0}
.dr-o{flex:1;display:flex;align-items:center;gap:14px;min-width:0;min-height:60px;padding:8px 0 8px 14px;text-align:left}
.doc-img{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:#000}
.doc-pdf{display:block;width:100%;height:60vh;border:0;border-radius:12px;background:#fff}
/* iPhone de 320 pt: data e contadores cabem na meia largura (sem passar a Home para uma coluna) */
@media (max-width:350px){.hc.ev .hc-v b.dt{font-size:.882rem;letter-spacing:-.02em}.hc-lr{gap:4px}.hc-lr span{letter-spacing:-.015em}.hc.cnt .hc-lr b{min-width:.55em}}
/* texto ampliado: segmentos com rótulos longos passam a duas colunas em vez de cortar a palavra */
html.big-text .seg.fit{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
html.big-text .seg.fit button{height:auto;min-height:40px;padding:6px 4px;white-space:normal}
/* v32: mensagens longas quebram em duas linhas em vez de sair da tela */
.toast{white-space:normal;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.35}
.toast.act{text-align:left}
/* ===== v32 · Home: Prioridades + Agenda de Saúde; títulos completos em até duas linhas; módulos novos da Saúde ===== */
.hc.prio{--g:var(--dj-champagne);--gd:var(--dj-champagne-deep);--lb:28%;--lt:22%;--ra:155deg;--rt:58%;--rb:88%}  /* bronze champanhe */
.hc.agenda{--g:var(--dj-midnight);--gd:var(--dj-midnight-deep);--lb:36%;--lt:18%;--ra:135deg;--rt:42%;--rb:90%}  /* safira da meia-noite */
/* títulos que não cabem numa linha ("Suplementos e Medicamentos", "Agenda de Saúde") quebram entre palavras, sem reduzir a letra; a pastilha fica no alto */
/* botões não se esticam sozinhos na grade quando o conteúdo é estreito (título que quebra): largura da coluna sempre */
.hgrid > .hc{justify-self:stretch;width:100%}

/* ===== v35 · Home Premium definitiva (quarta versão aprovada) — ver DESIGN-SYSTEM.md, "Home v35" =====
   Fundo preto · oito cartões em quatro linhas de altura igual (14 entre linhas, 12 entre colunas) · divisórias sutis entre os três grupos.
   Material de cada cartão (só CSS + o reflexo vetorial de JEWEL; nenhuma imagem):
     1 base escura da cor do módulo (--gd) · 2 luz de canto no alto à esquerda (--gt) · 3 brilho largo embaixo à direita (--gb)
     4 lâmina de luz curva que nasce na base e sobe até a borda direita (JEWEL) · 5 aro de 1 px aceso em toda a volta (--gr),
     mais claro nos dois cantos onde a luz incide (--gh) · 6 texto branco sobre a zona escura, com halo de leitura na cor da base. */

  --hm-r:20px; --hm-pad:14px; --hm-pt:12px; --hm-pb:10px; --hm-vt:5px; --hm-col:12px; --hm-row:14px; --hm-div:8px; --hm-tile:28px;

}

.home .hc.move{--g:#3FCDB8;--gd:#01120F;--gt:#165447;--gb:#175A4F;--gr:#3E9C90;--gh:#A6F4EC}
.home .hc.sleep{--g:#B784D6;--gd:#150A1B;--gt:#52305F;--gb:#7E4C87;--gr:#9A6CA8;--gh:#E6B9EE}
.home .hc.wb{--g:#EE7D84;--gd:#2E1015;--gt:#AA4950;--gb:#A6464F;--gr:#D56E74;--gh:#F6AEB0}
.home .hc.water{--g:#4EC3E2;--gd:#00111B;--gt:#16586F;--gb:#19637C;--gr:#3E9DBB;--gh:#A8F0F8}
.home .hc.supp{--g:#DDD068;--gd:#151505;--gt:#7A712B;--gb:#766F2B;--gr:#A99B4C;--gh:#F3EA92}
.home .hc.prio{--g:#E8A25B;--gd:#251608;--gt:#B87D42;--gb:#A86F3A;--gr:#C38A51;--gh:#FFE7B4}
.home .hc.agenda{--g:#7EA5E0;--gd:#060D1A;--gt:#46689D;--gb:#2E4570;--gr:#5677A8;--gh:#BFE2FF}
/* v35.1: espaço negativo acima da barra inferior — no fim da rolagem, o último cartão fica a 24 dela (antes 16); a sobra de tela também fica ali */

.home .hgrid{gap:var(--hm-row) var(--hm-col)}
.home .hc,.home .hc.l1,.home .hg-c .hc{min-height:var(--hm-h,0px);padding:var(--hm-pt) var(--hm-pad) var(--hm-pb);border-radius:var(--hm-r);border:1px solid transparent;

    radial-gradient(50% 62% at 100% 52%,color-mix(in srgb,var(--g) 24%,transparent),transparent 72%) padding-box,
    radial-gradient(92% 82% at 100% 100%,var(--gb),transparent 64%) padding-box,
    radial-gradient(100% 105% at 0% 0%,var(--gt),transparent 60%) padding-box,

  box-shadow:inset 0 0 10px -4px color-mix(in srgb,var(--g) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.10),0 14px 26px -18px color-mix(in srgb,var(--g) 45%,#000)}

/* reflexo: inteiro no alto e junto à borda direita; na faixa do valor e da legenda (embaixo, à esquerda) fica atenuado */

.home .hc .hc-v{padding-top:var(--hm-vt)}

.home .hc.empty .hc-v b{margin-bottom:0}

.home .hc.cnt .hc-lg b{font-weight:720;color:var(--hm-ink)}

.home .hc.cnt .hc-v.hc-lg{padding-top:var(--hm-vt)}
/* todas as linhas ancoram valor e legenda na base */
.home .hc .hc-v,.home .hg-c .hc.l2 .hc-v,.home .hc.l2 .hc-v{margin-top:auto}
.home .hg-c:not(:has(.hc-s:not(:empty))) .hc-v{margin-block:auto 0}
/* Suplementos e Medicamentos: os dois contadores ficam centrados no espaço abaixo do título, como na referência */
.home .hc.cnt .hc-v,.home .hg-b .hc.cnt .hc-v{margin-block:auto}
/* v38: Suplementos com título de uma linha e legenda ("Em uso"), ancorado na base como os outros sete */
.home .hc.cnt .hc-v,.home .hg-b .hc.cnt .hc-v,.home .hc.cnt .hc-v.hc-lg{margin-block:auto 0}
/* halo de leitura mais leve que o da v21: o reflexo agora passa à direita e abaixo do texto */

/* divisórias entre os grupos: mesmo fio, mais discreto, num intervalo pouco maior que o das linhas */
.home .hdiv{margin:calc(var(--hm-div) + var(--xd,0px)) 0;opacity:.62}
/* v38: sem divisórias na Home — as quatro fileiras com o mesmo intervalo (antes 14 dentro do grupo e ~17 entre grupos) */
.home .hgrid + .hgrid{margin-top:var(--hm-row)}
/* v38.1: dois grupos de quatro separados só por espaço (sem linha): pilares do dia · o que se cuida e organiza.
   v38.2: um ritmo só — o espaço entre os grupos é o mesmo do cabeçalho aos cartões (24 = 20 + até 4 da distribuição); dentro dos grupos, 14.
   Antes o intervalo entre grupos (30) era maior que o do cabeçalho (20), invertendo a hierarquia. Telas estreitas: 20. */

/* ===== v36 · barra inferior com cinco abas — um único componente, mesma geometria em todas as telas =====
