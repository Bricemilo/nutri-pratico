<title>Nutri Prático</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Prático">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: uma coluna de app nativo (máx. 600px), cabeçalho translúcido fixo, cartões só onde há objeto próprio, barra de totais no rodapé. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#0D1311; --ink-2:#3B4642; --muted:#707C77;
  --line:#E2E7E5; --line-2:#D3DAD7; --accent:#0B7A5E; --accent-ink:#FFFFFF; --accent-soft:#E2F2EC;
  --carb:#C9821A; --prot:#4C58D0; --fat:#D9475F; --danger:#C93636; --shadow:0 1px 2px rgba(13,19,17,.05),0 8px 24px rgba(13,19,17,.06);
  --seg-on:#FFFFFF; --inv-bg:#0D1311; --inv-fg:#F2F4F3; --inv-acc:#5FE0B4; --scrim:rgba(5,10,8,.42);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E0D; --surface:#141917; --surface-2:#1A201E; --ink:#EDF2F0; --ink-2:#C2CBC7; --muted:#88948F;
  --line:#242D2A; --line-2:#313C38; --accent:#47C79F; --accent-ink:#04140E; --accent-soft:#143128;
  --carb:#EDA84A; --prot:#8E97FF; --fat:#FF7D92; --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --seg-on:#313C38; --inv-bg:#1D2522; --inv-fg:#EDF2F0; --inv-acc:#47C79F; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E0D; --surface:#141917; --surface-2:#1A201E; --ink:#EDF2F0; --ink-2:#C2CBC7; --muted:#88948F;
  --line:#242D2A; --line-2:#313C38; --accent:#47C79F; --accent-ink:#04140E; --accent-soft:#143128;
  --carb:#EDA84A; --prot:#8E97FF; --fat:#FF7D92; --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --seg-on:#313C38; --inv-bg:#1D2522; --inv-fg:#EDF2F0; --inv-acc:#47C79F; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-bottom:190px}
.totals{transition:transform .2s,opacity .2s}
.totals.kb{transform:translateY(120%);opacity:0}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:40px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.mark svg{width:15px;height:15px}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;margin-left:-6px;padding:6px}
.back svg{width:20px;height:20px}

h1{font-size:32px;line-height:1.1;letter-spacing:-.03em;font-weight:650;margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Busca */
.search{position:relative;margin:16px 0 8px}
.search svg{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Lista de pacientes */
.plist{display:flex;flex-direction:column;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitem{display:flex;align-items:center;gap:13px;padding:13px 14px;text-align:left;width:100%;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem:active{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;letter-spacing:-.01em}
.pmain{flex:1;min-width:0}
.pname{font-weight:550;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{color:var(--muted);font-size:13px}
.pkcal{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pkcal b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:6px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.foot-note{margin:22px 4px 0;color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.foot-note svg{width:15px;height:15px;flex:none;margin-top:1px}
.nudge{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.nudge div{flex:1;font-size:14px}
.nudge b{display:block;font-weight:600}
.nudge .btn{height:38px;padding:0 14px;font-size:14px}
.bk-row{display:flex;flex-direction:column;gap:10px}
.bk-meta{font-size:13px;color:var(--muted);margin:-6px 0 16px}

/* Botões */
.btn{height:46px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;max-width:600px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:92%;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:21px;letter-spacing:-.02em;margin:0 0 16px;font-weight:650}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:17px;outline:none;width:100%}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
.seg button{height:40px;border-radius:10px;font-weight:550;font-size:14px;color:var(--ink-2);padding:0 4px;line-height:1.1}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg.big button{height:46px;font-size:15px}
.row-actions{display:flex;gap:10px;margin-top:8px}
.row-actions .btn{flex:1}
.confirm{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-2)}

/* Paciente */
.phead{margin:14px 0 14px}
.phead h1{margin:0 0 4px;font-size:28px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;padding:6px 0 10px;background:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-weight:600;font-size:16px;letter-spacing:-.01em}

/* Energia */
.hero{background:var(--inv-bg);color:var(--inv-fg);border:0;padding:18px}
.hero .eyebrow{color:color-mix(in srgb,var(--inv-fg) 60%,transparent)}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.big{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;letter-spacing:0;margin-left:4px;opacity:.6}
.hero .lbl{font-size:13px;opacity:.7;margin-bottom:6px}
.hero-foot{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--inv-fg) 18%,transparent);font-size:12.5px;font-family:var(--mono);opacity:.85}
.hero .gold{color:var(--inv-acc)}
.measures{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{position:relative}
.mfield input{height:62px;font-size:26px;font-weight:600;letter-spacing:-.02em;padding-right:44px}
.mfield span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}
.facts b{color:var(--ink);font-weight:550}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.res > div{background:var(--surface-2);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.res .k{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.res .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.res .v.acc{color:var(--accent)}
.eq{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:13px;height:44px}
@media (max-width:370px){.seg4{grid-template-columns:repeat(2,1fr)}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.warn{color:var(--carb)}

/* Plano */
.plan-head{display:grid;grid-template-columns:1fr 128px;gap:10px}
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px;overscroll-behavior:contain}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;min-height:44px}
.ac-item.on{background:var(--accent-soft)}
.ac-l{flex:1;min-width:0;font-size:15px}
.ac-l b{font-weight:650;color:var(--accent)}
.ac-m{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ac-x{width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:18px;line-height:1}
.ac-x:hover{background:var(--surface-2)}
.ac-sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}

.meal{padding:0;overflow:visible}
.meal-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
.meal-h .acw{flex:1}
.meal-name{width:100%;border:0;background:transparent;font-size:17px;font-weight:620;letter-spacing:-.015em;outline:none;padding:6px 0}
.meal-name::placeholder{color:var(--muted);font-weight:500}
.meal-sum{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px 10px;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.meal-sum .kc{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d-c{background:var(--carb)} .d-p{background:var(--prot)} .d-g{background:var(--fat)}
.rows{display:flex;flex-direction:column}
.item{padding:10px 12px 10px 14px;border-top:1px solid var(--line);scroll-margin-top:130px}
.item:first-child{border-top:0}
.item-l1{display:flex;align-items:center;gap:6px}
.item-l1 .acw{flex:1;min-width:0}
.food{width:100%;border:0;background:transparent;font-size:16px;outline:none;padding:7px 0;font-weight:500;text-overflow:ellipsis}
.food::placeholder{color:var(--muted);font-weight:400}
.x{width:30px;height:30px;border-radius:9px;color:var(--muted);display:grid;place-items:center;flex:none}
.x svg{width:15px;height:15px}
.x:hover{background:var(--surface-2);color:var(--danger)}
.item-l2{display:grid;grid-template-columns:minmax(0,1fr) 64px 70px;gap:8px;align-items:center;margin-top:4px}
.cell{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:16px;outline:none;width:100%;min-width:0}
.cell:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.qty{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.kcal{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.kcal small{color:var(--muted);font-weight:500;font-size:11px;margin-left:2px}
.item-l3{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.item-l3 .g{color:var(--ink-2)}
.item.blank .item-l2,.item.blank .item-l3,.item.blank .x{display:none}
.quick{display:none;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.item.qfocus .quick{display:flex}
.quick button{flex:none;height:34px;min-width:42px;padding:0 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.quick button.next{background:var(--accent);color:var(--accent-ink);border-color:transparent;margin-left:auto;padding:0 14px}
.meal-del{color:var(--muted)}
.add-meal{width:100%;height:52px;border-radius:var(--r);border:1.5px dashed var(--line-2);color:var(--ink-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.add-meal svg{width:18px;height:18px}
.add-meal:hover{border-color:var(--accent);color:var(--accent)}
.plan-tools{display:flex;gap:10px}
.plan-tools .btn{flex:1;height:42px;font-size:14px}

/* Barra de totais */
.totals{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tbar{max-width:600px;margin:0 auto;background:var(--inv-bg);color:var(--inv-fg);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.25);pointer-events:auto}
.t1{display:flex;align-items:baseline;gap:8px}
.t-kcal{font-size:24px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-of{font-size:13px;opacity:.6;font-variant-numeric:tabular-nums}
.t-pct{margin-left:auto;font-family:var(--mono);font-size:12px;opacity:.75}
.prog{height:4px;border-radius:3px;background:color-mix(in srgb,var(--inv-fg) 16%,transparent);margin:8px 0 10px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.t2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.t2 div{font-size:15px;font-weight:600;letter-spacing:-.01em}
.t2 span{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.65;letter-spacing:.02em}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.view{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.src{margin:26px 4px 0;font-size:11.5px;color:var(--muted);line-height:1.5}
</style>

<div class="app" id="app"></div>
<div class="totals" id="totals" hidden></div>
<div class="toast" id="toast"></div>

function normCh(ch){ return ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function norm(s){ let o = ""; for (const ch of s) o += normCh(ch); return o; }
const words = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Destaca os prefixos digitados no início das palavras */
function highlight(text, q){
  const qt = words(q);
  if (!qt.length) return esc(text);
  const chars = [...text], n = chars.map(normCh);
  const mark = new Array(chars.length).fill(false);
  let i = 0;
  while (i < chars.length){
    if (!/[a-z0-9]/.test(n[i])) { i++; continue; }
    let j = i; while (j < chars.length && /[a-z0-9]/.test(n[j])) j++;
    const w = n.slice(i, j).join("");
    let best = 0; for (const t of qt) if (w.startsWith(t) && t.length > best) best = t.length;
    for (let k = 0; k < best; k++) mark[i + k] = true;
    i = j;
  }
  let out = "", on = false;
  chars.forEach((c, k) => {
    if (mark[k] && !on) { out += "<b>"; on = true; }
    if (!mark[k] && on) { out += "</b>"; on = false; }
    out += esc(c);
  });
  return out + (on ? "</b>" : "");
}

function parseQty(s){
  if (s == null) return null;
  s = String(s).trim().replace(/½/g, " 1/2").replace(/¼/g, " 1/4").replace(/¾/g, " 3/4").replace(/,/g, ".");
  if (!s) return null;
  let total = 0;
  for (const part of s.split(/\s+/)){
    if (!part) continue;
    const m = part.match(/^(\d*\.?\d+)\/(\d*\.?\d+)$/);
    const v = m ? parseFloat(m[1]) / parseFloat(m[2]) : parseFloat(part);
    if (!isFinite(v)) return null;
    total += v;
  }
  return total > 0 ? total : null;
}

/* ---------- cálculos de necessidade energética ---------- */
function ageOf(birth){
  if (!birth) return null;
  const b = new Date(birth + "T12:00:00"), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}
const FAO_LV = ["Muito leve", "Leve", "Moderado", "Intenso"];
const FAO_FA = {M: [1.30, 1.55, 1.78, 2.10], F: [1.30, 1.56, 1.64, 1.82]};
function faoTMB(sex, age, W){
  const T = sex === "M"
    ? [[3, 60.9, -54], [10, 22.7, 495], [18, 17.5, 651], [30, 15.3, 679], [60, 11.6, 879], [999, 13.5, 487]]
    : [[3, 61.0, -51], [10, 22.5, 499], [18, 12.2, 746], [30, 14.7, 496], [60, 8.7, 829], [999, 10.5, 596]];
  const r = T.find(r => age < r[0]);
  const range = age < 3 ? "0–3" : age < 10 ? "3–10" : age < 18 ? "10–18" : age < 30 ? "18–30" : age < 60 ? "30–60" : "> 60";
  return {v: r[1] * W + r[2], eq: `${nf1.format(r[1])} × P ${r[2] < 0 ? "−" : "+"} ${Math.abs(r[2])}  (${range} anos)`};
}
const DRI_LV = ["Sedentário", "Pouco ativo", "Ativo", "Muito ativo"];
function driCalc(sex, age, W, Hcm, lv){
  const H = Hcm / 100;
  if (age >= 19){
    const PA = sex === "M" ? [1.00, 1.11, 1.25, 1.48][lv] : [1.00, 1.12, 1.27, 1.45][lv];
    const get = sex === "M" ? 662 - 9.53 * age + PA * (15.91 * W + 539.6 * H) : 354 - 6.91 * age + PA * (9.36 * W + 726 * H);
    const tmb = sex === "M" ? 293 - 3.8 * age + 456.4 * H + 10.12 * W : 247 - 2.67 * age + 401.5 * H + 8.60 * W;
    const eq = sex === "M" ? "662 − 9,53·I + AF·(15,91·P + 539,6·A)" : "354 − 6,91·I + AF·(9,36·P + 726·A)";
    return {get, tmb, PA, eq};
  }
  if (age >= 3){
    const PA = sex === "M" ? [1.00, 1.13, 1.26, 1.42][lv] : [1.00, 1.16, 1.31, 1.56][lv];
    const dep = age <= 8 ? 20 : 25;
    const get = sex === "M" ? 88.5 - 61.9 * age + PA * (26.7 * W + 903 * H) + dep : 135.3 - 30.8 * age + PA * (10.0 * W + 934 * H) + dep;
    const tmb = sex === "M" ? 68 - 43.3 * age + 712 * H + 19.2 * W : 189 - 17.6 * age + 625 * H + 7.9 * W;
    const eq = (sex === "M" ? "88,5 − 61,9·I + AF·(26,7·P + 903·A)" : "135,3 − 30,8·I + AF·(10·P + 934·A)") + ` + ${dep}`;
    return {get, tmb, PA, eq};
  }
  return null;
}
function energyOf(p){
  const e = p.energy || {}, age = ageOf(p.birth), W = e.weight, Hc = e.height;
  if (!(W > 1 && W < 400 && Hc > 40 && Hc < 260) || age == null) return {ok: false, age};
  const f = faoTMB(p.sex, age, W);
  const fa = FAO_FA[p.sex][e.fao ?? 1];
  const fao = {tmb: f.v, fa, get: f.v * fa, eq: f.eq};
  const dri = driCalc(p.sex, age, W, Hc, e.dri ?? 1);
  const tmb = dri ? (fao.tmb + dri.tmb) / 2 : fao.tmb;
  const get = dri ? (fao.get + dri.get) / 2 : fao.get;
  return {ok: true, age, fao, dri, tmb, get, imc: W / Math.pow(Hc / 100, 2)};
}

/* ---------- cálculos do plano ---------- */
function measureOf(f, label){ return f.measures.find(m => m.l === label) || f.measures[0]; }
function calcItem(it){
  const f = FOODS.get(it.foodId);
  if (!f || !it.qty) return null;
  const m = measureOf(f, it.measure), g = m.g * it.qty, k = g / 100;
  return {g, kcal: f.kcal * k, c: f.c * k, p: f.p * k, l: f.fat * k};
}
function sum(list){
  const t = {g: 0, kcal: 0, c: 0, p: 0, l: 0};
  for (const r of list) if (r) for (const k in t) t[k] += r[k];
  return t;
}
const mealTotal = m => sum(m.items.map(calcItem));
const planTotal = pl => sum(pl.meals.map(mealTotal));

/* ---------- busca de alimentos ---------- */
function searchFoods(q){
  const qt = words(q), use = S.prefs.use;
  if (!qt.length){
    return Object.entries(use).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => FOODS.get(+id)).filter(Boolean);
  }
  const res = [];
  for (const f of FOOD_LIST){
    let score = 0, ok = true;
    for (let i = 0; i < qt.length; i++){
      const t = qt[i];
      const wi = f.w.findIndex(w => w.startsWith(t) || (t.length > 3 && w.length >= 3 && t.startsWith(w)));
      if (wi < 0) { ok = false; break; }
      if (i === 0 && wi === 0) score += 40;
      if (wi === i) score += 6;
      if (f.w[wi] === t) score += 4;
    }
    if (!ok) continue;
    score += Math.min(use[f.id] || 0, 40) * 5;
    if (f.ibge) score += 3;
    if (f.common) score += 14;
    if (f.own) score += 10;
    score -= f.name.length * 0.12;
    res.push([score, f]);
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 8).map(r => r[1]);
}

/* ---------- autocompletar ---------- */
function autocomplete(input, o){
  const list = h("div", {class: "ac", role: "listbox"}); list.hidden = true;
  input.parentElement.append(list);
  input.setAttribute("autocomplete", "off"); input.setAttribute("autocorrect", "off"); input.setAttribute("spellcheck", "false");
  let items = [], active = 0, nav = false;
  function render(){
    items = o.items(input.value);
    if (!items.length || document.activeElement !== input) { list.hidden = true; return; }
    active = Math.min(active, items.length - 1);
    const kids = [];
    if (o.title && o.title(input.value)) kids.push(h("div", {class: "ac-sec"}, o.title(input.value)));
    items.forEach((it, i) => {
      const el = h("div", {class: "ac-item" + (i === active ? " on" : ""), role: "option"},
        h("span", {class: "ac-l", html: highlight(it.label, o.hl === false ? "" : input.value)}),
        it.meta ? h("span", {class: "ac-m"}, it.meta) : null,
        it.removable ? h("button", {class: "ac-x", type: "button", "aria-label": "Remover opção da lista", title: "Remover da lista"}, "×") : null);
      el.addEventListener("mousedown", e => e.preventDefault());
      el.addEventListener("click", e => {
        if (e.target.closest(".ac-x")) { o.onRemove(it); render(); return; }
        pick(i);
      });
      kids.push(el);
    });
    list.replaceChildren(...kids);
    list.hidden = false;
  }
  function pick(i){ const it = items[i]; if (!it) return; list.hidden = true; o.onPick(it); }
  input.addEventListener("input", () => { active = 0; nav = false; render(); });
  input.addEventListener("focus", () => { active = 0; nav = false; render(); });
  input.addEventListener("blur", () => { list.hidden = true; o.onBlur && o.onBlur(); });
  input.addEventListener("keydown", e => {
    const open = !list.hidden && items.length;
    if (e.key === "ArrowDown" && open) { e.preventDefault(); nav = true; active = (active + 1) % items.length; render(); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); nav = true; active = (active - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey && open && o.tabPicks)) {
      if (e.isComposing) return;
      if (open && (nav || (o.enterPicks ? o.enterPicks(input.value) : true))) { e.preventDefault(); pick(active); }
      else if (o.onEnter) { e.preventDefault(); list.hidden = true; o.onEnter(); }
    }
    else if (e.key === "Escape") list.hidden = true;
  });
  return {close(){ list.hidden = true; }};
}

  };
}

const DAY = 864e5;

function backupNudge(){

function backupSheet(){
  const scrim = h("div", {class: "scrim"});
  const status = h("div", {class: "err", style: "color:var(--muted)"});
  const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});
  const confirmBox = h("div");
  const last = S.lastBackup ? `Último backup: ${new Date(S.lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda.";
  async function exportNow(){
    const stamp = new Date().toISOString().slice(0, 10);
    const json = JSON.stringify({app: "nutri-pratico", version: 1, exported: new Date().toISOString(), data: S});
    const name = `nutri-pratico-backup-${stamp}.json`;
    const blob = new Blob([json], {type: "application/json"});
    const done = () => { S.lastBackup = Date.now(); save(); status.textContent = "Backup gerado. Guarde o arquivo em Arquivos, iCloud ou e-mail."; };
    try {
      const f = new File([blob], name, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: "Backup Nutri Prático"}); done(); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); done();
    } catch (e) { status.textContent = "Não foi possível gerar o arquivo neste navegador."; }
  }
  file.addEventListener("change", () => {
    const f = file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let b; try { b = JSON.parse(rd.result); } catch (e) {}
      const d = b && b.data;
      if (!d || !Array.isArray(d.patients) || !d.prefs) { status.textContent = "Esse arquivo não é um backup do Nutri Prático."; return; }

/* ---------- Cadastro / edição de paciente ---------- */
function maskDate(v){
  const d = v.replace(/\D/g, "").slice(0, 8);
  return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
}
function toISO(br){
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if (dt > new Date() || y < 1900) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
const fromISO = iso => iso ? iso.split("-").reverse().join("/") : "";

        h("span", null, `${fq.format(e.weight)} kg · ${fq.format(e.height)} cm`))));

/* ---------- Plano alimentar ---------- */
function renderPlan(p, body){
  const plan = p.plan;
  const r = energyOf(p);
  const target = () => plan.target || (r.ok ? Math.round(r.get) : null);

  /* objetivo */
  const obj = h("input", {class: "input", id: "objetivo", placeholder: "Objetivo", value: plan.objective || "", enterkeyhint: "next", "aria-label": "Objetivo"});
  const objW = h("div", {class: "acw"}, obj);
  autocomplete(obj, {
    items: optionSource("objectives"),
    onPick: it => { obj.value = it.value; plan.objective = it.value; touch(p); focusFirstSlot(); },
    onRemove: it => { S.prefs.objectives = S.prefs.objectives.filter(o => o !== it.value); save(); },
    enterPicks: v => !!v.trim() && !S.prefs.objectives.some(o => norm(o) === norm(v.trim())) && optionSource("objectives")(v).length > 0,
    onEnter: () => { plan.objective = obj.value.trim(); rememberOption("objectives", plan.objective); touch(p); focusFirstSlot(); }
  });
  obj.addEventListener("input", () => { plan.objective = obj.value; touch(p); });
  obj.addEventListener("change", () => rememberOption("objectives", obj.value));

  const tgt = h("input", {class: "input num", id: "meta", inputmode: "numeric", placeholder: r.ok ? k0(r.get) : "kcal", value: plan.target ? String(plan.target) : "", "aria-label": "Meta de kcal"});
  tgt.addEventListener("input", () => { const v = parseInt(tgt.value.replace(/\D/g, ""), 10); plan.target = v > 0 ? v : null; touch(p); updateTotals(); });

  const mealsEl = h("div", {class: "stack"});
  const refs = new Map();   // id -> {sumEl} / item id -> {row,...}

  function focusFirstSlot(){
    if (!plan.meals.length) { addMeal(true); return; }
    const m = plan.meals.find(x => !x.name.trim()) || plan.meals[plan.meals.length - 1];
    const card = mealsEl.children[plan.meals.indexOf(m)];
    if (!m.name.trim() && card) card.querySelector(".meal-name").focus();
    else refs.get(m.items[m.items.length - 1].id)?.food.focus();
  }

  function nextMealName(){
    const used = new Set(plan.meals.map(m => norm(m.name)));
    return DEFAULT_MEALS.find(n => !used.has(norm(n))) || "";
  }
  function addMeal(focus){
    const m = {id: uid(), name: "", items: []};
    plan.meals.push(m); ensureBlank(m); touch(p);
    const el = buildMeal(m); mealsEl.append(el);
    if (focus) { const nm = el.querySelector(".meal-name"); nm.focus(); el.scrollIntoView({block: "start", behavior: "smooth"}); }
    updateTotals();
  }
  function ensureBlank(m){
    const last = m.items[m.items.length - 1];
    if (!last || last.foodId) m.items.push({id: uid(), foodId: null, measure: null, qty: null});
  }

  function buildMeal(m){
    const name = h("input", {class: "meal-name", placeholder: nextMealName() || "Nome da refeição", value: m.name, enterkeyhint: "next", "aria-label": "Nome da refeição"});
    const nameW = h("div", {class: "acw"}, name);
    const rowsEl = h("div", {class: "rows"});
    const sumEl = h("div", {class: "meal-sum"});
    const card = h("section", {class: "card meal"});
    const firstFood = () => refs.get(m.items[0].id).food.focus();
    autocomplete(name, {
      items: optionSource("meals"),
      onPick: it => { name.value = it.value; m.name = it.value; touch(p); firstFood(); },
      onRemove: it => { S.prefs.meals = S.prefs.meals.filter(o => o !== it.value); save(); },
      enterPicks: v => !!v.trim() && !S.prefs.meals.some(o => norm(o) === norm(v.trim())) && optionSource("meals")(v).length > 0,
      onEnter: () => {
        if (!name.value.trim() && name.placeholder && name.placeholder !== "Nome da refeição") name.value = name.placeholder;
        m.name = name.value.trim(); rememberOption("meals", m.name); touch(p); firstFood();
      }
    });
    name.addEventListener("input", () => { m.name = name.value; touch(p); });
    name.addEventListener("change", () => rememberOption("meals", name.value));

    const delWrap = h("div");
    const delIdle = () => delWrap.replaceChildren(h("button", {class: "x meal-del", "aria-label": "Remover refeição", title: "Remover refeição", html: ICON.x, onclick: delAsk}));
    function delAsk(){
      delWrap.replaceChildren(h("button", {class: "btn danger", style: "height:32px;padding:0 10px;font-size:13px", onclick: () => {
        plan.meals = plan.meals.filter(x => x !== m); touch(p); card.remove(); updateTotals();
      }}, "Remover"), h("button", {class: "btn ghost", style: "height:32px;padding:0 10px;font-size:13px;margin-left:6px", onclick: delIdle}, "Não"));
    }
    delIdle();

    card.append(h("div", {class: "meal-h"}, nameW, delWrap), sumEl, rowsEl);
    refs.set(m.id, {sumEl});
    for (const it of m.items) rowsEl.append(buildRow(m, it, rowsEl));
    paintMealSum(m);
    return card;
  }

  function buildRow(m, it, rowsEl){
    const row = h("div", {class: "item"});
    const food = h("input", {class: "food", placeholder: "Alimento", "aria-label": "Alimento", enterkeyhint: "next", autocapitalize: "off"});
    const foodW = h("div", {class: "acw"}, food);
    const meas = h("input", {class: "cell", "aria-label": "Medida caseira", enterkeyhint: "next", autocapitalize: "off"});
    const measW = h("div", {class: "acw"}, meas);
    const qty = h("input", {class: "cell qty", inputmode: "decimal", "aria-label": "Quantidade", placeholder: "1", enterkeyhint: "next"});
    const kcal = h("div", {class: "kcal"});
    const l3 = h("div", {class: "item-l3"});
    const del = h("button", {class: "x", "aria-label": "Remover alimento", title: "Remover alimento", html: ICON.x});
    const quick = h("div", {class: "quick"});
    const R = {row, food, meas, qty, kcal, l3};
    refs.set(it.id, R);

    function syncInputs(){
      const f = FOODS.get(it.foodId);
      row.classList.toggle("blank", !f);
      food.value = f ? f.name : "";
      meas.value = f ? measureOf(f, it.measure).l : "";
      qty.value = fmtQty(it.qty);
      paintRow();
    }
    function paintRow(){
      const f = FOODS.get(it.foodId);
      const c = calcItem(it);
      if (!f) return;
      const m1 = measureOf(f, it.measure);
      kcal.replaceChildren(c ? k0(c.kcal) : "—", h("small", null, "kcal"));
      l3.replaceChildren(
        h("span", {class: "g"}, c ? `${fq.format(Math.round(c.g * 10) / 10)} g` : `${fq.format(m1.g)} g/${m1.l === "Grama" ? "g" : "un"}`),
        h("span", null, h("i", {class: "dot d-c"}), `C ${c ? g1(c.c) : "—"}`),
        h("span", null, h("i", {class: "dot d-p"}), `P ${c ? g1(c.p) : "—"}`),
        h("span", null, h("i", {class: "dot d-g"}), `G ${c ? g1(c.l) : "—"}`));
    }

    /* alimento */
    autocomplete(food, {
      items: q => {
        if (FOODS.get(it.foodId) && q === FOODS.get(it.foodId).name) return [];
        const list = searchFoods(q).map(f => ({label: f.name, meta: f.own ? `próprio · ${f.kcal} kcal` : `${f.kcal} kcal`, value: f}));
        if (q.trim().length >= 2) list.push({label: `+ Cadastrar “${q.trim()}” como alimento próprio`, value: {create: q.trim()}});
        return list;
      },
      enterPicks: v => !!v.trim(),
      title: q => !words(q).length && Object.keys(S.prefs.use).length ? "Mais usados" : "",
      onPick: x => x.value.create ? foodSheet(x.value.create, f => setFood(f)) : setFood(x.value),
      onEnter: () => {
        if (!food.value.trim() && !it.foodId){ addMeal(true); return; }   // Enter em linha vazia: nova refeição
        if (it.foodId) { food.value = FOODS.get(it.foodId).name; qty.focus(); }
      },
      onBlur: () => { const f = FOODS.get(it.foodId); if (f && food.value !== f.name) food.value = f.name; if (!f) food.value = ""; }
    });
    food.addEventListener("focus", () => { setTimeout(() => row.scrollIntoView({block: "start", behavior: "smooth"}), 30); });

    function setFood(f){
      const changed = it.foodId !== f.id;
      it.foodId = f.id;
      if (changed || !it.measure) it.measure = S.prefs.last[f.id] && f.measures.some(m => m.l === S.prefs.last[f.id]) ? S.prefs.last[f.id] : f.measures[0].l;
      touch(p); syncInputs();
      ensureBlank(m);
      const last = m.items[m.items.length - 1];
      if (!refs.has(last.id)) rowsEl.append(buildRow(m, last, rowsEl));
      qty.focus(); qty.select();
      paintMealSum(m); updateTotals();
    }

    /* medida caseira */
    autocomplete(meas, {
      items: q => {
        const f = FOODS.get(it.foodId); if (!f) return [];
        const cur = measureOf(f, it.measure).l;
        const qt = words(q);
        const all = (q === cur || !qt.length) ? f.measures : f.measures.filter(m1 => { const w = words(m1.l); return qt.every(t => w.some(x => x.startsWith(t))); });
        return all.map(m1 => ({label: m1.l, meta: `${fq.format(m1.g)} g`, value: m1}));
      },
      hl: true,
      onPick: x => { it.measure = x.value.l; meas.value = x.value.l; touch(p); paintRow(); paintMealSum(m); updateTotals(); qty.focus(); qty.select(); },
      onBlur: () => { const f = FOODS.get(it.foodId); if (f) meas.value = measureOf(f, it.measure).l; }
    });
    meas.addEventListener("focus", () => setTimeout(() => { if (document.activeElement === meas) meas.select(); }, 0));

    /* quantidade */
    qty.addEventListener("input", () => { it.qty = parseQty(qty.value); touch(p); paintRow(); paintMealSum(m); updateTotals(); });
    qty.addEventListener("focus", () => { row.classList.add("qfocus"); setTimeout(() => { if (document.activeElement === qty) qty.select(); }, 0); });
    qty.addEventListener("blur", () => { row.classList.remove("qfocus"); qty.value = fmtQty(it.qty); });
    qty.addEventListener("keydown", e => { if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); commit(); } });
    for (const [lbl, v] of [["¼", .25], ["½", .5], ["¾", .75], ["1", 1], ["1½", 1.5], ["2", 2], ["3", 3], ["4", 4]]){
      const b = h("button", {type: "button"}, lbl);
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("click", () => { it.qty = v; qty.value = fmtQty(v); commit(); });
      quick.append(b);
    }
    const nx = h("button", {type: "button", class: "next"}, "Próximo ↵");
    nx.addEventListener("mousedown", e => e.preventDefault());
    nx.addEventListener("click", commit);
    quick.append(nx);

    function commit(){
      if (!it.qty) { it.qty = 1; qty.value = "1"; }
      S.prefs.use[it.foodId] = (S.prefs.use[it.foodId] || 0) + 1;
      S.prefs.last[it.foodId] = it.measure;
      touch(p); paintRow(); paintMealSum(m); updateTotals();
      const idx = m.items.indexOf(it);
      ensureBlank(m);
      const nxt = m.items[idx + 1];
      if (!refs.has(nxt.id)) rowsEl.append(buildRow(m, nxt, rowsEl));
      refs.get(nxt.id).food.focus();
    }

    del.addEventListener("click", () => {
      m.items = m.items.filter(x => x !== it); refs.delete(it.id); row.remove();
      ensureBlank(m); touch(p); paintMealSum(m); updateTotals();
    });

    row.append(
      h("div", {class: "item-l1"}, foodW, del),
      h("div", {class: "item-l2"}, measW, qty, kcal),
      l3, quick);
    syncInputs();
    return row;
  }

  function paintMealSum(m){
    const R = refs.get(m.id); if (!R) return;
    const t = mealTotal(m);
    R.sumEl.replaceChildren(
      h("span", {class: "kc"}, `${k0(t.kcal)} kcal`),
      h("span", null, h("i", {class: "dot d-c"}), `C ${g1(t.c)} g`),
      h("span", null, h("i", {class: "dot d-p"}), `P ${g1(t.p)} g`),
      h("span", null, h("i", {class: "dot d-g"}), `G ${g1(t.l)} g`));
  }

  /* totais do plano */
  function updateTotals(){
    const t = planTotal(plan), tg = target();
    const mk = t.c * 4 + t.p * 4 + t.l * 9 || 1;
    const pc = v => Math.round(v / mk * 100);
    const W = p.energy.weight;
    const pct = tg ? Math.round(t.kcal / tg * 100) : null;
    totalsEl.hidden = false;
    totalsEl.replaceChildren(h("div", {class: "tbar"},
      h("div", {class: "t1"},
        h("span", {class: "t-kcal"}, k0(t.kcal)),
        h("span", {class: "t-of"}, tg ? `/ ${k0(tg)} kcal` : "kcal"),
        h("span", {class: "t-pct"}, pct != null ? `${pct}% da meta` : "sem meta")),
      h("div", {class: "prog", "aria-hidden": "true"},
        h("i", {style: `width:${Math.min(100, (t.c * 4) / (tg || mk) * 100)}%;background:var(--carb)`}),
        h("i", {style: `width:${Math.min(100, (t.p * 4) / (tg || mk) * 100)}%;background:var(--prot)`}),
        h("i", {style: `width:${Math.min(100, (t.l * 9) / (tg || mk) * 100)}%;background:var(--fat)`})),
      h("div", {class: "t2"},
        h("div", null, h("i", {class: "dot d-c"}), `${g1(t.c)} g`, h("span", null, `CHO ${pc(t.c * 4)}%${W ? " · " + g1(t.c / W) + " g/kg" : ""}`)),
        h("div", null, h("i", {class: "dot d-p"}), `${g1(t.p)} g`, h("span", null, `PTN ${pc(t.p * 4)}%${W ? " · " + g1(t.p / W) + " g/kg" : ""}`)),
        h("div", null, h("i", {class: "dot d-g"}), `${g1(t.l)} g`, h("span", null, `LIP ${pc(t.l * 9)}%${W ? " · " + g1(t.l / W) + " g/kg" : ""}`)))));
  }

  /* copiar plano como texto */
  function copyPlan(){
    const lines = [`PLANO ALIMENTAR · ${p.name}`];
    if (plan.objective) lines.push(`Objetivo: ${plan.objective}`);
    for (const m of plan.meals){
      const its = m.items.filter(i => i.foodId && i.qty);
      if (!its.length) continue;
      lines.push("", `${(m.name || "Refeição").toUpperCase()} (${k0(mealTotal(m).kcal)} kcal)`);
      for (const i of its){
        const f = FOODS.get(i.foodId), ms = measureOf(f, i.measure), c = calcItem(i);
        lines.push(ms.l === "Grama" ? `• ${f.name}: ${fq.format(i.qty)} g` : `• ${f.name}: ${fmtQty(i.qty)} ${ms.l.toLowerCase()} (${fq.format(Math.round(c.g))} g)`);
      }
    }
    const t = planTotal(plan);
    lines.push("", `Total: ${k0(t.kcal)} kcal · CHO ${g1(t.c)} g · PTN ${g1(t.p)} g · LIP ${g1(t.l)} g`);
    const text = lines.join("\n");
    const done = () => toast("Plano copiado");
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback(text));
    } catch (e) { fallback(text); }
    function fallback(txt){
      const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("Não foi possível copiar"); }
      ta.remove();
    }
  }

  for (const m of plan.meals) { ensureBlank(m); mealsEl.append(buildMeal(m)); }
  body.append(h("div", {class: "stack"},
    h("div", {class: "plan-head"},
      h("div", {class: "field", style: "margin:0"}, h("label", {for: "objetivo"}, "Objetivo"), objW),
      h("div", {class: "field", style: "margin:0"}, h("label", {for: "meta"}, "Meta (kcal)"), tgt)),
    mealsEl,
    h("button", {class: "add-meal", onclick: () => addMeal(true)}, h("span", {html: ICON.plus, style: "display:contents"}), "Adicionar refeição"),
    h("div", {class: "plan-tools"}, h("button", {class: "btn ghost", onclick: copyPlan}, "Copiar plano em texto")),
    h("p", {class: "src"}, "Composição: TACO 4ª ed. (NEPA/UNICAMP, 2011). Medidas caseiras: POF 2008–2009, Tabela de Medidas Referidas (IBGE). Atalhos: Enter escolhe o alimento e avança; Enter numa linha vazia cria a próxima refeição.")));
  updateTotals();
  if (!plan.meals.length) addMeal(false);
}

/* No celular, o teclado cobre a barra de totais: ela sai de cena enquanto se digita */
const coarse = matchMedia("(pointer: coarse)");
document.addEventListener("focusin", e => { if (coarse.matches && e.target.matches("input")) totalsEl.classList.add("kb"); });
document.addEventListener("focusout", () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("input")) totalsEl.classList.remove("kb"); }, 60));

/* ---------- início ---------- */
load();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v && v.name) view = v; } catch (e) {}
render();
})();
</script>
