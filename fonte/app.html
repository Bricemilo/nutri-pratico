<title>Nutri Prático</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Prático">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: uma coluna de app nativo (máx. 600px) sobre preto quente; cada bloco é um cartão mais claro que o fundo; o cobre marca só o essencial. */
:root{
  --bg:#0A0908; --surface:#191614; --surface-2:#221E1B; --surface-3:#2B2622;
  --ink:#F4EEE8; --ink-2:#CDC3B9; --muted:#91877D; --line:#2D2824; --line-2:#3B352F;
  --accent:#E08C4E; --accent-2:#F2A468; --accent-ink:#1C0E05; --accent-soft:#2F1E12; --accent-line:#6B4226;
  --carb:#E5C07C; --prot:#6FC4BE; --fat:#DE8FA4; --fib:#A8C98B; --danger:#FF7D74; --danger-soft:#33191A;
  --hero-1:#2E1D11; --hero-2:#181513; --scrim:rgba(0,0,0,.62); --shadow:0 14px 36px rgba(0,0,0,.5);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px; --r-sm:11px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.home{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px)}
.home .datacard{margin-top:auto}
.home .plist,.home .empty{margin-bottom:40px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:16px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.back{display:flex;align-items:center;gap:2px;color:var(--accent-2);font-weight:500;margin-left:-6px;padding:6px}
.back svg{width:20px;height:20px}

h1{font-size:34px;line-height:1.08;letter-spacing:-.035em;font-weight:650;margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Busca */
.search{position:relative;margin:18px 0 12px}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}

/* Lista de pacientes */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitem{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem:active{background:var(--surface-2)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;letter-spacing:-.01em}
.pmain{flex:1;min-width:0}
.pname{font-weight:560;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname b{color:var(--accent-2);font-weight:inherit}
.pmeta{color:var(--muted);font-size:13.5px;margin-top:1px}
.pkcal{text-align:right;white-space:nowrap;font-size:12px;color:var(--muted)}
.pkcal b{display:block;color:var(--ink);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:8px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.foot-note{margin:16px 4px 0;color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.foot-note svg{width:15px;height:15px;flex:none;margin-top:1px}
.nudge{display:flex;align-items:center;gap:12px;margin-top:22px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--accent-line)}
.nudge div{flex:1;font-size:13.5px;color:var(--ink-2)}
.nudge b{display:block;font-weight:600;color:var(--ink);font-size:14.5px}
.nudge .btn{height:38px;padding:0 16px;font-size:14px}
.bk-row{display:flex;flex-direction:column;gap:10px}
.bk-meta{font-size:13px;color:var(--muted);margin:-6px 0 16px}

/* Botões */
.btn{height:48px;padding:0 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2)}
.btn.danger{color:var(--danger);background:var(--danger-soft);border:1px solid transparent}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-height:92%;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:22px;letter-spacing:-.02em;margin:0 0 16px;font-weight:650}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:17px;outline:none;width:100%}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg button{height:40px;border-radius:10px;font-weight:550;font-size:14px;color:var(--muted);padding:0 4px;line-height:1.1}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650;box-shadow:0 2px 10px rgba(224,140,78,.18)}
.seg.big button{height:46px;font-size:15px}
.sheet .seg{background:var(--surface-2)}
.row-actions{display:flex;gap:10px;margin-top:8px}
.row-actions .btn{flex:1}
.confirm{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-2)}

/* Confirmação de exclusão em linha */
.ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger-soft);font-size:14px;color:var(--ink)}
.ask span{flex:1 1 140px}

/* Paciente */
.phead{margin:16px 0 14px}
.phead h1{margin:0 0 4px;font-size:30px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;padding:6px 0 12px;background:var(--bg)}
.mini{transition:opacity .18s,transform .18s}
.mini.off{opacity:0;transform:translateY(-6px);pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-weight:620;font-size:16.5px;letter-spacing:-.01em}

/* Energia */
.hero{background:linear-gradient(155deg,var(--hero-1),var(--hero-2) 70%);border:1px solid var(--accent-line);padding:18px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big{font-size:40px;font-weight:620;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;letter-spacing:0;margin-left:4px;color:var(--muted)}
.hero .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.hero-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hero .gold{color:var(--accent-2)}
.measures{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{position:relative}
.mfield input{height:62px;font-size:26px;font-weight:600;letter-spacing:-.02em;padding-right:44px}
.mfield span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}
.facts b{color:var(--ink);font-weight:550}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.res > div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.res .k{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.res .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.res .v.acc{color:var(--accent-2)}
.eq{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.6}
.seg4{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:13px;height:44px}
@media (max-width:370px){.seg4{grid-template-columns:repeat(2,1fr)}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.warn{color:var(--accent-2)}

/* Plano */
.plan-head{display:grid;grid-template-columns:1fr 124px;gap:10px}
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface-3);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto;padding:4px;overscroll-behavior:contain}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;min-height:44px}
.ac-item.on{background:var(--accent-soft)}
.ac-item.pend{background:var(--danger-soft)}
.ac-l{flex:1;min-width:0;font-size:15px}
.ac-l b{font-weight:650;color:var(--accent-2)}
.ac-m{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-x{min-width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:18px;line-height:1;padding:0 6px}
.ac-item.pend .ac-x{color:var(--danger);font-size:13px;font-weight:600;background:var(--surface-2)}
.ac-sec{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}

/* Totais (plano e refeição): nome do macro colorido, gramas e % na 1ª linha, g/kg na 2ª */
.tot{padding:14px 16px 12px;background:linear-gradient(155deg,var(--hero-1),var(--hero-2) 72%);border-color:var(--accent-line)}
.tot-top{display:flex;align-items:center;gap:10px}
.tot-kcal{display:flex;align-items:baseline;gap:7px;flex:1;min-width:0}
.tot-kcal b{font-size:34px;font-weight:640;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tot-kcal span{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot .eyebrow{margin-bottom:6px}
.pill{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mwrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid > div{min-width:0;text-align:center;border-left:1px solid var(--line-2);padding:0 4px}
.mgrid > div:first-child{border-left:0}
.mgrid .k{font-size:12.5px;font-weight:650;letter-spacing:.01em}
.mgrid .v{font-size:21px;font-weight:650;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.mgrid .v small{font-size:13px;font-weight:550;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.mgrid .pc{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.mgrid .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fib{display:flex;align-items:baseline;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-2);font-size:13px;font-variant-numeric:tabular-nums}
.fib .t-f{font-weight:650}
.fib b{font-weight:650;font-size:15px}
.fib .s{margin-left:auto;color:var(--muted);font-size:12px}
.mwrap.sm{margin-top:0;padding-top:0;border-top:0}
.mwrap.sm .k{font-size:12px}
.mwrap.sm .v{font-size:17px}
.mwrap.sm .v small{font-size:12px}
.mwrap.sm .pc{font-size:11.5px}
.mwrap.sm .s{font-size:11.5px}
.mwrap.sm .fib{margin-top:9px;padding-top:8px;border-top-color:var(--line)}
.mwrap.sm .mgrid > div{border-left-color:var(--line)}
@media (max-width:370px){.mgrid .v{font-size:18px}.mwrap.sm .v{font-size:15px}.mgrid .pc{margin-left:3px}}
.t-c{color:var(--carb)} .t-p{color:var(--prot)} .t-g{color:var(--fat)} .t-f{color:var(--fib)}

/* Faixa fina fixa com o total, abaixo das abas */
.tabs .mini{position:absolute;left:0;right:0;top:calc(100% - 4px)}
.mini{display:flex;align-items:center;gap:12px;padding:7px 12px;box-shadow:0 10px 24px rgba(0,0,0,.45);border-radius:12px;background:var(--surface);border:1px solid var(--line-2);font-size:12px;white-space:nowrap;overflow:hidden}
.mini-k{font-variant-numeric:tabular-nums;color:var(--muted)}
.mini-k b{color:var(--ink);font-size:15px;font-weight:650}
.mini-k i{font-style:normal;margin-left:8px;font-size:11px;font-weight:600;color:var(--accent-2);padding:2px 7px;border-radius:999px;background:var(--accent-soft)}
.mini-m{display:flex;gap:12px;margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.mini-m b{font-weight:700}

/* Refeição */
.meals{display:flex;flex-direction:column;gap:22px}
.meal{padding:0;overflow:visible;border-color:var(--line-2)}
.meal-h{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.meal-h .acw{flex:0 1 auto;min-width:0}
.tw{position:relative;flex:none;width:74px;height:32px}
.tw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--line-2);border-radius:9px;font-size:12.5px;color:var(--muted);pointer-events:none}
.tw span svg{width:13px;height:13px}
.tw.has span{display:none}
.meal-time{position:absolute;inset:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0 4px;margin:0;min-width:0}
.meal-time::-webkit-date-and-time-value{text-align:center}
.meal-time::-webkit-calendar-picker-indicator{display:none}
.tw:not(.has) .meal-time{opacity:0}
.meal-time:focus{border-color:var(--accent-line)}
.meal-name{width:100%;max-width:100%;border:0;background:transparent;font-size:17px;font-weight:650;letter-spacing:-.015em;outline:none;padding:6px 0;color:var(--accent-2);text-overflow:ellipsis}
.meal-name::placeholder{color:var(--muted);font-weight:500}
.meal-name.ruler{position:absolute;left:0;top:0;width:auto;max-width:none;visibility:hidden;white-space:pre;pointer-events:none}
.meal-kcal{font-size:15px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:4px;margin-left:auto}
.meal-kcal small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.x.more svg{width:18px;height:18px}
.meal-ask{padding:0 12px}
.meal-ask:empty{display:none}
.ask-b{display:flex;gap:8px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.item{padding:11px 10px 11px 16px;border-top:1px solid var(--line);scroll-margin-top:140px}
.item:first-child{border-top:0}
.item-l1{display:flex;align-items:center;gap:6px}
.item-l1 .acw{flex:1;min-width:0}
.food{width:100%;border:0;background:transparent;font-size:16px;outline:none;padding:5px 0;font-weight:540;text-overflow:ellipsis}
.food::placeholder{color:var(--muted);font-weight:400}
.x{width:32px;height:32px;border-radius:9px;color:var(--muted);display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.item-l2{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 8px 0 0}
.cell{height:40px;border-radius:11px;border:1px solid transparent;background:var(--surface-2);padding:0 11px;font-size:16px;outline:none;width:100%;min-width:0;text-overflow:ellipsis}
.cell:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.qty{text-align:center;font-weight:650;font-variant-numeric:tabular-nums;padding:0 4px}
.grams{text-align:right;font-weight:620;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.item-l3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:9px 8px 0 0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;align-items:baseline}
.item-l3 span:not(:first-child){text-align:right}
.item-l3 span{white-space:nowrap}
.item-l3 .kc{color:var(--ink);font-weight:620}
.item-l3 .kc small{color:var(--muted);font-weight:500}

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

/* Menu de ações que sobe da parte de baixo da tela */
function actionSheet(title, sub, actions){

    h("div", {class: "grab"}), h("h2", {style: sub ? "margin-bottom:4px" : null}, title), sub ? h("div", {class: "bk-meta", style: "margin:0 0 16px"}, sub) : null,

const svg = k => h("span", {html: ICON[k], style:"display:contents"});

function normCh(ch){ return ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function norm(s){ let o = ""; for (const ch of s) o += normCh(ch); return o; }
const words = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

const nf0 = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const nf2 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fq = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 2});
const k0 = v => nf0.format(Math.round(v));
const g1 = v => nf1.format(v);

/* Destaca os prefixos digitados no início das palavras */
function highlight(text, q){
  const qt = words(q);
  if (!qt.length) return esc(text);
  const chars = [...text], n = chars.map(normCh);
  const mark = new Array(chars.length).fill(false);
  let i = 0;
  while (i < chars.length){
    if (!/[a-z0-9]/.test(n[i])) { i++; continue; }
    let j = i; while (j < chars.length && /[a-z0-9]/.test(n[j])) j++;
    const w = n.slice(i, j).join("");
    let best = 0; for (const t of qt) if (w.startsWith(t) && t.length > best) best = t.length;
    for (let k = 0; k < best; k++) mark[i + k] = true;
    i = j;
  }
  let out = "", on = false;
  chars.forEach((c, k) => {
    if (mark[k] && !on) { out += "<b>"; on = true; }
    if (!mark[k] && on) { out += "</b>"; on = false; }
    out += esc(c);
  });
  return out + (on ? "</b>" : "");
}

function parseQty(s){
  if (s == null) return null;
  s = String(s).trim().replace(/½/g, " 1/2").replace(/¼/g, " 1/4").replace(/¾/g, " 3/4").replace(/,/g, ".");
  if (!s) return null;
  let total = 0;
  for (const part of s.split(/\s+/)){
    if (!part) continue;
    const m = part.match(/^(\d*\.?\d+)\/(\d*\.?\d+)$/);
    const v = m ? parseFloat(m[1]) / parseFloat(m[2]) : parseFloat(part);
    if (!isFinite(v)) return null;
    total += v;
  }
  return total > 0 ? total : null;
}
const fmtQty = q => q == null ? "" : fq.format(q);

/* ---------- base de alimentos (TACO + medidas IBGE/POF) ---------- */
const DATA = JSON.parse($("#food-data").textContent);
const FOODS = new Map(), FOOD_LIST = [];
const NO_DATA = new Set([450, 457, 458, 591]);   // valores "em reanálise" (*) na própria TACO
const COMMON = new Set([3, 1, 561, 567, 488, 490, 53, 52, 410, 408, 182, 179, 226, 225, 222, 7, 448, 449, 461, 463, 467, 468,
  260, 471, 494, 91, 88, 129, 78, 157, 110, 109, 100, 377, 346, 326, 317, 277, 551, 533, 589, 594, 214, 231, 235, 256, 236, 237, 261, 507, 577]);
/* Nomes do dia a dia para os nomes técnicos da TACO (a busca encontra pelos dois) */
const NAME_FIX = {
  1: "Arroz integral cozido", 2: "Arroz integral cru", 3: "Arroz branco cozido", 4: "Arroz branco cru", 5: "Arroz branco tipo 2 cozido",
  6: "Arroz branco tipo 2 cru", 7: "Aveia em flocos", 40: "Macarrão de trigo cru", 41: "Macarrão com ovos cru", 48: "Pão de forma de aveia",
  50: "Pão de forma de glúten", 51: "Pão de forma de milho", 52: "Pão de forma integral", 53: "Pão francês", 54: "Pão sovado",
  63: "Torrada de pão francês", 452: "Iogurte sabor pêssego", 453: "Leite condensado", 454: "Leite de cabra", 455: "Leite achocolatado",
  456: "Leite em pó desnatado", 459: "Leite em pó integral", 461: "Queijo minas frescal", 462: "Queijo minas meia cura",
  468: "Requeijão cremoso", 471: "Café coado (infusão 10%)", 485: "Ovo de codorna cru", 486: "Clara de ovo cozida",
  487: "Gema de ovo cozida", 488: "Ovo cozido", 489: "Ovo cru", 490: "Ovo frito", 511: "Café em pó torrado", 384: "Carne seca cozida",
  385: "Carne seca crua", 338: "Charque cozido", 339: "Charque cru", 21: "Flocos de milho com sal", 22: "Flocos de milho sem sal"
};
const BEEF_SUFFIX = {"fígado": "bovino", "língua": "bovina", "bucho": "bovino", "almôndegas": "bovinas", "costela": "bovina", "peito": "bovino"};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function friendly(id, name, cat){
  if (NAME_FIX[id]) return NAME_FIX[id];
  let [base, ...rest] = name.split(/,\s*/).map(x => x.trim().replace(/\/10minutos$/, "")).filter(Boolean);
  if (base === "Carne" && rest[0] === "bovina" && rest.length > 1){
    rest.shift(); const cut = rest.shift();
    base = cap(cut) + (BEEF_SUFFIX[cut] ? " " + BEEF_SUFFIX[cut] : "");
  } else if (base === "Frango" && ["peito", "coxa", "sobrecoxa", "asa", "coração", "fígado", "filé"].includes(rest[0])){
    base = cap(rest.shift()) + " de frango";
  } else if (base === "Porco" && rest.length){
    base = cap(rest.shift()) + " de porco";
  } else if (cat === "Pescados e frutos do mar" && rest[0] === "filé"){
    rest.shift(); base = "Filé de " + base.charAt(0).toLowerCase() + base.slice(1);
  }
  if (cat === "Frutas e derivados") rest = rest.filter(r => !/^crua?s?$/.test(r));
  return [base, ...rest].join(" ");
}
function addFood(raw){
  const [id, name, kcal, c, p, fat, fib, cat, ms] = raw;
  const measures = ms.map(([l, g]) => ({l, g}));
  if (!measures.some(m => m.l === "Grama")) measures.push({l: "Grama", g: 1});
  const catName = typeof cat === "number" ? DATA.cats[cat] : cat;
  const dn = id < 0 ? name : friendly(id, name, catName);
  const f = {id, name, dn, kcal, c, p, fat, fib, cat: catName, measures, w: [...new Set(words(dn).concat(words(name)))],
    ibge: ms.length > 0, common: COMMON.has(id), own: id < 0};
  if (FOODS.has(id)) FOOD_LIST.splice(FOOD_LIST.indexOf(FOODS.get(id)), 1);
  FOODS.set(id, f); FOOD_LIST.push(f);
  return f;
}
for (const raw of DATA.foods) if (!NO_DATA.has(raw[0])) addFood(raw);

/* ---------- estado e armazenamento ---------- */
const KEY = "nutripratico.v1";
const DEFAULT_OBJ = ["Emagrecimento", "Hipertrofia muscular", "Manutenção do peso", "Ganho de peso", "Recomposição corporal",
  "Performance esportiva", "Controle glicêmico", "Saúde intestinal", "Reeducação alimentar", "Gestação", "Lactação"];
const DEFAULT_MEALS = ["Café da manhã", "Colação", "Almoço", "Lanche da tarde 1", "Lanche da tarde 2", "Pré-treino", "Pós-treino", "Jantar", "Ceia"];
let S;
function blankState(){ return {patients: [], foods: [], prefs: {objectives: DEFAULT_OBJ.slice(), meals: DEFAULT_MEALS.slice(), use: {}, last: {}}}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
  if (!S) { S = blankState(); seed(); }
  S.foods = S.foods || [];
  for (const raw of S.foods) addFood(raw);
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 250);
}
function touch(p){ p.updated = Date.now(); save(); }

function seed(){
  const it = (foodId, measure, qty) => ({id: uid(), foodId, measure, qty});
  S.patients.push({
    id: uid(), name: "Ana Exemplo", birth: "1992-03-14", sex: "F", example: true, updated: Date.now(),
    energy: {weight: 62, height: 165, fao: 1, dri: 1},
    plan: {objective: "Emagrecimento", target: null, meals: [
      {id: uid(), name: "Café da manhã", items: [it(53, "Unidade", 1), it(488, "Unidade", 2), it(226, "Fatia", 1), it(471, "Xícara de café", 1)]},
      {id: uid(), name: "Almoço", items: [it(3, "Colher de arroz/servir", 3), it(561, "Concha", 1), it(410, "Filé", 1), it(78, "Folha", 4), it(260, "Colher de chá", 1)]}
    ]}
  });
}

/* ---------- cálculos de necessidade energética ---------- */
function ageOf(birth){
  if (!birth) return null;
  const b = new Date(birth + "T12:00:00"), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}
const FAO_LV = ["Muito leve", "Leve", "Moderado", "Intenso"];
const FAO_FA = {M: [1.30, 1.55, 1.78, 2.10], F: [1.30, 1.56, 1.64, 1.82]};
function faoTMB(sex, age, W){
  const T = sex === "M"
    ? [[3, 60.9, -54], [10, 22.7, 495], [18, 17.5, 651], [30, 15.3, 679], [60, 11.6, 879], [999, 13.5, 487]]
    : [[3, 61.0, -51], [10, 22.5, 499], [18, 12.2, 746], [30, 14.7, 496], [60, 8.7, 829], [999, 10.5, 596]];
  const r = T.find(r => age < r[0]);
  const range = age < 3 ? "0–3" : age < 10 ? "3–10" : age < 18 ? "10–18" : age < 30 ? "18–30" : age < 60 ? "30–60" : "> 60";
  return {v: r[1] * W + r[2], eq: `${nf1.format(r[1])} × P ${r[2] < 0 ? "−" : "+"} ${Math.abs(r[2])}  (${range} anos)`};
}
const DRI_LV = ["Sedentário", "Pouco ativo", "Ativo", "Muito ativo"];
function driCalc(sex, age, W, Hcm, lv){
  const H = Hcm / 100;
  if (age >= 19){
    const PA = sex === "M" ? [1.00, 1.11, 1.25, 1.48][lv] : [1.00, 1.12, 1.27, 1.45][lv];
    const get = sex === "M" ? 662 - 9.53 * age + PA * (15.91 * W + 539.6 * H) : 354 - 6.91 * age + PA * (9.36 * W + 726 * H);
    const tmb = sex === "M" ? 293 - 3.8 * age + 456.4 * H + 10.12 * W : 247 - 2.67 * age + 401.5 * H + 8.60 * W;
    const eq = sex === "M" ? "662 − 9,53·I + AF·(15,91·P + 539,6·A)" : "354 − 6,91·I + AF·(9,36·P + 726·A)";
    return {get, tmb, PA, eq};
  }
  if (age >= 3){
    const PA = sex === "M" ? [1.00, 1.13, 1.26, 1.42][lv] : [1.00, 1.16, 1.31, 1.56][lv];
    const dep = age <= 8 ? 20 : 25;
    const get = sex === "M" ? 88.5 - 61.9 * age + PA * (26.7 * W + 903 * H) + dep : 135.3 - 30.8 * age + PA * (10.0 * W + 934 * H) + dep;
    const tmb = sex === "M" ? 68 - 43.3 * age + 712 * H + 19.2 * W : 189 - 17.6 * age + 625 * H + 7.9 * W;
    const eq = (sex === "M" ? "88,5 − 61,9·I + AF·(26,7·P + 903·A)" : "135,3 − 30,8·I + AF·(10·P + 934·A)") + ` + ${dep}`;
    return {get, tmb, PA, eq};
  }
  return null;
}
function energyOf(p){
  const e = p.energy || {}, age = ageOf(p.birth), W = e.weight, Hc = e.height;
  if (!(W > 1 && W < 400 && Hc > 40 && Hc < 260) || age == null) return {ok: false, age};
  const f = faoTMB(p.sex, age, W);
  const fa = FAO_FA[p.sex][e.fao ?? 1];
  const fao = {tmb: f.v, fa, get: f.v * fa, eq: f.eq};
  const dri = driCalc(p.sex, age, W, Hc, e.dri ?? 1);
  const tmb = dri ? (fao.tmb + dri.tmb) / 2 : fao.tmb;
  const get = dri ? (fao.get + dri.get) / 2 : fao.get;
  return {ok: true, age, fao, dri, tmb, get, imc: W / Math.pow(Hc / 100, 2)};
}

/* ---------- cálculos do plano ---------- */
function measureOf(f, label){ return f.measures.find(m => m.l === label) || f.measures[0]; }
function calcItem(it){
  const f = FOODS.get(it.foodId);
  if (!f || !it.qty) return null;
  const m = measureOf(f, it.measure), g = m.g * it.qty, k = g / 100;
  return {g, kcal: f.kcal * k, c: f.c * k, p: f.p * k, l: f.fat * k, f: (f.fib || 0) * k};
}
function sum(list){
  const t = {g: 0, kcal: 0, c: 0, p: 0, l: 0, f: 0};
  for (const r of list) if (r) for (const k in t) t[k] += r[k];
  return t;
}
const mealTotal = m => sum(m.items.map(calcItem));
const planTotal = pl => sum(pl.meals.map(mealTotal));

/* ---------- busca de alimentos ---------- */
function searchFoods(q){
  const qt = words(q), use = S.prefs.use;
  if (!qt.length){
    return Object.entries(use).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => FOODS.get(+id)).filter(Boolean);
  }
  const res = [];
  for (const f of FOOD_LIST){
    let score = 0, ok = true;
    for (let i = 0; i < qt.length; i++){
      const t = qt[i];
      const wi = f.w.findIndex(w => w.startsWith(t) || (t.length > 3 && w.length >= 3 && t.startsWith(w)));
      if (wi < 0) { ok = false; break; }
      if (i === 0 && wi === 0) score += 40;
      if (wi === i) score += 6;
      if (f.w[wi] === t) score += 4;
    }
    if (!ok) continue;
    score += Math.min(use[f.id] || 0, 40) * 5;
    if (f.ibge) score += 3;
    if (f.common) score += 14;
    if (f.own) score += 10;
    score -= f.dn.length * 0.12;
    res.push([score, f]);
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 8).map(r => r[1]);
}

/* ---------- autocompletar ---------- */
function autocomplete(input, o){
  const list = h("div", {class: "ac", role: "listbox"}); list.hidden = true;
  input.parentElement.append(list);
  input.setAttribute("autocomplete", "off"); input.setAttribute("autocorrect", "off"); input.setAttribute("spellcheck", "false");
  let items = [], active = 0, nav = false, pend = -1;
  function render(){
    items = o.items(input.value);
    if (!items.length || document.activeElement !== input) { list.hidden = true; return; }
    active = Math.min(active, items.length - 1);
    const kids = [];
    if (o.title && o.title(input.value)) kids.push(h("div", {class: "ac-sec"}, o.title(input.value)));
    items.forEach((it, i) => {
      const el = h("div", {class: "ac-item" + (i === active ? " on" : "") + (i === pend ? " pend" : ""), role: "option"},
        h("span", {class: "ac-l", html: i === pend ? `Remover “${esc(it.label)}” da lista?` : highlight(it.label, o.hl === false ? "" : input.value)}),
        it.meta ? h("span", {class: "ac-m"}, it.meta) : null,
        it.removable ? h("button", {class: "ac-x", type: "button", "aria-label": i === pend ? "Confirmar remoção" : "Remover opção da lista", title: "Remover da lista"}, i === pend ? "Remover" : "×") : null);
      el.addEventListener("mousedown", e => e.preventDefault());
      el.addEventListener("click", e => {
        if (e.target.closest(".ac-x")) {
          if (pend === i) { pend = -1; o.onRemove(it); } else pend = i;
          render(); return;
        }
        if (pend === i) { pend = -1; render(); return; }
        pick(i);
      });
      kids.push(el);
    });
    list.replaceChildren(...kids);
    list.hidden = false;
  }
  function pick(i){ const it = items[i]; if (!it) return; list.hidden = true; o.onPick(it); }
  input.addEventListener("input", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("focus", () => { active = 0; nav = false; pend = -1; render(); });
  input.addEventListener("blur", () => { list.hidden = true; o.onBlur && o.onBlur(); });
  input.addEventListener("keydown", e => {
    const open = !list.hidden && items.length;
    if (e.key === "ArrowDown" && open) { e.preventDefault(); nav = true; active = (active + 1) % items.length; render(); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); nav = true; active = (active - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey && open && o.tabPicks)) {
      if (e.isComposing) return;
      if (open && (nav || (o.enterPicks ? o.enterPicks(input.value) : true))) { e.preventDefault(); pick(active); }
      else if (o.onEnter) { e.preventDefault(); list.hidden = true; o.onEnter(); }
    }
    else if (e.key === "Escape") list.hidden = true;
  });
  return {close(){ list.hidden = true; }};
}

/* Lista de opções editável (objetivos, nomes de refeição) */
function optionSource(key){
  return q => {
    const opts = S.prefs[key], qn = norm(q.trim());
    const exact = opts.some(o => norm(o) === qn);
    const qt = words(q);
    const list = (!qt.length || exact) ? opts : opts.filter(o => { const w = words(o); return qt.every(t => w.some(x => x.startsWith(t))); });
    return list.map(o => ({label: o, value: o, removable: true}));
  };
}
function rememberOption(key, v){
  v = (v || "").trim(); if (!v) return;
  if (!S.prefs[key].some(o => norm(o) === norm(v))) { S.prefs[key].push(v); save(); }
}

function dataCard(){

function backupSheet(){
  const scrim = h("div", {class: "scrim"});
  const status = h("div", {class: "err", style: "color:var(--muted)"});
  const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});
  const confirmBox = h("div");
  const last = S.lastBackup ? `Último backup: ${new Date(S.lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda.";
  async function exportNow(){
    const stamp = new Date().toISOString().slice(0, 10);
    const json = backupText();
    const name = `nutri-pratico-backup-${stamp}.json`;
    const blob = new Blob([json], {type: "application/json"});
    const done = () => { S.lastBackup = Date.now(); save(); status.textContent = "Backup gerado. Guarde o arquivo em Arquivos, iCloud ou e-mail."; };
    try {
      const f = new File([blob], name, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: "Backup Nutri Prático"}); done(); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); done();
    } catch (e) { status.textContent = "Não foi possível gerar o arquivo neste navegador."; }
  }
  const embedded = window.self !== window.top;   // dentro do Claude não dá para baixar arquivos
  const backupText = () => JSON.stringify({app: "nutri-pratico", version: 1, exported: new Date().toISOString(), data: S});
  function copyNow(){
    const txt = backupText();
    const ok = () => { S.lastBackup = Date.now(); save(); status.textContent = "Backup copiado. Agora abra o app instalado e use “Colar backup”."; };
    const fallback = () => {
      const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
      try { document.execCommand("copy") ? ok() : (status.textContent = "Não foi possível copiar."); } catch (e) { status.textContent = "Não foi possível copiar."; }
      ta.remove();
    };
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
  }
  const pasteArea = h("textarea", {class: "input", id: "bk-colar", rows: "4", placeholder: "Toque aqui, segure e escolha Colar", style: "height:auto;padding:12px 14px;font-size:16px;resize:vertical"});
  const pasteBox = h("div", {class: "bk-row"}, pasteArea,
    h("button", {class: "btn primary block", type: "button", onclick: () => offerRestore(pasteArea.value)}, "Continuar"));
  pasteBox.hidden = true;
  file.addEventListener("change", () => {
    const f = file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => offerRestore(rd.result);
    rd.readAsText(f); file.value = "";
  });
  function offerRestore(text){
    {
      let b; try { b = JSON.parse(String(text).trim()); } catch (e) {}
      const d = b && b.data;
      if (!d || !Array.isArray(d.patients) || !d.prefs) { status.textContent = "Esse arquivo não é um backup do Nutri Prático."; return; }
      confirmBox.replaceChildren(h("div", {class: "confirm", style: "flex-wrap:wrap"},
        h("span", {style: "flex:1 1 100%"}, `Substituir ${pl(S.patients.length)} deste aparelho por ${pl(d.patients.length)} do backup de ${new Date(b.exported).toLocaleDateString("pt-BR")}?`),
        h("button", {class: "btn ghost", type: "button", style: "flex:1", onclick: () => confirmBox.replaceChildren()}, "Cancelar"),
        h("button", {class: "btn primary", type: "button", style: "flex:1", onclick: () => {
          S = d; S.foods = S.foods || []; for (const raw of S.foods) addFood(raw);
          try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
          close(); go({name: "home", id: null}); toast("Backup restaurado");
        }}, "Restaurar")));
    }
  }
  const form = h("div", {class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Backup"},
    h("div", {class: "grab"}),
    h("h2", null, "Backup"),
    h("div", {class: "bk-meta"}, last),
    h("div", {class: "bk-row"},
      embedded ? null : h("button", {class: "btn primary block", type: "button", onclick: exportNow}, "Exportar backup (arquivo)"),
      h("button", {class: embedded ? "btn primary block" : "btn ghost block", type: "button", onclick: copyNow}, "Copiar backup"),
      h("div", {class: "eyebrow", style: "margin-top:8px"}, "Restaurar"),
      h("button", {class: "btn ghost block", type: "button", onclick: () => { pasteBox.hidden = false; pasteArea.focus(); }}, "Colar backup"),
      embedded ? null : h("button", {class: "btn ghost block", type: "button", onclick: () => file.click()}, "Restaurar de um arquivo"),
      pasteBox, file, status, confirmBox,
      h("button", {class: "btn ghost block", type: "button", onclick: close}, "Fechar")));
  function close(){ form.classList.remove("on"); scrim.classList.remove("on"); setTimeout(() => { form.remove(); scrim.remove(); }, 260); }
  scrim.addEventListener("click", close);
  document.body.append(scrim, form);
  requestAnimationFrame(() => { scrim.classList.add("on"); form.classList.add("on"); });

/* ---------- Cadastro / edição de paciente ---------- */
function maskDate(v){
  const d = v.replace(/\D/g, "").slice(0, 8);
  return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
}
function toISO(br){
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if (dt > new Date() || y < 1900) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
const fromISO = iso => iso ? iso.split("-").reverse().join("/") : "";

  const W = h("input", {class: "input", id: "peso", inputmode: "decimal", placeholder: "0", value: e.weight ? fq.format(e.weight) : "", "aria-label": "Peso em kg", enterkeyhint: "next"});
  const H = h("input", {class: "input", id: "altura", inputmode: "decimal", placeholder: "0", value: e.height ? fq.format(e.height) : "", "aria-label": "Altura em cm", enterkeyhint: "done"});
  const out = h("div", {class: "stack"});
  const num = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v : null; };
  W.addEventListener("input", () => { e.weight = num(W.value); touch(p); paint(); });
  H.addEventListener("input", () => {
    let v = num(H.value);
    if (v != null && v < 3) v = v * 100;  // aceita altura em metros (1,65)
    e.height = v; touch(p); paint();
  });
  W.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); H.focus(); } });
  H.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); H.blur(); } });

  function segOf(labels, key){
    const seg = h("div", {class: "seg seg4", role: "radiogroup"});
    const paintSeg = () => seg.replaceChildren(...labels.map((l, i) => h("button", {class: (e[key] ?? 1) === i ? "on" : "", role: "radio", "aria-checked": String((e[key] ?? 1) === i),
      onclick: () => { e[key] = i; touch(p); paintSeg(); paint(); }}, l)));
    paintSeg(); return seg;
  }
  const faoSeg = segOf(FAO_LV, "fao"), driSeg = segOf(DRI_LV, "dri");
  const faoRes = h("div"), driRes = h("div"), hero = h("div");

  function resGrid(tmb, fator, fl, get){
    return h("div", {class: "res"},
      h("div", null, h("div", {class: "k"}, "TMB"), h("div", {class: "v"}, tmb == null ? "—" : k0(tmb))),
      h("div", null, h("div", {class: "k"}, fl), h("div", {class: "v"}, fator == null ? "—" : nf2.format(fator))),
      h("div", null, h("div", {class: "k"}, "GET"), h("div", {class: "v acc"}, get == null ? "—" : k0(get))));
  }
  function paint(){
    const r = energyOf(p);
    if (!r.ok){
      hero.replaceChildren(h("div", {class: "card hero"}, h("div", {class: "eyebrow"}, "Média dos protocolos"),
        h("div", {class: "hero-grid"},
          h("div", null, h("div", {class: "lbl"}, "TMB"), h("div", {class: "big"}, "—")),
          h("div", null, h("div", {class: "lbl"}, "GET"), h("div", {class: "big gold"}, "—"))),
        h("div", {class: "hero-foot"}, "Informe peso e altura para calcular")));
      useBtn.disabled = true; useBtn.textContent = "Usar GET no plano alimentar";
      faoRes.replaceChildren(resGrid(null, FAO_FA[p.sex][e.fao ?? 1], "FA", null));
      driRes.replaceChildren(resGrid(null, null, "AF", null));
      return;
    }
    hero.replaceChildren(h("div", {class: "card hero"},
      h("div", {class: "eyebrow"}, r.dri ? "Média FAO/OMS 1985 + DRI 2005" : "FAO/OMS 1985"),
      h("div", {class: "hero-grid"},
        h("div", null, h("div", {class: "lbl"}, "TMB"), h("div", {class: "big"}, k0(r.tmb), h("small", null, "kcal"))),
        h("div", null, h("div", {class: "lbl"}, "GET"), h("div", {class: "big gold"}, k0(r.get), h("small", null, "kcal")))),
      h("div", {class: "hero-foot"},
        h("span", null, `IMC ${g1(r.imc)}`),
        h("span", null, `${ageLabel(r.age)}`),
        h("span", null, `${fq.format(e.weight)} kg · ${fq.format(e.height)} cm`))));
    put(faoRes, resGrid(r.fao.tmb, r.fao.fa, "FA", r.fao.get),
      h("div", {class: "eq"}, `TMB = ${r.fao.eq}`, h("br"), `GET = TMB × ${nf2.format(r.fao.fa)}`),
      r.age < 18 ? h("div", {class: "note warn"}, "Os fatores de atividade FAO/OMS 1985 foram definidos para adultos.") : null);
    put(driRes, r.dri
      ? [resGrid(r.dri.tmb, r.dri.PA, "AF", r.dri.get),
         h("div", {class: "eq"}, `GET (EER) = ${r.dri.eq}`, h("br"), "I = idade · P = kg · A = m · TMB (BEE) pela DRI 2005")]
      : [resGrid(null, null, "AF", null), h("div", {class: "note warn"}, "As equações DRI 2005 aqui cobrem pacientes a partir de 3 anos.")]);
    useBtn.textContent = `Usar ${k0(r.get)} kcal no plano alimentar`;
    useBtn.disabled = false;
  }
  const useBtn = h("button", {class: "btn primary block", disabled: true, onclick: () => {
    const r = energyOf(p); if (!r.ok) return;
    p.plan.target = Math.round(r.get); touch(p); go({tab: "plan"}); toast(`Meta de ${k0(r.get)} kcal definida`);
  }}, "Usar GET no plano alimentar");

  body.append(h("div", {class: "stack"},
    hero,
    h("div", {class: "card"},
      h("div", {class: "measures"},
        h("div", {class: "field", style: "margin:0"}, h("label", {for: "peso"}, "Peso"), h("div", {class: "mfield"}, W, h("span", null, "kg"))),
        h("div", {class: "field", style: "margin:0"}, h("label", {for: "altura"}, "Altura"), h("div", {class: "mfield"}, H, h("span", null, "cm")))),
      h("div", {class: "facts"}, h("span", null, "Idade ", h("b", null, ageLabel(ageOf(p.birth)))), h("span", null, "Gênero ", h("b", null, sexLabel(p.sex))))),
    h("div", {class: "card"},
      h("div", {class: "card-h"}, h("div", {class: "card-t"}, "FAO/OMS 1985"), h("div", {class: "eyebrow"}, "Nível de atividade")),
      faoSeg, faoRes),
    h("div", {class: "card"},
      h("div", {class: "card-h"}, h("div", {class: "card-t"}, "DRI 2005"), h("div", {class: "eyebrow"}, "Nível de atividade física")),
      driSeg, driRes),
    useBtn));
  paint();
  if (!e.weight) setTimeout(() => W.focus(), 60);
}

/* ---------- Plano alimentar ---------- */
function renderPlan(p, body, mini){
  const plan = p.plan;
  const r = energyOf(p);
  const target = () => plan.target || (r.ok ? Math.round(r.get) : null);
  const W = () => p.energy.weight;

  /* objetivo */
  const obj = h("input", {class: "input", id: "objetivo", placeholder: "Objetivo", value: plan.objective || "", enterkeyhint: "next", "aria-label": "Objetivo"});
  const objW = h("div", {class: "acw"}, obj);
  autocomplete(obj, {
    items: optionSource("objectives"),
    onPick: it => { obj.value = it.value; plan.objective = it.value; touch(p); focusFirstSlot(); },
    onRemove: it => { S.prefs.objectives = S.prefs.objectives.filter(o => o !== it.value); save(); },
    enterPicks: v => !!v.trim() && !S.prefs.objectives.some(o => norm(o) === norm(v.trim())) && optionSource("objectives")(v).length > 0,
    onEnter: () => { plan.objective = obj.value.trim(); rememberOption("objectives", plan.objective); touch(p); focusFirstSlot(); }
  });
  obj.addEventListener("input", () => { plan.objective = obj.value; touch(p); });
  obj.addEventListener("change", () => rememberOption("objectives", obj.value));

  const tgt = h("input", {class: "input num", id: "meta", inputmode: "numeric", placeholder: r.ok ? k0(r.get) : "kcal", value: plan.target ? String(plan.target) : "", "aria-label": "Meta de kcal"});
  tgt.addEventListener("input", () => { const v = parseInt(tgt.value.replace(/\D/g, ""), 10); plan.target = v > 0 ? v : null; touch(p); updateTotals(); });

  const mealsEl = h("div", {class: "meals"});
  const totCard = h("section", {class: "card tot", "aria-label": "Total do plano"});
  const pasteNew = h("div");
  const refs = new Map();   // id da refeição -> {card, kcalEl, footEl, askEl} / id do item -> {row, food, qty}

  function focusFirstSlot(){
    if (!plan.meals.length) { addMeal(true); return; }
    const m = plan.meals.find(x => !x.name.trim()) || plan.meals[plan.meals.length - 1];
    const R = refs.get(m.id);
    if (!m.name.trim() && R) R.card.querySelector(".meal-name").focus();
    else refs.get(m.items[m.items.length - 1].id)?.food.focus();
  }

  function nextMealName(){
    const used = new Set(plan.meals.map(m => norm(m.name)));
    return DEFAULT_MEALS.find(n => !used.has(norm(n))) || "";
  }
  function addMeal(focus, items){
    const m = {id: uid(), name: "", time: "", items: items || []};
    plan.meals.push(m); ensureBlank(m); touch(p);
    const el = buildMeal(m); mealsEl.append(el);
    if (focus) { const nm = el.querySelector(".meal-name"); nm.focus(); el.scrollIntoView({block: "start", behavior: "smooth"}); }
    updateTotals();
    return m;
  }
  function ensureBlank(m){
    const last = m.items[m.items.length - 1];
    if (!last || last.foodId) m.items.push({id: uid(), foodId: null, measure: null, qty: null});
  }

  /* ---- copiar e colar refeição (a cópia vale também para outros pacientes) ---- */
  const clip = () => S.prefs.clip;
  const filled = m => m.items.filter(i => i.foodId && i.qty);
  const clipLabel = () => { const c = clip(); return c ? `${c.name || "Refeição"} · ${c.items.length} ${c.items.length === 1 ? "alimento" : "alimentos"}` : ""; };
  function copyMeal(m){
    S.prefs.clip = {name: m.name.trim(), items: filled(m).map(i => ({foodId: i.foodId, measure: i.measure, qty: i.qty}))};
    save(); paintPasteNew(); toast(`${m.name.trim() || "Refeição"} copiada`);
  }
  const clipItems = () => clip().items.filter(i => FOODS.has(i.foodId)).map(i => ({id: uid(), foodId: i.foodId, measure: i.measure, qty: i.qty}));
  function pasteInto(m, mode){
    const keep = mode === "add" ? filled(m) : [];
    m.items = keep.concat(clipItems()); ensureBlank(m); touch(p);
    const old = refs.get(m.id).card, el = buildMeal(m);
    old.replaceWith(el); updateTotals(); toast("Refeição colada");
  }
  function askPaste(m){
    const R = refs.get(m.id);
    if (!filled(m).length) { pasteInto(m, "replace"); return; }
    ask(R.askEl, `${m.name.trim() || "Esta refeição"} já tem ${filled(m).length} ${filled(m).length === 1 ? "alimento" : "alimentos"}. Colar ${clip().name || "a refeição copiada"}:`, [
      {label: "Somar", cls: "ghost", fn: () => pasteInto(m, "add")},
      {label: "Substituir", cls: "primary", fn: () => pasteInto(m, "replace")}]);
  }
  function paintPasteNew(){
    put(pasteNew, clip() && clip().items.length ? h("button", {class: "paste-new", type: "button", onclick: () => {
      const m = addMeal(true, clipItems()); toast("Refeição colada");
    }}, h("span", {html: ICON.copy, style: "display:contents"}), h("span", null, "Colar como nova refeição", h("small", null, clipLabel()))) : null);
  }
  function mealMenu(m){
    actionSheet(m.name.trim() || "Refeição", filled(m).length ? `${filled(m).length} ${filled(m).length === 1 ? "alimento" : "alimentos"} · ${k0(mealTotal(m).kcal)} kcal` : "Sem alimentos", [
      filled(m).length ? {label: "Copiar refeição", cls: "primary", fn: () => copyMeal(m)} : null,
      clip() && clip().items.length ? {label: `Colar aqui: ${clipLabel()}`, cls: filled(m).length ? "ghost" : "primary", fn: () => askPaste(m)} : null,
      {label: "Excluir refeição", cls: "danger", fn: () => {
        const R = refs.get(m.id);
        ask(R.askEl, `Excluir ${m.name.trim() ? "“" + m.name.trim() + "”" : "esta refeição"} e todos os alimentos dela?`, [{label: "Excluir", fn: () => {
          plan.meals = plan.meals.filter(x => x !== m); touch(p); R.card.remove(); refs.delete(m.id); updateTotals();
        }}]);
      }}]);
  }

  function buildMeal(m){
    /* horário: toque abre a roda de horas do iPhone */
    const time = h("input", {class: "meal-time", type: "time", value: m.time || "", "aria-label": "Horário da refeição"});
    const tw = h("label", {class: "tw" + (m.time ? " has" : ""), title: "Horário"}, h("span", {html: ICON.clock + "Horário"}), time);
    const setTime = () => { m.time = time.value || ""; tw.classList.toggle("has", !!m.time); touch(p); };
    time.addEventListener("input", setTime); time.addEventListener("change", setTime); time.addEventListener("blur", setTime);
    const name = h("input", {class: "meal-name", placeholder: nextMealName() || "Nome da refeição", value: m.name, enterkeyhint: "next", "aria-label": "Nome da refeição"});
    const nameW = h("div", {class: "acw"}, name);
    const kcalEl = h("div", {class: "meal-kcal"});
    const askEl = h("div", {class: "meal-ask"});
    const rowsEl = h("div", {class: "rows"});
    const footEl = h("div", {class: "meal-foot"});
    const card = h("section", {class: "card meal"});
    const firstFood = () => refs.get(m.items[0].id).food.focus();
    autocomplete(name, {
      items: optionSource("meals"),
      onPick: it => { name.value = it.value; m.name = it.value; touch(p); fitName(name); paintMealSum(m); firstFood(); },
      onRemove: it => { S.prefs.meals = S.prefs.meals.filter(o => o !== it.value); save(); },
      enterPicks: v => !!v.trim() && !S.prefs.meals.some(o => norm(o) === norm(v.trim())) && optionSource("meals")(v).length > 0,
      onEnter: () => {
        if (!name.value.trim() && name.placeholder && name.placeholder !== "Nome da refeição") name.value = name.placeholder;
        m.name = name.value.trim(); rememberOption("meals", m.name); touch(p); fitName(name); paintMealSum(m); firstFood();
      }
    });
    name.addEventListener("input", () => { m.name = name.value; touch(p); fitName(name); paintMealSum(m); });
    name.addEventListener("change", () => rememberOption("meals", name.value));
    requestAnimationFrame(() => fitName(name));
    const menu = h("button", {class: "x more", type: "button", "aria-label": "Ações da refeição: copiar, colar, excluir", title: "Copiar, colar ou excluir", html: ICON.more, onclick: () => mealMenu(m)});

    card.append(h("div", {class: "meal-h"}, nameW, tw, kcalEl, menu), askEl, rowsEl, footEl);
    refs.set(m.id, {card, kcalEl, footEl, askEl});
    for (const it of m.items) rowsEl.append(buildRow(m, it, rowsEl));
    paintMealSum(m);
    return card;
  }

  function buildRow(m, it, rowsEl){
    const row = h("div", {class: "item"});
    const food = h("input", {class: "food", placeholder: "Alimento", "aria-label": "Alimento", enterkeyhint: "next", autocapitalize: "off"});
    const foodW = h("div", {class: "acw"}, food);
    const qty = h("input", {class: "cell qty", inputmode: "decimal", "aria-label": "Quantidade da medida caseira", placeholder: "1", enterkeyhint: "next"});
    const meas = h("input", {class: "cell", "aria-label": "Medida caseira", enterkeyhint: "next", autocapitalize: "off"});
    const measW = h("div", {class: "acw meas"}, meas);
    const grams = h("div", {class: "grams"});
    const l3 = h("div", {class: "item-l3"});
    const askEl = h("div");
    const del = h("button", {class: "x", "aria-label": "Excluir alimento", title: "Excluir alimento", html: ICON.x});
    const quick = h("div", {class: "quick"});
    refs.set(it.id, {row, food, qty});

    function syncInputs(){
      const f = FOODS.get(it.foodId);
      row.classList.toggle("blank", !f);
      food.value = f ? f.dn : "";
      meas.value = f ? measureOf(f, it.measure).l : "";
      qty.value = fmtQty(it.qty);
      paintRow();
    }
    function paintRow(){
      const f = FOODS.get(it.foodId);
      if (!f) return;
      const c = calcItem(it), m1 = measureOf(f, it.measure);
      grams.textContent = c ? `${fq.format(Math.round(c.g * 10) / 10)} g` : `${fq.format(m1.g)} g/un`;
      put(l3,
        h("span", {class: "kc"}, c ? k0(c.kcal) : "—", h("small", null, " kcal")),
        h("span", null, h("b", {class: "t-c"}, "C"), c ? ` ${fmtG(c.c)} g` : " —"),
        h("span", null, h("b", {class: "t-p"}, "P"), c ? ` ${fmtG(c.p)} g` : " —"),
        h("span", null, h("b", {class: "t-g"}, "G"), c ? ` ${fmtG(c.l)} g` : " —"));
    }
    const refresh = () => { paintRow(); paintMealSum(m); updateTotals(); };


    /* alimento */
    autocomplete(food, {
      items: q => {
        if (FOODS.get(it.foodId) && q === FOODS.get(it.foodId).dn) return [];
        const list = searchFoods(q).map(f => ({label: f.dn, meta: f.own ? `próprio · ${f.kcal} kcal` : `${f.kcal} kcal`, value: f}));
        if (q.trim().length >= 2) list.push({label: `+ Cadastrar “${q.trim()}” como alimento próprio`, value: {create: q.trim()}});
        return list;
      },
      enterPicks: v => !!v.trim(),
      title: q => !words(q).length && Object.keys(S.prefs.use).length ? "Mais usados" : "",
      onPick: x => x.value.create ? foodSheet(x.value.create, f => setFood(f)) : setFood(x.value),
      onEnter: () => {
        if (!food.value.trim() && !it.foodId){ addMeal(true); return; }   // Enter em linha vazia: nova refeição
        if (it.foodId) { food.value = FOODS.get(it.foodId).dn; qty.focus(); }
      },
      onBlur: () => { const f = FOODS.get(it.foodId); if (f && food.value !== f.dn) food.value = f.dn; if (!f) food.value = ""; }
    });
    food.addEventListener("focus", () => { setTimeout(() => row.scrollIntoView({block: "start", behavior: "smooth"}), 30); });

    /* escolheu o alimento: medida mais provável já preenchida e foco direto no número */
    function setFood(f){
      const changed = it.foodId !== f.id;
      it.foodId = f.id;
      if (changed || !it.measure) it.measure = S.prefs.last[f.id] && f.measures.some(x => x.l === S.prefs.last[f.id]) ? S.prefs.last[f.id] : f.measures[0].l;
      touch(p); syncInputs();
      ensureBlank(m);
      const last = m.items[m.items.length - 1];
      if (!refs.has(last.id)) rowsEl.append(buildRow(m, last, rowsEl));
      qty.focus(); qty.select();
      paintMealSum(m); updateTotals();
    }

    /* medida caseira */
    autocomplete(meas, {
      items: q => {
        const f = FOODS.get(it.foodId); if (!f) return [];
        const cur = measureOf(f, it.measure).l;
        const qt = words(q);
        const all = (q === cur || !qt.length) ? f.measures : f.measures.filter(m1 => { const w = words(m1.l); return qt.every(t => w.some(x => x.startsWith(t))); });
        return all.map(m1 => ({label: m1.l, meta: `${fq.format(m1.g)} g`, value: m1}));
      },
      onPick: x => { it.measure = x.value.l; meas.value = x.value.l; touch(p); refresh(); qty.focus(); qty.select(); },
      onBlur: () => { const f = FOODS.get(it.foodId); if (f) meas.value = measureOf(f, it.measure).l; }
    });
    meas.addEventListener("focus", () => setTimeout(() => { if (document.activeElement === meas) meas.select(); }, 0));

    /* número da medida: um toque num atalho conclui o alimento e já vai para o próximo */
    qty.addEventListener("input", () => { it.qty = parseQty(qty.value); touch(p); refresh(); });
    qty.addEventListener("focus", () => { row.classList.add("qfocus"); setTimeout(() => { if (document.activeElement === qty) qty.select(); }, 0); });
    qty.addEventListener("blur", () => { row.classList.remove("qfocus"); qty.value = fmtQty(it.qty); });
    qty.addEventListener("keydown", e => { if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); commit(); } });
    for (const [lbl, v] of [["¼", .25], ["½", .5], ["¾", .75], ["1", 1], ["1½", 1.5], ["2", 2], ["3", 3], ["4", 4], ["5", 5]]){
      const b = h("button", {type: "button"}, lbl);
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("click", () => { it.qty = v; qty.value = fmtQty(v); commit(); });
      quick.append(b);
    }
    const nx = h("button", {type: "button", class: "next"}, "Próximo ↵");
    nx.addEventListener("mousedown", e => e.preventDefault());
    nx.addEventListener("click", commit);
    quick.append(nx);

    function commit(){
      if (!it.qty) { it.qty = 1; qty.value = "1"; }
      S.prefs.use[it.foodId] = (S.prefs.use[it.foodId] || 0) + 1;
      S.prefs.last[it.foodId] = it.measure;
      touch(p); refresh();
      const idx = m.items.indexOf(it);
      ensureBlank(m);
      const nxt = m.items[idx + 1];
      if (!refs.has(nxt.id)) rowsEl.append(buildRow(m, nxt, rowsEl));
      refs.get(nxt.id).food.focus();
    }

    del.addEventListener("click", () => {
      const f = FOODS.get(it.foodId);
      ask(askEl, `Excluir ${f ? f.dn : "este alimento"}?`, [{label: "Excluir", fn: () => {
        m.items = m.items.filter(x => x !== it); refs.delete(it.id); row.remove();
        ensureBlank(m); touch(p); paintMealSum(m); updateTotals();
      }}]);
    });

    row.append(
      h("div", {class: "item-l1"}, foodW, del),
      h("div", {class: "item-l2"}, qty, measW, grams),
      l3, quick, askEl);
    syncInputs();
    return row;
  }

  function paintMealSum(m){
    const R = refs.get(m.id); if (!R) return;
    const t = mealTotal(m);
    R.kcalEl.replaceChildren(k0(t.kcal), h("small", null, "kcal"));
    R.footEl.hidden = !t.kcal;
    put(R.footEl, h("div", {class: "eyebrow"}, totalOf(m.name)), macroGrid(t, W(), true));
  }

  /* total do plano logo abaixo do objetivo, e uma faixa fina fixa quando ele sai da tela */
  function updateTotals(){
    const t = planTotal(plan), tg = target();
    const pct = tg ? Math.round(t.kcal / tg * 100) : null;
    put(totCard,
      h("div", {class: "eyebrow"}, "Total do plano"),
      h("div", {class: "tot-top"},
        h("div", {class: "tot-kcal"}, h("b", null, k0(t.kcal)), h("span", null, tg ? `de ${k0(tg)} kcal` : "kcal")),
        h("span", {class: "pill"}, pct != null ? `${pct}% da meta` : "Sem meta")),
      macroGrid(t, W(), false));
    put(mini,
      h("div", {class: "mini-k"}, h("b", null, k0(t.kcal)), h("span", null, " kcal"), pct != null ? h("i", null, `${pct}%`) : null),
      h("div", {class: "mini-m"},
        h("span", null, h("b", {class: "t-c"}, "C"), ` ${fmtG(t.c)}g`),
        h("span", null, h("b", {class: "t-p"}, "P"), ` ${fmtG(t.p)}g`),
        h("span", null, h("b", {class: "t-g"}, "G"), ` ${fmtG(t.l)}g`)));
  }
  mini.hidden = false; mini.classList.add("off");
  if ("IntersectionObserver" in window){
    new IntersectionObserver(([e]) => { mini.classList.toggle("off", e.isIntersecting || e.boundingClientRect.top > 0); },
      {rootMargin: "-150px 0px 0px 0px"}).observe(totCard);
  }

  /* copiar plano como texto */
  function copyPlan(){
    const lines = [`PLANO ALIMENTAR · ${p.name}`];
    if (plan.objective) lines.push(`Objetivo: ${plan.objective}`);
    for (const m of plan.meals){
      const its = filled(m);
      if (!its.length) continue;
      lines.push("", `${m.time ? m.time + " · " : ""}${(m.name || "Refeição").toUpperCase()} (${k0(mealTotal(m).kcal)} kcal)`);
      for (const i of its){
        const f = FOODS.get(i.foodId), ms = measureOf(f, i.measure), c = calcItem(i);
        lines.push(ms.l === "Grama" ? `• ${f.dn}: ${fq.format(i.qty)} g` : `• ${f.dn}: ${fmtQty(i.qty)} ${ms.l.toLowerCase()} (${fq.format(Math.round(c.g))} g)`);
      }
    }
    const t = planTotal(plan);
    lines.push("", `Total: ${k0(t.kcal)} kcal · CHO ${fmtG(t.c)} g · PTN ${fmtG(t.p)} g · LIP ${fmtG(t.l)} g · Fibras ${fmtG(t.f)} g`);
    const text = lines.join("\n");
    const done = () => toast("Plano copiado");
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback(text));
    } catch (e) { fallback(text); }
    function fallback(txt){
      const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("Não foi possível copiar"); }
      ta.remove();
    }
  }

  for (const m of plan.meals) { ensureBlank(m); mealsEl.append(buildMeal(m)); }
  paintPasteNew();
  body.append(h("div", {class: "stack"},
    h("div", {class: "plan-head"},
      h("div", {class: "field", style: "margin:0"}, h("label", {for: "objetivo"}, "Objetivo"), objW),
      h("div", {class: "field", style: "margin:0"}, h("label", {for: "meta"}, "Meta (kcal)"), tgt)),
    totCard,
    h("div", {style: "height:4px"}),
    mealsEl,
    h("div", {class: "add-row"}, h("button", {class: "add-meal", onclick: () => addMeal(true)}, h("span", {html: ICON.plus, style: "display:contents"}), "Adicionar refeição"), pasteNew),
    h("div", {class: "plan-tools"}, h("button", {class: "btn ghost", onclick: copyPlan}, "Copiar plano em texto")),
    h("p", {class: "src"}, "Composição: TACO 4ª ed. (NEPA/UNICAMP, 2011). Medidas caseiras: POF 2008–2009, Tabela de Medidas Referidas (IBGE). Atalhos: Enter escolhe o alimento e avança; Enter numa linha vazia cria a próxima refeição. Use ⋯ na refeição para copiar e colar.")));
  updateTotals();
  if (!plan.meals.length) addMeal(false);
}

/* Ajusta a largura do nome da refeição ao texto, para o horário ficar colado nele */
function fitName(input){
  let ruler = input.parentElement.querySelector(".ruler");
  if (!ruler) { ruler = h("span", {class: "meal-name ruler", "aria-hidden": "true"}); input.parentElement.append(ruler); }
  ruler.textContent = input.value || input.placeholder;
  input.style.width = Math.ceil(ruler.getBoundingClientRect().width + 2) + "px";
}
if (document.fonts) document.fonts.ready.then(() => document.querySelectorAll(".meal-name").forEach(fitName));

/* Gramas: uma casa decimal abaixo de 10 g, inteiro a partir disso */
const fmtG = v => v < 10 ? g1(v) : k0(v);

/* Bloco de macros: gramas e % das calorias na primeira linha, g/kg na segunda; fibras em gramas */
function macroGrid(t, W, small){
  const mk = t.c * 4 + t.p * 4 + t.l * 9 || 1;
  const cell = (cls, k, grams, kcal) => h("div", null,
    h("div", {class: "k " + cls}, k),
    h("div", {class: "v"}, fmtG(grams), h("small", null, "g"), h("span", {class: "pc"}, `${Math.round(kcal / mk * 100)}%`)),
    h("div", {class: "s"}, W ? `${nf2.format(grams / W)} g/kg` : "\u00a0"));
  return h("div", {class: "mwrap" + (small ? " sm" : "")},
    h("div", {class: "mgrid"}, cell("t-c", "Carboidratos", t.c, t.c * 4), cell("t-p", "Proteínas", t.p, t.p * 4), cell("t-g", "Gorduras", t.l, t.l * 9)),
    h("div", {class: "fib"}, h("span", {class: "t-f"}, "Fibras"), h("b", null, `${fmtG(t.f)} g`),
      t.kcal ? h("span", {class: "s"}, `${g1(t.f * 1000 / t.kcal)} g por 1.000 kcal`) : null));
}
/* "Total do almoço", "Total da ceia" */
function totalOf(name){
  const n = (name || "").trim();
  if (!n) return "Total da refeição";
  const fem = /^(ceia|colação|colacao|merenda|refeição|sobremesa|marmita)\b/i.test(n);
  return `Total ${fem ? "da" : "do"} ${n.charAt(0).toLowerCase() + n.slice(1)}`;
}

/* ---------- início ---------- */
load();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v && v.name) view = v; } catch (e) {}
render();
})();
</script>
