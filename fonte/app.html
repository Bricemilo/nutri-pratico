    h("p", null, "Crianças e adolescentes (3 a 18 anos): DRI 2005, que inclui a energia para o crescimento. Os fatores de atividade da FAO/OMS 1985 foram definidos para adultos, então não entram na média. O app não aplica déficit calórico automático."),
    h("p", null, "Abaixo de 3 anos o app mostra só a taxa basal, porque as equações de gasto total dessa faixa dependem de outras informações."),
    h("h3", null, "Composição dos alimentos"),
    h("p", null, "TACO 4ª edição (NEPA/UNICAMP, 2011). Quando a TACO marca um valor como “em reanálise”, o app não usa zero: avisa que o total pode estar subestimado. “Traço” e “não se aplica” valem zero."),
    h("p", null, "Medidas caseiras: Tabela de Medidas Referidas da POF 2008–2009 (IBGE)."),
    h("h3", null, "Porcentagens dos macronutrientes"),
    h("p", null, "Usam 4 kcal/g para carboidratos e proteínas e 9 kcal/g para gorduras. A energia total vem da própria TACO; por isso ela pode diferir um pouco da soma dos macronutrientes."),
    h("h3", null, "Hidratação"),
    h("p", null, "Adultos: estimativa prática de 35 mL de água por kg de peso por dia, um ponto de partida que pode ser substituído por um valor definido pela pessoa. Abaixo de 18 anos o app não calcula. Não há acréscimo automático por exercício: a perda de suor varia muito, e o ACSM (2007) recomenda ajustar a reposição individualmente. Referências de água total (alimentos e bebidas): EFSA 2010 e IOM 2004."),
    h("h3", null, "Suplementos, medicamentos e exames"),
    h("p", null, "O app apenas organiza o que a pessoa informa: não recomenda doses, não sugere periodicidade de exames e não interpreta resultados."),
    h("h3", null, "Substituições"),
    h("p", null, "Sugere alimentos com o mesmo papel principal (fonte de carboidrato, proteína ou gordura) e calcula a quantidade com a mesma energia, carboidratos ou proteínas. Alimentos equivalentes nesse critério não são nutricionalmente idênticos."),
    h("p", null, "Este app organiza o planejamento. Ele não substitui orientação de nutricionista ou médico, especialmente para crianças, gestantes e pessoas com doenças."));
}

/* ---------- Necessidade energética ----------
   Resumo primeiro (TMB, GET e protocolo escolhido); as equações ficam em "Fórmulas e cálculos". */
// Limitações em uma frase, exibidas sob o seletor (o detalhe fica em "Como o Nutri Prático calcula").
const METHOD_NOTE = {
  dri: "Padrão. Estima o gasto total por idade, peso, altura e atividade. Feita para pessoas saudáveis; em sobrepeso, gestação ou doenças é menos precisa.",
  fao: "Taxa basal pelo peso (Schofield) × fator de atividade. Não usa a altura; os fatores descrevem grupos, não indivíduos.",
  media: "Média das duas estimativas. Não é um método científico próprio: serve para comparar os protocolos."};
const METHOD_LABEL = {media: "Média FAO/OMS 1985 + DRI 2005", fao: "FAO/OMS 1985", dri: "DRI 2005", "fao-tmb": "FAO/OMS 1985 · só taxa basal"};
/* ---------- cadastro e edição de perfil ---------- */
function maskDate(v){ const d = v.replace(/\D/g, "").slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d; }
function toISO(br){
  const m = br.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || dt > new Date() || y < 1900) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
const fromISO = iso => iso ? iso.split("-").reverse().join("/") : "";
function profileSheet(p){
  const editing = !!p;
  let sex = p ? p.sex : null;
  sheet(editing ? "Editar perfil" : "Novo perfil", (el, close) => {
    const name = h("input", {class: "input", id: "pf-nome", placeholder: "Nome", value: p ? p.name : "", enterkeyhint: "next", autocapitalize: "words", autocomplete: "off"});
    const birth = h("input", {class: "input num", id: "pf-nasc", placeholder: "dd/mm/aaaa", inputmode: "numeric", value: p ? fromISO(p.birth) : "", autocomplete: "off"});
    const err = h("div", {class: "err"});
    const seg = h("div", {class: "seg big", role: "radiogroup", "aria-label": "Sexo"});
    const ok = h("button", {class: "btn primary block", type: "submit"}, editing ? "Salvar" : "Criar perfil");
    const paintSeg = () => seg.replaceChildren(...[["F", "Feminino"], ["M", "Masculino"]].map(([v, l]) =>
      h("button", {type: "button", class: sex === v ? "on" : "", role: "radio", "aria-checked": String(sex === v), onclick: () => { sex = v; paintSeg(); check(); }}, l)));
    const check = () => { ok.disabled = !(name.value.trim() && toISO(birth.value) && sex); };
    name.addEventListener("input", check);
    name.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); birth.focus(); } });
    birth.addEventListener("input", () => {
      birth.value = maskDate(birth.value);
      err.textContent = birth.value.length === 10 && !toISO(birth.value) ? "Data inválida. Use dd/mm/aaaa." : "";
      if (birth.value.length === 10 && toISO(birth.value)) birth.blur();
      check();
    });
    paintSeg(); check();
    const delWrap = h("div", {style: "margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"});
    const idle = () => delWrap.replaceChildren(h("button", {class: "btn danger block", type: "button", onclick: () => ask(delWrap, `Excluir o perfil de ${p.name} e todo o plano dele? Isso não pode ser desfeito.`, [{label: "Excluir", fn: () => {
      S.patients = S.patients.filter(x => x.id !== p.id);
      if (S.activeId === p.id) S.activeId = (S.patients[0] || {}).id || null;
      saveNow(); close(); go({tab: "hoje", open: [], edit: null}); toast("Perfil excluído");
    }}])}, "Excluir perfil"));
    if (editing) idle();
    const form = h("form", null,
      h("h2", null, editing ? "Editar perfil" : "Novo perfil"), h("p", {class: "sh-sub"}, editing ? "" : "Você pode cadastrar cada pessoa da família."),
      h("div", {class: "field"}, h("label", {for: "pf-nome"}, "Nome"), name),
      h("div", {class: "field"}, h("label", {for: "pf-nasc"}, "Data de nascimento"), birth, err),
      h("div", {class: "field"}, h("label", null, "Sexo (usado nas equações de energia)"), seg),
      h("div", {class: "row-actions"}, h("button", {class: "btn ghost", type: "button", onclick: close}, "Cancelar"), ok),
      editing ? delWrap : null);
    form.addEventListener("submit", e => {
      e.preventDefault(); check(); if (ok.disabled) return;
      if (editing){ p.name = name.value.trim(); p.birth = toISO(birth.value); p.sex = sex; touch(p); close(); render(); return; }
      const np = {id: uid(), name: name.value.trim(), birth: toISO(birth.value), sex, updated: Date.now(),
        energy: {weight: null, height: null, fao: 1, dri: 1}, plan: {objective: "", target: null, meals: []}};
      S.patients.push(np); S.activeId = np.id; saveNow(); close(); go({tab: "perfil", open: [], edit: null}); toast(`Perfil de ${firstName(np.name)} criado`);
      setTimeout(() => bodySheet(np), 320);   // próximo passo natural: peso e altura
    });
    el.append(form);
    if (!editing) setTimeout(() => name.focus(), 60);
  });
}

/* ---------- dados e backup ---------- */
const DAY = 864e5;
const nPeople = n => n === 1 ? "1 perfil" : `${n} perfis`;
function dataRow(){
  const real = S.patients.filter(p => !p.example).length;
  const days = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / DAY) : null;
  const due = real > 0 && (days == null || days >= 7);
  const when = days == null ? "Nenhum backup feito ainda" : days === 0 ? "Último backup: hoje" : days === 1 ? "Último backup: ontem" : `Último backup: há ${days} dias`;
  return h("div", {class: "datacard" + (due ? " due" : "")},
    h("span", {class: "dc-ic", html: ICON.lock}),
    h("div", {class: "dc-t"}, h("b", null, "Salvos só neste aparelho"), h("span", null, when)),
    h("button", {class: "btn sm " + (due ? "primary" : "ghost"), onclick: backupSheet}, due ? "Fazer backup" : "Backup"));
}
function backupSheet(){
  const backupText = () => JSON.stringify({app: "nutri-pratico", version: VERSION, exported: new Date().toISOString(), data: S});
  sheet("Backup", (el, close) => {
    const status = h("div", {class: "err", style: "color:var(--muted)"});
    const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});
    const confirmBox = h("div");
    const marked = () => { S.lastBackup = Date.now(); saveNow(); };
    async function exportNow(){
      const name = `nutri-pratico-backup-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([backupText()], {type: "application/json"});
      const done = () => { marked(); status.textContent = "Backup gerado. Guarde o arquivo em Arquivos, iCloud ou e-mail."; };
      try {
        const f = new File([blob], name, {type: "application/json"});
        if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: "Backup Nutri Prático"}); done(); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      try { const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); done(); }
      catch (e) { status.textContent = "Não foi possível gerar o arquivo neste navegador."; }
    }
    function copyNow(){
      const txt = backupText();
      const ok = () => { marked(); status.textContent = "Backup copiado. Cole em “Colar backup” no app instalado."; };
      const fallback = () => {
        const ta = h("textarea", {style: "position:fixed;top:-1000px"}); ta.value = txt; document.body.append(ta); ta.select();
        try { document.execCommand("copy") ? ok() : (status.textContent = "Não foi possível copiar."); } catch (e) { status.textContent = "Não foi possível copiar."; }
        ta.remove();
      };
      try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
    }
    const pasteArea = h("textarea", {class: "input", id: "bk-colar", rows: "4", placeholder: "Toque aqui, segure e escolha Colar", style: "height:auto;padding:12px 14px;font-size:16px;resize:vertical"});
    const pasteBox = h("div", {class: "bk-row"}, pasteArea, h("button", {class: "btn primary block", type: "button", onclick: () => offerRestore(pasteArea.value)}, "Continuar"));
    pasteBox.hidden = true;
    file.addEventListener("change", () => {
      const f = file.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => offerRestore(rd.result); rd.readAsText(f); file.value = "";
    });
    function offerRestore(text, label){
      let b; try { b = JSON.parse(String(text).trim()); } catch (e) {}
      const d = b && (b.data || (Array.isArray(b.patients) ? b : null));
      if (!d || !Array.isArray(d.patients) || !d.prefs) { status.textContent = "Esse conteúdo não é um backup do Nutri Prático."; return; }
      put(confirmBox, h("div", {class: "confirm", style: "flex-wrap:wrap"},
        h("span", {style: "flex:1 1 100%"}, `Substituir ${nPeople(S.patients.length)} deste aparelho por ${nPeople(d.patients.length)} ${label || (b.exported ? "do backup de " + new Date(b.exported).toLocaleDateString("pt-BR") : "do backup")}?`),
        h("button", {class: "btn ghost", type: "button", style: "flex:1", onclick: () => confirmBox.replaceChildren()}, "Cancelar"),
        h("button", {class: "btn primary", type: "button", style: "flex:1", onclick: () => {
          const prev = JSON.stringify(S);
          try { localStorage.setItem(KEY + ".antes-de-restaurar", prev); } catch (e) {}
          try { localStorage.setItem(KEY, JSON.stringify(d)); }
          catch (e) { status.textContent = "Não foi possível restaurar: o armazenamento deste aparelho está cheio ou bloqueado. Nada foi alterado."; confirmBox.replaceChildren(); return; }
          for (const f of db.list.filter(x => x.own)) db.remove(f.id);
          S = null; load(); close(); go({tab: "hoje", open: [], edit: null}); toast("Backup restaurado");
        }}, "Restaurar")));
    }
    let snap = null; try { for (const k of SNAPS) if (!snap) snap = localStorage.getItem(k); } catch (e) {}   // a cópia mais recente feita antes de uma atualização
    el.append(h("h2", null, "Backup"),
      h("p", {class: "sh-sub"}, S.lastBackup ? `Último backup: ${new Date(S.lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda."),
      h("p", {class: "note", style: "margin:-8px 0 14px"}, "O backup contém os dados de saúde da família, sem criptografia. Guarde o arquivo em um lugar só seu."),
      h("div", {class: "bk-row"},
        embedded ? null : h("button", {class: "btn primary block", type: "button", onclick: exportNow}, "Exportar backup (arquivo)"),
        h("button", {class: embedded ? "btn primary block" : "btn ghost block", type: "button", onclick: copyNow}, "Copiar backup"),
        h("div", {class: "eyebrow", style: "margin-top:8px"}, "Restaurar"),
        h("button", {class: "btn ghost block", type: "button", onclick: () => { pasteBox.hidden = false; pasteArea.focus(); }}, "Colar backup"),
        embedded ? null : h("button", {class: "btn ghost block", type: "button", onclick: () => file.click()}, "Restaurar de um arquivo"),
        snap ? h("button", {class: "btn ghost block", type: "button", onclick: () => offerRestore(snap, "da cópia automática feita antes da atualização")}, "Voltar à cópia de antes da atualização") : null,
        pasteBox, file, status, confirmBox,
        h("button", {class: "btn plain block", type: "button", onclick: close}, "Fechar")));
  });
}

/* ---------- início ---------- */
(() => {   // tamanho de texto do iPhone (Ajustes → Tela e Brilho → Tamanho do Texto), com limite para o layout não quebrar
  const pr = document.createElement("span"); pr.style.font = "-apple-system-body"; pr.textContent = "a"; document.body.append(pr);
  const px = pr.style.font ? parseFloat(getComputedStyle(pr).fontSize) : 0; pr.remove();
  if (px) document.documentElement.style.fontSize = Math.min(24, Math.max(15, px)) + "px";
  document.documentElement.classList.toggle("big-text", px >= 19);   // texto ampliado: layouts de 4 colunas viram 2×2
})();
load();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v && TABS.some(t => t[0] === v.tab)) view = Object.assign(view, v, {edit: null}); if (view.sub === "favoritos") view.sub = "plano"; } catch (e) {}
render();
})();
